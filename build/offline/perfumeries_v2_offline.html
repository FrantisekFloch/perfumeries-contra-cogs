<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfumeries — Contra COGS Reconciliation</title>
  <style>
:root {
  --bg: #f5f5f5;
  --panel: #ffffff;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --border: #e5e5e5;
  --btn-ink: #333333; /* dark grey — readable button text on light/ghost/chip buttons */
  --accent: #2d6cdf;
  --ok: #1c9c6b;
  --warn: #e0a400;
  --err: #e74c3c;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
}

.app-header {
  background: var(--ink);
  color: #fff;
  padding: 14px 22px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.app-header h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
.app-header .subtitle { color: #b9b9b9; font-size: 0.85rem; }

main { max-width: 1360px; margin: 22px auto; padding: 0 18px; display: grid; gap: 18px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
}
.panel h2 { margin: 0 0 12px; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

.scan-status { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.scan-status li { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; }
.scan-status .src { font-weight: 600; min-width: 120px; }
.scan-status .state { color: var(--muted); }
.scan-status .state.found { color: var(--ok); }
.scan-status .state.error { color: var(--err); }

.app-footer {
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
  padding: 14px;
}

.summary { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.summary li { font-size: 0.95rem; }
.summary li strong { font-size: 1.05rem; color: var(--accent); }
.summary li.warn { color: var(--warn); }
.summary li.err { color: var(--err); }
.hint { color: var(--muted); font-size: 0.85rem; margin-top: 14px; }

.model-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
@media (max-width: 640px) { .model-choices { grid-template-columns: 1fr; } }
.model-btn {
  text-align: left; background: #fff; border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; cursor: pointer; display: grid; gap: 6px;
  transition: border-color .15s, box-shadow .15s;
}
.model-btn:hover { border-color: var(--accent); }
.model-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,108,223,0.15); }
.model-btn .model-name { font-weight: 700; font-size: 1rem; }
.model-btn .model-desc { color: var(--muted); font-size: 0.85rem; }
.badge {
  display: inline-block; font-size: 0.72rem; font-weight: 700; color: #fff;
  background: var(--accent); border-radius: 999px; padding: 2px 10px; vertical-align: middle; margin-left: 8px;
}

.summary-line { font-size: 0.9rem; color: var(--ink); margin: 12px 0 0; }
.summary-line .warn { color: var(--warn); }
.summary-line .err { color: var(--err); }

.role-bar { max-width: 1360px; margin: 0 auto; padding: 0 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.role-tab {
  background: #fff; border: 1px solid var(--border); border-bottom: none;
  border-radius: 8px 8px 0 0; padding: 10px 18px; cursor: pointer; font-weight: 600; color: var(--btn-ink);
}
.role-tab.active { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }

.dash-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dash-head h3 { margin: 0; }
.filter select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }

h3 { margin: 4px 0 12px; }
h4 { margin: 18px 0 8px; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

table.grid { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.grid th, table.grid td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
table.grid th { color: var(--muted); font-weight: 600; }
table.grid tbody tr:hover { background: #fafafa; }

.muted { color: var(--muted); font-size: 0.9rem; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 4px; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
.card .k { color: var(--muted); font-size: 0.8rem; }
.card .v { font-size: 1.4rem; font-weight: 700; color: var(--accent); }

button.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }

.inv-controls { display: flex; align-items: center; gap: 10px; }
.btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 12px; cursor: pointer; font: inherit; font-weight: 600; }
.btn:hover { filter: brightness(1.05); }
.inv-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.inv-card-head { font-size: 1rem; margin-bottom: 4px; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; background: #eef2fb; color: var(--accent); border-radius: 999px; padding: 2px 10px; }

.kv { list-style: none; margin: 6px 0 4px; padding: 0; display: grid; gap: 4px; }
.kv li { display: flex; gap: 10px; font-size: 0.92rem; }
.kv li span { color: var(--muted); min-width: 90px; }

/* header controls */
.app-header { justify-content: space-between; align-items: center; }
.app-header .brand { display: flex; align-items: baseline; gap: 12px; }
.header-controls { display: flex; align-items: center; gap: 12px; }
.hc-model { display: flex; align-items: center; gap: 6px; color: #cfcfcf; font-size: 0.8rem; }
.hc-model select { padding: 4px 6px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
.hc-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.85rem; }
.hc-btn:hover { filter: brightness(1.08); }
.lang { display: flex; gap: 4px; }
.lang .flag { background: #2a2a2a; color: #cfcfcf; border: 1px solid #444; border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 0.8rem; }
.lang .flag.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* charts */
.chart-wrap { border: 1px solid var(--border); border-radius: 10px; padding: 8px; background: #fff; }
.chart { width: 100%; height: auto; display: block; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-left: 8px; }
.legend-dot.forecast { background: var(--warn); }
.legend-label { font-size: 0.75rem; color: var(--muted); text-transform: none; letter-spacing: 0; }

/* tour */
.tour-overlay { position: absolute; inset: 0; z-index: 9999; pointer-events: none; }
.tour-ring { position: absolute; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); transition: all .35s ease; }
.tour-pointer { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: rgba(45,108,223,0.85); border: 2px solid #fff; transition: transform .5s cubic-bezier(.4,.2,.2,1); }
.tour-pointer.click { animation: tourClick .5s ease; }
@keyframes tourClick { 0% { box-shadow: 0 0 0 0 rgba(45,108,223,0.5);} 100% { box-shadow: 0 0 0 22px rgba(45,108,223,0);} }
.tour-box { position: absolute; width: 320px; background: #1a1a1a; color: #fff; border-radius: 10px; padding: 14px 16px; pointer-events: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.tour-box p { margin: 0 0 12px; font-size: 0.9rem; line-height: 1.4; }
.tour-actions { display: flex; justify-content: flex-end; gap: 8px; }
.tour-actions button { border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.82rem; }
.tour-skip { background: transparent; color: #cfcfcf; }
.tour-next { background: var(--accent); color: #fff; }
.tour-box { transition: left .35s ease, top .35s ease; }
.tour-h { margin: 0 0 8px; font-size: 1.05rem; color: #fff; }

/* satellite arrow-tips pointing at parts of the screen */
.tour-satellites { position: absolute; inset: 0; pointer-events: none; }
.tour-tip {
  position: absolute; width: 220px; background: #fffdf4; color: #3a2f00;
  border: 1px solid #e7d9a6; border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 8px 10px; font-size: 0.78rem; line-height: 1.35;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18); pointer-events: none;
  opacity: 0; transform: translateY(6px); animation: tipIn .45s ease forwards;
}
@keyframes tipIn { to { opacity: 1; transform: translateY(0); } }
.tour-tip-arrow { display: none; }

/* boot connect loader */
.boot-overlay { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: rgba(26,26,26,0.55); backdrop-filter: blur(2px); }
.boot-card { width: 440px; max-width: 92vw; background: #141414; color: #eaeaea; border: 1px solid #2c2c2c; border-radius: 12px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); font-family: var(--font); }
.boot-title { display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 600; margin-bottom: 14px; }
.boot-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(45,108,223,0.6); animation: bootPulse 1.4s infinite; }
@keyframes bootPulse { 0% { box-shadow: 0 0 0 0 rgba(45,108,223,0.6);} 100% { box-shadow: 0 0 0 12px rgba(45,108,223,0);} }
.boot-bar { height: 6px; background: #2a2a2a; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
.boot-bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #5b8def); border-radius: 999px; transition: width .5s ease; }
.boot-log { list-style: none; margin: 0; padding: 0; overflow: hidden; display: grid; gap: 8px; }
.boot-step { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #9a9a9a; }
.boot-step.active { color: #eaeaea; }
.boot-step.done { color: #7fdcb4; }
.boot-step .ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ok); flex: 0 0 auto; }
.boot-step .ic.spin { border: 2px solid #3a3a3a; border-top-color: var(--accent); border-radius: 50%; animation: bootSpin .7s linear infinite; }
@keyframes bootSpin { to { transform: rotate(360deg); } }

/* about manual + chart legend */
.manual { margin: 4px 0 8px; padding-left: 18px; display: grid; gap: 8px; }
.manual li { font-size: 0.92rem; line-height: 1.45; }
.chart-legend { font-size: 0.8rem; color: var(--muted); margin: 8px 0 2px; }
.chart-legend .lg { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin-right: 6px; }
.chart-legend .lg-actual { border-top: 3px solid var(--accent); }
.chart-legend .lg-forecast { border-top: 3px dashed var(--warn); }
.small { font-size: 0.8rem; }

/* ---- Inventory: tabs, filters, collapse, chips (tasks 2/3/7) ---- */
.inv-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
.chip-btn {
  border: 1px solid var(--border); background: #fff; color: var(--btn-ink);
  border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
}
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }
.chip-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: #fff; color: var(--btn-ink); border: 1px solid var(--border); font-weight: 600; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }

.inv-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.inv-list { display: grid; gap: 12px; margin-top: 8px; }

.inv-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.inv-card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.inv-card-head strong { font-size: 0.98rem; }
.inv-card-head .tag {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
  background: #eef2fb; color: var(--accent); border: 1px solid #dbe6fb;
}
.inv-toggle {
  border: none; background: var(--ink); color: #fff;
  width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 1.05rem; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
}
.inv-toggle:hover { background: var(--accent); }
.inv-card-body { margin-top: 10px; }
.inv-card.collapsed .inv-card-body { display: none; }
.chips-inline { margin-left: auto; }
.row-date { font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.inv-doc-sm { font-size: 0.74rem !important; padding: 4px 9px !important; }
.inv-filter-sep { display: inline-block; width: 1px; height: 20px; background: var(--border); margin: 0 4px; vertical-align: middle; }
.row-flag { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.flag-over { background: #fdf6d9; color: #9a7a12; border: 1px solid #f0e2a6; }
.flag-short { background: #fdecec; color: #b23b30; border: 1px solid #f6cfcb; }

/* received-situation chips (unclickable, small, fit in one row) */
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; border: 1px solid transparent;
  font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; cursor: default;
}
.chip-received { background: #e3f6ec; color: #1c7a53; border-color: #bfe8d2; }
.chip-pending  { background: #fdecec; color: #b23b30; border-color: #f6cfcb; }
.chip-short    { background: #fdf6d9; color: #9a7a12; border-color: #f0e2a6; }
.chip-over     { background: #fdf6d9; color: #9a7a12; border-color: #f0e2a6; }
.chip-rerouted { background: #fdf6d9; color: #9a7a12; border-color: #f0e2a6; }
.chip-delayed  { background: #fff1de; color: #a8630c; border-color: #f5d9b0; }
.chip-lost     { background: #fbe0de; color: #a01d12; border-color: #f2b6b0; text-decoration: line-through; }
.sit-full { margin: 4px 0 2px; }
.qty-short { color: var(--err); font-weight: 700; }
.qty-over { color: #9a7a12; font-weight: 700; }
.over-warn {
  margin: 6px 0 2px; padding: 8px 10px; font-size: 0.86rem;
  background: #fdf6d9; border: 1px solid #f0e2a6; border-left: 3px solid var(--warn);
  border-radius: 8px; color: #7a5f08; cursor: help;
}
.src-fyi { font-size: 0.72rem; color: var(--muted); font-style: italic; }
.cc-miss {
  margin: 6px 0 2px; padding: 8px 10px; font-size: 0.86rem;
  background: #fff6e6; border: 1px solid #f0dca6; border-left: 3px solid var(--warn);
  border-radius: 8px; color: #7a5a08; cursor: help;
}

/* ---- Finance issue indicators (task 7) ---- */
.issues { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 12px; }
.issue {
  border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: #fff;
  display: flex; flex-direction: column; gap: 4px;
}
.issue .v { font-size: 1.5rem; font-weight: 700; }
.issue .k { font-size: 0.82rem; color: var(--muted); }
.issue.ok   { border-left: 4px solid var(--ok); }
.issue.warn { border-left: 4px solid var(--warn); }
.issue.info { border-left: 4px solid var(--accent); }
.issue.bad  { border-left: 4px solid var(--err); }

.small { font-size: 0.82rem; }
.situation-line {
  margin: 6px 0 14px; padding: 10px 12px; font-size: 0.9rem;
  background: #eef4ff; border: 1px solid #d5e2fb; border-left: 3px solid var(--accent);
  border-radius: 8px; color: #234;
}
/* Home — page 0 (clean, editorial) */
.home-hero { padding: 8px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 26px; }
.home-eyebrow { display: inline-block; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.home-hero h2 { margin: 0 0 14px; font-size: 1.9rem; font-weight: 600; letter-spacing: -0.01em; }
.home-lead { font-size: 1.02rem; line-height: 1.6; color: #2a2a2a; margin: 0 0 12px; }
.home-sub { font-size: 0.92rem; line-height: 1.6; color: var(--muted); margin: 0; }
.home-h { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 14px; }
.home-metrics { margin-bottom: 34px; }
.home-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.home-kpi { background: #fff; padding: 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.home-kpi .v { font-size: 1.5rem; font-weight: 600; line-height: 1.1; }
.home-kpi .k { font-size: 0.78rem; color: var(--muted); }
.home-kpi.accent .v { color: var(--accent); }
.home-kpi.warn .v { color: #a8630c; }
.home-kpi.ok .v { color: var(--ok); }
.home-alerts { display: flex; flex-wrap: wrap; gap: 8px; }
.home-alert { font-size: 0.82rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: #fff; }
.home-alert.warn { background: #fffaf0; color: #7a5f08; border-color: #f0e2a6; }
.home-alert.info { background: #f4f8ff; color: #234; border-color: #d5e2fb; }
.home-alert.ok { background: #f1faf5; color: #1c7a53; border-color: #bfe8d2; }
.home-navtext { line-height: 1.6; color: #2a2a2a; margin: 0 0 16px; }
/* Contra COGS definitions — two-card block between the welcome and the nav cards */
.home-def { margin-bottom: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
.home-def-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.home-def-card { background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; padding: 18px 20px; display: grid; gap: 8px; align-content: start; }
.home-def-card .hd-tag { display: inline-block; justify-self: start; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; background: #eef4ff; border-radius: 999px; padding: 3px 10px; }
.home-def-card .hd-name { font-weight: 600; font-size: 1.02rem; letter-spacing: -0.01em; }
.home-def-card .hd-body { font-size: 0.9rem; line-height: 1.55; color: var(--muted); margin: 0; }
.home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.home-card { text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; cursor: pointer; display: grid; gap: 6px; transition: border-color .15s, box-shadow .15s; font: inherit; }
.home-card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(45,108,223,0.08); }
.home-card .hc-t { font-weight: 600; font-size: 0.98rem; }
.home-card .hc-d { font-size: 0.84rem; color: var(--muted); line-height: 1.45; }

/* About — terms & conditions style manual */
.about-doc h3 { margin-top: 0; }
.about-layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
.about-toc { position: sticky; top: 12px; background: #fafafa; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.about-toc-t { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
.about-toc ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.about-toc a { color: var(--accent); text-decoration: none; font-size: 0.86rem; }
.about-toc a:hover { text-decoration: underline; }
.about-sec { padding: 6px 0 14px; border-bottom: 1px solid var(--border); scroll-margin-top: 12px; }
.about-sec:last-child { border-bottom: none; }
.about-sec h4 { margin: 8px 0; }
.about-body p { line-height: 1.55; }
.manual { line-height: 1.55; }
.glossary { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: #333; }
@media (max-width: 720px) { .about-layout { grid-template-columns: 1fr; } .about-toc { position: static; } }
.grid.pl { max-width: 460px; }
.grid.pl td.num { text-align: right; }
.grid.pl .pl-strong td { font-weight: 700; border-top: 2px solid var(--ink); }

/* ---- Connect a new source (task 4) ---- */
.connect-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
.connect-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin-right: 4px; }

.modal { position: fixed; inset: 0; background: rgba(20,20,20,0.5); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal[hidden] { display: none; }
.modal-card { background: #fff; border-radius: 12px; width: min(480px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,0.25); overflow: hidden; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; font-size: 1rem; }
.modal-x { border: none; background: none; font-size: 1.1rem; cursor: pointer; color: var(--btn-ink); font-weight: 700; }
.modal-x:hover { color: var(--err); }
.modal-body { padding: 16px 18px; display: grid; gap: 10px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); background: #fafafa; }
.fld { display: grid; gap: 4px; }
.fld span { font-size: 0.82rem; color: var(--muted); }
.fld input, .fld select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-family: var(--font); }
.fld input:focus, .fld select:focus { outline: none; border-color: var(--accent); }

/* ---- Invoice document (task 9) ---- */
.doc-modal-card { width: min(820px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
.doc-modal-actions { display: flex; align-items: center; gap: 8px; }
#doc-modal-body { overflow: auto; }
.invoice-doc { background: #fff; color: #1a1a1a; padding: 8px 4px; font-size: 0.88rem; }
.doc-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
.doc-brand { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.04em; }
.doc-title { font-size: 1rem; font-weight: 700; color: var(--muted); }
.doc-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.doc-party-t { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.doc-ids { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; font-size: 0.78rem; color: var(--muted); }
.doc-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px; background: #f7f7f7; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.doc-meta div { display: flex; flex-direction: column; }
.doc-meta span { font-size: 0.7rem; color: var(--muted); }
.doc-lines { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.doc-lines th, .doc-lines td { border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; }
.doc-lines th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); background: #fafafa; }
.doc-lines .num { text-align: right; white-space: nowrap; }
.doc-totals { margin-left: auto; width: 300px; display: grid; gap: 4px; margin-bottom: 12px; }
.doc-totals div { display: flex; justify-content: space-between; padding: 3px 0; }
.doc-totals .grand { border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 8px; font-size: 1.05rem; }
.doc-pay { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.82rem; border-top: 1px solid var(--border); padding-top: 10px; }
.doc-pay span { color: var(--muted); }
.doc-reg { font-size: 0.72rem; color: var(--muted); margin: 8px 0 2px; }
.doc-einv { font-size: 0.78rem; color: #1c7a53; background: #e9f7ef; border: 1px solid #c6ecd6; border-radius: 8px; padding: 8px 10px; }
.doc-split { margin-top: 22px; border-top: 3px dashed var(--border); padding-top: 16px; }
.doc-split-h { margin: 0 0 4px; }
.doc-split .split-total td { font-weight: 700; border-top: 2px solid var(--ink); background: #fafafa; }
@media print { .doc-split { break-before: page; } }
@media print {
  .app-header, .app-footer, #scan-panel, #role-bar, .modal-head { display: none !important; }
  .modal, .modal-card { position: static; background: #fff; box-shadow: none; max-height: none; }
}

/* ---- Login gate (demo) ---- */
.login-screen, .denied-screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #1a1a1a 0%, #23324a 100%); z-index: 100; padding: 20px;
}
.login-screen[hidden], .denied-screen[hidden] { display: none; }
.login-card {
  background: #fff; border-radius: 14px; padding: 32px 30px; width: min(380px, 92vw);
  box-shadow: 0 18px 50px rgba(0,0,0,0.35); display: grid; gap: 14px;
}
.login-brand { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.02em; }
.login-sub { margin: -8px 0 6px; color: var(--muted); font-size: 0.9rem; }
.login-fld { display: grid; gap: 5px; }
.login-fld span { font-size: 0.8rem; color: var(--muted); }
.login-fld input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 0.95rem; }
.login-fld input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,108,223,0.12); }
.login-btn {
  margin-top: 4px; padding: 11px 14px; border: none; border-radius: 8px; cursor: pointer;
  background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: 0.95rem;
}
.login-btn:hover { background: #285fc4; }
.login-err { margin: 0; color: var(--err); font-size: 0.85rem; }
.login-note { margin: 4px 0 0; color: var(--muted); font-size: 0.75rem; line-height: 1.4; }

.denied-card { background: #fff; border-radius: 14px; padding: 34px 30px; width: min(420px, 92vw); text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.35); }
.denied-ico { font-size: 2.6rem; margin-bottom: 8px; }
.denied-card h2 { margin: 0 0 8px; }
.denied-card p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }

/* ===== v2 features ===== */
/* Home digest + exceptions */
.home-digest { background: #f4f8ff; border: 1px solid #d5e2fb; border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; line-height: 1.55; color: #234; }
.home-exceptions { margin-bottom: 26px; }
.exc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.exc-row { display: grid; grid-template-columns: 150px 110px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--border); border-left-width: 3px; border-radius: 8px; background: #fff; font-size: 0.86rem; }
.exc-row.bad { border-left-color: var(--err); }
.exc-row.warn { border-left-color: var(--warn); }
.exc-row.info { border-left-color: var(--accent); }
.exc-type { font-weight: 600; }
.exc-inv { font-variant-numeric: tabular-nums; }
.exc-meta { color: var(--muted); }
.exc-risk { font-weight: 700; text-align: right; }
.home-dq { margin-bottom: 26px; }
.dq-ok { color: var(--ok); margin: 0; }
.dq-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.dq-issue { color: #a8630c; }

/* Journey timeline */
.journey { display: flex; align-items: center; gap: 4px; margin: 10px 0 6px; flex-wrap: wrap; }
.jn-step { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.jn-dot { width: 12px; height: 12px; border-radius: 50%; background: #d9d9d9; border: 2px solid #d9d9d9; }
.jn-step.done .jn-dot { background: var(--ok); border-color: var(--ok); }
.jn-lbl { font-size: 0.72rem; color: var(--muted); }
.jn-step.done .jn-lbl { color: var(--ink); }
.jn-line { flex: 1; min-width: 24px; height: 2px; background: #e0e0e0; margin-bottom: 16px; }
.jn-line.done { background: var(--ok); }

/* inventory action buttons */
.inv-actions { display: flex; gap: 8px; margin: 8px 0; }
/* Draft-chase / What-if contra — highlighted with a red-light background so they stand out
   on invoices that need action. Overrides the .btn.ghost neutral styling. */
.inv-actions .chase-btn, .inv-actions .whatif-btn {
  background: #fdecea; color: #a01d12; border: 1px solid #f2b6b0; font-weight: 600;
}
.inv-actions .chase-btn:hover, .inv-actions .whatif-btn:hover {
  background: #fbdcd8; border-color: var(--err); color: #a01d12;
}

/* SLA timers */
.sla-list { display: grid; gap: 6px; margin-bottom: 8px; }
.sla-row { display: grid; grid-template-columns: 110px 1fr auto auto; gap: 10px; align-items: center; font-size: 0.84rem; }
.sla-bar { height: 8px; background: #eee; border-radius: 999px; overflow: hidden; }
.sla-fill { display: block; height: 100%; }
.sla-fill.ok { background: var(--ok); } .sla-fill.warn { background: var(--warn); } .sla-fill.bad { background: var(--err); }
.sla-meta.bad { color: var(--err); font-weight: 600; } .sla-meta.warn { color: #a8630c; }
.sla-risk { font-weight: 600; text-align: right; }

/* aging heatmap */
.heatmap .heat { font-variant-numeric: tabular-nums; }
.heatmap .heat-0 { color: #bbb; }

/* contra waterfall */
.waterfall { display: grid; gap: 8px; max-width: 560px; margin-bottom: 6px; }
.wf-row { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; font-size: 0.86rem; }
.wf-track { height: 14px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
.wf-fill { display: block; height: 100%; }
.wf-fill.wf-base { background: #c9d6ee; } .wf-fill.wf-good { background: var(--ok); }
.wf-fill.wf-warn { background: var(--warn); } .wf-fill.wf-bad { background: var(--err); }
.wf-v { font-weight: 600; font-variant-numeric: tabular-nums; }

/* tier progress */
.tier-list { display: grid; gap: 10px; max-width: 620px; }
.tier-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px 12px; align-items: center; }
.tier-track { height: 12px; background: #f0f0f0; border-radius: 999px; overflow: hidden; }
.tier-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); }
.tier-meta { grid-column: 2; font-size: 0.8rem; color: var(--muted); }

/* fin head + bulk */
.fin-head, .bulk-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cbh { display: inline-block; width: 16px; }

/* chase + what-if */
.chase-pre { white-space: pre-wrap; font-family: var(--font); font-size: 0.88rem; line-height: 1.5; background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.whatif-ctl { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 0.9rem; }
.whatif-ctl input[type=range] { flex: 1; }
.whatif-ctl output { min-width: 60px; font-weight: 700; text-align: right; }

/* ===== v2 polish ===== */
/* Section separators (light silver line above each section) — Finance + Operations */
.fin-view > h4,
.ops-view > h4,
.ops-view > .bulk-head { border-top: 1px solid #dcdcdc; padding-top: 16px; margin-top: 20px; }
.fin-view > h4:first-of-type,
.ops-view > h4:first-of-type { margin-top: 14px; }
.ops-view > .bulk-head { margin-top: 20px; }
.ops-view > .bulk-head h4 { border: none; padding: 0; margin: 0; }
/* line below the waterfall too (it's the first section) */
.fin-view .waterfall { padding-bottom: 4px; }

/* help "?" badge with tooltip */
.help {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%; background: var(--muted); color: #fff;
  font-size: 0.7rem; font-weight: 700; cursor: help; vertical-align: middle; margin-left: 4px;
}
.help:hover { background: var(--accent); }

/* clickable exception invoice */
.exc-link { border: none; background: none; padding: 0; margin: 0; font: inherit; color: var(--accent); cursor: pointer; text-align: left; font-variant-numeric: tabular-nums; }
.exc-link:hover { text-decoration: underline; }

/* brief highlight when jumping to an invoice */
.inv-flash { animation: invFlash 1.6s ease; }
@keyframes invFlash {
  0% { box-shadow: 0 0 0 3px rgba(45,108,223,0.5); }
  100% { box-shadow: 0 0 0 3px rgba(45,108,223,0); }
}

/* ===== feedback batch ===== */
.qty-disputed { color: #b23b30; font-weight: 700; }
.help.sm { width: 13px; height: 13px; font-size: 0.6rem; }
.home-period { font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; }
.sub-h { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 10px; }

/* two top-aligned columns (snapshot + waterfall, tier + penalty) */
.fin-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
.fin-two-col .fin-col { min-width: 0; }
.fin-two-col .sub-h, .tier-penalty .sub-h { margin-top: 0; }
@media (max-width: 900px) { .fin-two-col { grid-template-columns: 1fr; } }
/* tier progress + penalty calculator side by side (top aligned) */
.tier-penalty { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
.tier-penalty .tier-col, .tier-penalty .penalty-col { min-width: 0; }
.dist-sub { margin-top: 20px; }
@media (max-width: 900px) { .tier-penalty { grid-template-columns: 1fr; } }
.penalty-inline { display: flex; flex-wrap: wrap; gap: 16px; }
.penalty-inline .penalty-row { flex: 1 1 320px; min-width: 300px; }
.penalty-row { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.penalty-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.pen-d { font-weight: 600; font-size: 0.9rem; }
.pen-base { font-size: 0.82rem; color: var(--muted); }
.penalty-ctl { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
.penalty-ctl input[type=range] { flex: 1; }
.penalty-pct { min-width: 44px; font-weight: 600; text-align: right; font-size: 0.9rem; }
.penalty-amt { min-width: 90px; text-align: right; font-weight: 700; color: var(--err); font-size: 0.9rem; }

/* Contra COGS missing opportunity */
.opp-block { margin-bottom: 6px; }
.opp-intro { font-size: 0.9rem; line-height: 1.55; color: #2a2a2a; margin: 0 0 14px; max-width: 900px; }
.opp-cards { max-width: 560px; }
.opp-cards .card.opp-loss { border-left: 3px solid var(--err); }
.opp-cards .card.opp-loss .v { color: var(--err); }
.opp-formula { margin: 6px 0 14px; }

</style>
</head>
<body>
  <header class="app-header" id="app-header" hidden>
    <div class="brand">
      <h1>Perfumeries</h1>
      <span class="subtitle" id="subtitle">Contra COGS Reconciliation</span>
    </div>
    <div class="header-controls">
      <button id="tour-btn" class="hc-btn">Walk me through</button>
      <div class="lang" id="lang-switch">
        <button data-lang="en" class="flag">🇬🇧 EN</button>
        <button data-lang="sk" class="flag">🇸🇰 SK</button>
      </div>
    </div>
  </header>

  <div id="login-screen" class="login-screen">
    <form id="login-card" class="login-card" autocomplete="off">
      <div class="login-brand">Perfumeries</div>
      <p class="login-sub" id="login-sub">Contra COGS Reconciliation</p>
      <label class="login-fld"><span id="login-user-label">User</span>
        <input id="login-user" type="text" autocomplete="username" /></label>
      <label class="login-fld"><span id="login-pass-label">Password</span>
        <input id="login-pass" type="password" autocomplete="current-password" /></label>
      <button class="login-btn" id="login-btn" type="submit">Sign in</button>
      <p class="login-err" id="login-err" hidden></p>
      <p class="login-note" id="login-note"></p>
    </form>
  </div>

  <div id="denied-screen" class="denied-screen" hidden>
    <div class="denied-card">
      <div class="denied-ico">⛔</div>
      <h2 id="denied-title">Access not granted</h2>
      <p id="denied-body">Sorry, you are not granted access to this tool.</p>
      <button class="login-btn" id="denied-back" type="button">Back to sign in</button>
    </div>
  </div>

  <main id="app" hidden>
    <section id="scan-panel" class="panel" hidden>

      <ul id="scan-status" class="scan-status" aria-live="polite"></ul>

        <span class="connect-label" id="connect-label">Connect a new source</span>

        <button class="chip-btn" id="connect-api" data-kind="api">+ API</button>
        <button class="chip-btn" id="connect-folder" data-kind="folder">+ Folder</button>
        <button class="chip-btn" id="connect-upload">⬆ <span id="connect-upload-label">Upload documents</span></button>
        <input type="file" id="upload-input" accept=".xml,.csv" multiple hidden />
      </div>
    </section>

    <div id="doc-modal" class="modal" hidden>
      <div class="modal-card doc-modal-card" role="dialog" aria-modal="true" aria-labelledby="doc-modal-title">
        <div class="modal-head"><h3 id="doc-modal-title">Invoice</h3>
          <div class="doc-modal-actions">
            <button class="btn ghost" id="doc-print" type="button">Print / PDF</button>
            <button class="modal-x" id="doc-close" aria-label="Close">✕</button>
          </div>
        </div>
        <div class="modal-body" id="doc-modal-body"></div>
      </div>
    </div>

    <div id="connect-modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="connect-title">
        <div class="modal-head"><h3 id="connect-title">Connect source</h3>
          <button class="modal-x" id="connect-close" aria-label="Close">✕</button></div>
        <form id="connect-form" class="modal-body"></form>
        <div class="modal-foot">
          <button class="btn ghost" id="connect-cancel" type="button">Cancel</button>
          <button class="btn" id="connect-save" type="button">Connect</button>
        </div>
      </div>
    </div>
    <nav id="role-bar" class="role-bar" hidden></nav>
    <section id="view-root" class="panel" hidden></section>
  </main>

  <footer class="app-footer" id="app-footer" hidden>
    <span id="build-status">loading…</span>
  </footer>

    'about.title': 'User manual',
    'about.intro': 'A quick manual: what the tool does, where its data comes from, what each tab shows, and how to get around.',
    'about.h.overview': 'What it does',
    'about.p.overview': 'Perfumeries reconciles supplier invoices against goods actually received across many warehouses. It detects <strong>Contra COGS gaps</strong> (the difference between the discount baked into an invoice and what is justified by the verified received quantity), tracks each gap to closure, and provides role-based views plus an audit module.',
    'about.h.data': 'How it gets the data',
    'about.p.data': 'On start-up the tool connects to your systems: invoices from the <strong>Database</strong>, credit notes from the <strong>API</strong>, and delivery updates (EDI/RECADV) from each <strong>warehouse</strong> — shown on the connection screen. In this demo the data is read from bundled sample files, but the flow mimics live feeds. The summary at the top shows how many invoices, credit notes and delivery updates arrived from where.',
    'about.h.tabs': 'The tabs',
    'about.tab.storage': '<strong>Storage</strong> — for warehouse teams: what is on the way, pending delivery, aged-pending items, and a monthly debit trend. Filter by a specific warehouse.',
    'about.tab.accounting': '<strong>Accounting</strong> — open vs closed invoices and open value at risk, with actions to mark a fully matched invoice as paid and then archive it (downloads a JSON record).',
    'about.tab.finance': '<strong>Finance</strong> — high-level KPIs (invoices, open value at risk, pending contra credit), invoices by status, storages with open shortfalls, plus charts and a forecast.',
    'about.tab.home': '<strong>Home</strong> — a landing overview: a plain-language digest, an exceptions feed, portfolio KPIs and quick links into every view.',
    'about.tab.operations': '<strong>Operations</strong> — logistics and accounting combined: delivery SLA timers, on-the-way / pending items, open vs closed invoices, and bulk mark-paid.',
    'about.tab.inventory': '<strong>Inventory</strong> — a month-by-month audit: delivered vs invoiced, contra status, receipts by storage with dates, linked delivery and credit notes, and full history. Exportable to JSON.',
    'about.h.nav': 'Getting around',
    'about.p.nav': 'Use the tabs to switch views. In Finance, click “view” on a storage to jump to it filtered. In Inventory, use the month picker or “Show all months”, the status filters, and open any invoice with <strong>View invoice</strong>. Switch language with the 🇬🇧/🇸🇰 flags. Press <strong>Walk me through</strong> for a guided tour.',
    'about.h.models': 'The two Contra COGS models',
    'about.p.models': '<strong>Model A</strong> (direct / line-item): the discounted price is already on the invoice. <strong>Model B</strong> (back-edge): standard price on the invoice, with the discount settled later via a monthly credit note — so the contra credit is held pending until the full volume is delivered.',
    'about.defTitle': 'What is Contra COGS?',
    'about.defBody': 'Contra COGS reduces the cost of goods sold by offsetting margin/marketing contributions against the invoicing for goods. Two models are used: <strong>direct / line-item</strong> (the net discounted price is already on the per-warehouse invoice) and <strong>back-edge allowance</strong> (goods at standard price, with volume/marketing discounts settled monthly via a credit note against the central delivery record). Because deliveries are split across warehouses and can straddle month-end, the discount is only fully earned once the whole volume is confirmed delivered — until then a contra COGS credit is held pending.',
    'about.tocTitle': 'Contents',
    'about.h.inv': 'Reading an invoice in Inventory',
    'about.p.inv': 'Each invoice is a card you can expand or collapse. The collapsed row already shows the invoice number, its status and the per-storage situation chips, so you can scan many invoices fast. Expand a card to see the full detail:',
    'about.inv.chips': '<strong>Received-situation chips</strong> — one per storage the invoice ships to. Green = fully received, yellow = partially received / over-delivered / rerouted, amber = delayed (with an ETA), red = pending or lost. Hover a chip for received/expected quantities.',
    'about.inv.receipts': '<strong>Receipts by storage</strong> — Expected vs Received vs Not delivered vs Disputed per storage, tied to the delivery data. Not-delivered quantities are shown in red, over-delivery (surplus) in yellow, and disputed (damaged) goods in red. The source delivery-note file is shown underneath as FYI.',
    'about.inv.ccmiss': '<strong>Contra COGS miss</strong> — appears when an invoice’s goods were invoiced across more than one month. Because an invoice must carry a delivery date, split deliveries split the tier-qualifying volume across periods, delaying the discount (an FCF impact). Hover for the full explanation.',
    'about.inv.over': '<strong>Over-delivery warning</strong> — when more goods are received than the invoice covers. This usually means another storage or document is short by the same amount; reconcile before closing.',
    'about.inv.filters': '<strong>Filters & months</strong> — filter by status (partially received, in transit, fully matched, has issues), pick a month, or “Show all months”. Collapse/expand all to manage the screen.',
    'about.inv.doc': '<strong>View invoice</strong> opens the full Slovak/English e-invoice (EU format, VAT breakdown, line-item split); <strong>View delivery note</strong> opens the consolidated delivery note merging all warehouse notes for the invoice. Both are printable to PDF.',
    'about.h.statuses': 'Status & colour legend',

    'about.g.ginr': 'Goods Invoiced Not Received — value carried for goods that were invoiced/expected but not yet received.',
    'about.g.fob': 'Free On Board — an Incoterm; FOB shipping point puts in-transit loss risk on the receiver (buyer).',

    'about.g.edi': 'Electronic Data Interchange — structured document exchange between trading partners (AS2, SFTP, X.400).',

    'about.title': 'Používateľská príručka',
    'about.intro': 'Krátka príručka: čo nástroj robí, odkiaľ berie dáta, čo zobrazuje každá záložka a ako sa pohybovať.',
    'about.h.overview': 'Čo nástroj robí',
    'about.p.overview': 'Perfumeries porovnáva faktúry dodávateľa s tovarom skutočne prijatým vo viacerých skladoch. Odhaľuje <strong>Contra COGS medzery</strong> (rozdiel medzi zľavou vo faktúre a tým, čo je podložené overeným prijatým množstvom), sleduje každú medzeru až po vyriešenie a poskytuje pohľady podľa rolí plus audit modul.',
    'about.h.data': 'Odkiaľ berie dáta',
    'about.p.data': 'Pri štarte sa nástroj pripája k vašim systémom: faktúry z <strong>Databázy</strong>, dobropisy z <strong>API</strong> a aktualizácie dodávok (EDI/RECADV) z každého <strong>skladu</strong> — vidíte to na pripájacej obrazovke. V tomto deme sa dáta čítajú z priložených vzorových súborov, no tok napodobňuje živé zdroje. Súhrn hore ukazuje, koľko faktúr, dobropisov a aktualizácií dodávok prišlo odkiaľ.',
    'about.h.tabs': 'Záložky',
    'about.tab.storage': '<strong>Sklad</strong> — pre skladové tímy: čo je na ceste, čaká na dodanie, dlho čakajúce položky a mesačný trend odpisov. Filtrovateľné podľa konkrétneho skladu.',
    'about.tab.accounting': '<strong>Účtovníctvo</strong> — otvorené vs uzavreté faktúry a otvorená riziková hodnota, s akciami označiť plne spárovanú faktúru ako zaplatenú a archivovať ju (stiahne JSON záznam).',
    'about.tab.finance': '<strong>Financie</strong> — kľúčové ukazovatele (faktúry, otvorená riziková hodnota, čakajúci contra dobropis), faktúry podľa stavu, sklady s otvorenými mankami plus grafy a predpoveď.',
    'about.tab.home': '<strong>Domov</strong> — prehľadová stránka: textový súhrn, zoznam výnimiek, ukazovatele portfólia a rýchle odkazy do všetkých pohľadov.',
    'about.tab.operations': '<strong>Prevádzka</strong> — logistika a účtovníctvo spolu: SLA časovače dodávok, položky na ceste / čakajúce, otvorené vs uzavreté faktúry a hromadné akcie.',
    'about.tab.inventory': '<strong>Inventúra</strong> — audit po mesiacoch: dodané vs fakturované, stav contra, príjmy podľa skladu s dátumami, prepojené dodacie listy a dobropisy a celá história. Exportovateľné do JSON.',
    'about.h.nav': 'Navigácia',
    'about.p.nav': 'Záložkami prepínate pohľady. Vo Financiách kliknite na „zobraziť“ pri sklade a prejdete naň s filtrom. V Inventúre použite výber mesiaca alebo „Zobraziť všetky mesiace“, filtre stavu a ktorúkoľvek faktúru otvoríte cez <strong>Zobraziť faktúru</strong>. Jazyk prepnete vlajkami 🇬🇧/🇸🇰. Tlačidlom <strong>Preveď ma</strong> spustíte sprievodcu.',
    'about.h.models': 'Dva modely Contra COGS',
    'about.p.models': '<strong>Model A</strong> (priamy / položkový): zľavnená cena je už na faktúre. <strong>Model B</strong> (zúčtovanie pozadia): na faktúre je štandardná cena a zľava sa vyrovná neskôr mesačným dobropisom — contra dobropis sa teda drží ako čakajúci, kým sa nedodá celý objem.',
    'about.defTitle': 'Čo je Contra COGS?',
    'about.defBody': 'Pri uplatnení Contra COGS (zníženie nákladov predaného tovaru, resp. započítanie maržových/marketingových príspevkov voči fakturácii za tovar) dodávateľ buď vystaví faktúru so zníženou jednotkovou cenou priamo pri expedícii (<strong>položková úprava</strong>), alebo dodáva za štandardné ceny a zľavy vyrovnáva formou dobropisov či súhrnných marketingových/kooperačných faktúr voči centrálnej evidencii dodávok za mesiac (<strong>zúčtovanie pozadia</strong>). Keďže dodávky sú rozdelené do viacerých skladov a môžu presahovať koniec mesiaca, zľava je plne nárokovateľná až po potvrdení celého objemu — dovtedy sa Contra COGS dobropis drží ako čakajúci.',
    'about.tocTitle': 'Obsah',
    'about.h.inv': 'Ako čítať faktúru v Inventúre',
    'about.p.inv': 'Každá faktúra je karta, ktorú môžete rozbaliť alebo zbaliť. Zbalený riadok už zobrazuje číslo faktúry, jej stav a štítky situácie podľa skladu, takže rýchlo prejdete veľa faktúr. Rozbalením karty uvidíte úplný detail:',
    'about.inv.chips': '<strong>Štítky stavu prijatia</strong> — jeden na každý sklad, kam faktúra smeruje. Zelená = plne prijaté, žltá = čiastočne prijaté / nadmerne dodané / presmerované, jantárová = oneskorené (s ETA), červená = čaká alebo stratené. Nájazdom myši uvidíte prijaté/očakávané množstvá.',
    'about.inv.receipts': '<strong>Príjmy podľa skladu</strong> — Očakávané vs Prijaté vs Nedodané vs Reklamované podľa skladu, prepojené s dodávkou. Nedodané množstvá sú červené, prebytok (nadmerne dodané) žltý a reklamovaný (poškodený) tovar červený. Zdrojový dodací list je uvedený nižšie ako informácia.',

// ===== src/lib/models.js =====
// Domain model factories with validation.
// Each factory normalizes input, validates required fields, and returns a frozen object.
// Throws a descriptive Error on invalid input so ingestion can capture the reason.



// ---- validation helpers ---------------------------------------------------

function req(obj, field, ctx) {
  const v = obj[field];
  if (v === undefined || v === null || v === '') {
    throw new Error(`${ctx}: missing required field "${field}"`);
  }
  return v;
}

function num(obj, field, ctx, { min = -Infinity } = {}) {
  const v = obj[field];
  if (typeof v !== 'number' || Number.isNaN(v)) {
    throw new Error(`${ctx}: field "${field}" must be a number (got ${JSON.stringify(v)})`);
  }
  if (v < min) throw new Error(`${ctx}: field "${field}" must be >= ${min} (got ${v})`);
  return v;
}

function optNum(obj, field, ctx, opts) {
  return obj[field] === undefined || obj[field] === null || obj[field] === ''
    ? null
    : num(obj, field, ctx, opts);
}

function oneOf(obj, field, values, ctx) {
  const v = req(obj, field, ctx);
  if (!isEnumValue(values, v)) {
    throw new Error(`${ctx}: field "${field}" must be one of ${values.join('|')} (got "${v}")`);
  }
  return v;
}

// ===== src/lib/xml.js =====
// Minimal, dependency-free XML parser + helpers.
// Sufficient for the tool's controlled, simple schema (elements, attributes, text,
// nesting, self-closing tags). No namespaces/CDATA/entities beyond the basics.
// Works in both Node (tests) and the browser.

const ENTITIES = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&apos;': "'" };
function decode(s) { return s.replace(/&(amp|lt|gt|quot|apos);/g, (m) => ENTITIES[m]); }function encodeXml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/**
 * Parse an XML string into a node tree:
 *   { tag, attrs: {}, children: [node...], text: '' }
 * Returns the root element node. Throws on malformed input.
 */function parseXml(input) {
  if (typeof input !== 'string' || input.trim() === '') throw new Error('XML parse error: empty input');
  const xml = input
    .replace(/<\?xml[\s\S]*?\?>/g, '')
    .replace(/<!--[\s\S]*?-->/g, '')
    .trim();

  let i = 0;
  const len = xml.length;

  function parseTag(raw) {
    const m = raw.match(/^([\w:-]+)/);
    if (!m) throw new Error(`XML parse error: bad tag "${raw}"`);
    const tag = m[1];
    const attrs = {};
    const attrRe = /([\w:-]+)\s*=\s*"([^"]*)"/g;
    let a;
    while ((a = attrRe.exec(raw))) attrs[a[1]] = decode(a[2]);
    return { tag, attrs };
  }

  function parseNodes() {
    const nodes = [];
    let text = '';
    while (i < len) {
      if (xml[i] === '<') {
        if (xml.startsWith('</', i)) {
          const end = xml.indexOf('>', i);
          if (end === -1) throw new Error('XML parse error: unterminated closing tag');
          const tag = xml.slice(i + 2, end).trim();
          i = end + 1;
          if (text.trim()) nodes.push({ text: decode(text.trim()) });
          return { nodes, closed: tag };
        }
        if (text.trim()) nodes.push({ text: decode(text.trim()) });
        text = '';
        const end = xml.indexOf('>', i);
        if (end === -1) throw new Error('XML parse error: unterminated tag');
        let raw = xml.slice(i + 1, end).trim();
        i = end + 1;
        let selfClose = false;
        if (raw.endsWith('/')) { selfClose = true; raw = raw.slice(0, -1).trim(); }
        const { tag, attrs } = parseTag(raw);
        const node = { tag, attrs, children: [], text: '' };
        if (!selfClose) {
          const res = parseNodes();
          if (res.closed !== tag) throw new Error(`XML parse error: mismatched tag </${res.closed}> for <${tag}>`);
          node.children = res.nodes.filter((n) => n.tag);
          node.text = res.nodes.filter((n) => n.text !== undefined && !n.tag).map((n) => n.text).join('');
        }
        nodes.push(node);
      } else {
        text += xml[i++];
      }
    }
    return { nodes };
  }

  const root = parseNodes().nodes.find((n) => n.tag);
  if (!root) throw new Error('XML parse error: no root element');
  return root;
}

// ---- accessors ----function child(node, tag) { return node.children.find((c) => c.tag === tag) || null; }function children(node, tag) { return node.children.filter((c) => c.tag === tag); }function childText(node, tag) { const c = child(node, tag); return c ? c.text : ''; }function attr(node, name) { return node && node.attrs ? (node.attrs[name] ?? null) : null; }

// Dependency-free CSV parser/serializer with quoted-field support (RFC-4180-ish).
// Handles quoted fields, escaped quotes (""), commas and newlines inside quotes.function parseCsv(input) {
  if (typeof input !== 'string') throw new Error('CSV parse error: input is not a string');
  const rows = [];
  let field = '';
  let row = [];
  let inQuotes = false;
  let i = 0;
  const s = input.replace(/\r\n?/g, '\n');
  const n = s.length;

  const pushField = () => { row.push(field); field = ''; };
  const pushRow = () => { rows.push(row); row = []; };

  while (i < n) {

      const alloc = allocs[i];

    model: invoice.contraCogsModel,
    tierPct,

/** Map of stockId -> net unit price under the active model (used by the timing engine). */function netUnitPrices(invoice) {
  const allocs = allocateDiscount(invoice);

// ===== src/lib/timing.js =====
// Timing engine. Assigns receipts to calendar-month periods, detects invoices whose
// receipts straddle a period boundary, produces split debits per period, and carries
// unreceived value as a GINR accrual flagged "value missing — locate". The full
// liability is always retained (never netted down). FOB shipping point puts
// in-transit loss risk on the receiver.





/** Calendar-month period 'YYYY-MM' from a datetime string. */function periodOf(datetime) {
  const m = String(datetime).match(/^(\d{4})-(\d{2})/);
  return m ? `${m[1]}-${m[2]}` : null;
}

/** Distinct periods present in a set of receipts (sorted). */function periodsOf(goodsReceipts) {
  return [...new Set(goodsReceipts.map((g) => periodOf(g.receiptDatetime)).filter(Boolean))].sort();
}

/** True if the receipts span more than one calendar month. */function straddles(goodsReceipts) {
  return periodsOf(goodsReceipts).length > 1;
}

/**
 * One split debit per period: net value of units received in that period.
 * Uses net unit prices (contra COGS already applied) per the invoice's model.
 */function splitDebits(invoice, goodsReceipts) {
  const net = netUnitPrices(invoice);
  const byPeriod = new Map();
  for (const g of goodsReceipts) {
    if (g.invoiceNumber !== invoice.invoiceNumber) continue;
    const p = periodOf(g.receiptDatetime);
    if (!byPeriod.has(p)) byPeriod.set(p, { amount: 0, date: g.receiptDatetime });
    const bucket = byPeriod.get(p);
    bucket.amount += (net[g.stockId] ?? g.qtyReceived * 0) * g.qtyReceived;
    if (g.receiptDatetime > bucket.date) bucket.date = g.receiptDatetime;
  }
  return [...byPeriod.entries()]
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([period, b]) => createSplitDebit({
      invoiceNumber: invoice.invoiceNumber,
      period,
      amount: Number(b.amount.toFixed(2)),
      date: b.date,
    }));
}

/** Days between two dates (whole days, >= 0). */
function daysBetween(fromDate, toDate) {
  const a = new Date(fromDate).getTime();
  const b = new Date(toDate).getTime();
  if (Number.isNaN(a) || Number.isNaN(b)) return 0;
  return Math.max(0, Math.round((b - a) / 86400000));
}

/**
 * GINR accrual for unreceived value at period close. Returns null if fully matched.
 * Value = net value of missing units. Flagged "value missing — locate" with age + owner.
 */function ginrAccrual(invoice, matchResult, { period, owner = null, asOf = new Date().toISOString() } = {}) {
  if (matchResult.fullyMatched) return null;
  const net = netUnitPrices(invoice);
  let value = 0;
  matchResult.lines.forEach((ml) => { value += (net[ml.stockId] ?? 0) * ml.missingQty; });
  if (value <= 0) return null;
  const closePeriod = period || periodOf(asOf) || periodOf(invoice.invoiceDate) || '';
  return createGinrAccrual({
    invoiceNumber: invoice.invoiceNumber,
    period: closePeriod,
    value: Number(value.toFixed(2)),
    ageDays: daysBetween(invoice.invoiceDate || invoice.shipDate || asOf, asOf),
    owner,
  });
}

/** Who bears in-transit loss for unreceived value. */function inTransitRisk(invoice) {
  const terms = String(invoice.incoterms || '').toUpperCase();
  return terms.includes('SHIPPING_POINT') || terms.includes('EX_WORKS') ? 'receiver' : 'supplier';
}

/** Bundle the timing view for one invoice. */function analyzeTiming(invoice, goodsReceipts, matchResult, opts = {}) {
  const mine = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);
  const match = matchResult || matchInvoice(invoice, mine);
  return {
    invoiceNumber: invoice.invoiceNumber,
    periods: periodsOf(mine),
    straddles: straddles(mine),
    splitDebits: splitDebits(invoice, mine),
    ginr: ginrAccrual(invoice, match, opts),
    inTransitRisk: inTransitRisk(invoice),
    netPayableRetained: netPayable(invoice), // full liability retained regardless of receipts
  };
}


// ===== src/lib/governance.js =====
// Governance engine + audit trail. Manages gap ownership, resolution options,
// the closure document, the lost-forever "backdoor" (1-manager approval), and an
// append-only audit trail. All six resolution options stay available regardless
// of cause. A gap cannot close without a recorded resolution; Unresolvable
// requires a recorded manager approval (Property 9). Audit is append-only (Property 8).const GapStatus = Object.freeze({ OPEN: 'open', RESOLVED: 'resolved', UNRESOLVABLE: 'unresolvable' });

/** All resolution options, always available regardless of the gap's cause (Req 7.1, 7.2). */function availableResolutionOptions() {
  return [...RESOLUTION_OPTION_VALUES];
}

/** Persist a gap as open + owned, and audit it. */function registerGap(store, gap, { actor = 'system', owner = null } = {}) {
  const g = { ...gap, status: GapStatus.OPEN, owner: owner ?? gap.owner ?? null };
  store.put('gaps', g);
  store.appendAudit(createAuditEntry({ entityId: gap.gapId, actor, change: `gap opened (missing ${gap.missingQty})` }));
  return g;
}

/** Gaps still open (flagged/owned until resolved) — Req 8.1. */function openGaps(store) {
  return store.all('gaps').filter((g) => g.status === GapStatus.OPEN);
}

/**
 * Resolve a gap with a chosen option (records a Resolution first, then closes it).
 * Misroute handling is manual: pass option StockTransfer with a note; we record the
 * decision without injecting phantom receipts, so nothing is double counted (Req 7.4).
 */function resolveGap(store, gapId, { option, evidenceDocRef = null, actor = 'system', approver = null, note = null } = {}) {
  if (!isEnumValue(RESOLUTION_OPTION_VALUES, option)) {
    throw new Error(`Governance: unknown resolution option "${option}"`);
  }
  const gap = store.get('gaps', gapId);
  if (!gap) throw new Error(`Governance: gap "${gapId}" not found`);

  const resolution = createResolution({ gapId, option, evidenceDocRef, approver });
  store.put('resolutions', resolution);
  store.put('gaps', { ...gap, status: GapStatus.RESOLVED });
  store.appendAudit(createAuditEntry({
    entityId: gapId, actor,
    change: `resolved via ${option}${note ? `: ${note}` : ''}`,
    evidenceRef: evidenceDocRef,
  }));
  return resolution;
}

/**
 * Backdoor: mark a lost-forever item Unresolvable. REQUIRES a manager approver
 * before the terminal state (Req 8.4 / Property 9). Records a resolution + audit.
 */function applyBackdoor(store, gapId, { actor = 'system', approver = null, option = 'WriteOff', note = null } = {}) {
  if (!approver) throw new Error('Governance: backdoor requires 1-manager approval (approver required)');
  if (!isEnumValue(RESOLUTION_OPTION_VALUES, option)) {
    throw new Error(`Governance: unknown resolution option "${option}"`);
  }
  const gap = store.get('gaps', gapId);
  if (!gap) throw new Error(`Governance: gap "${gapId}" not found`);

  const resolution = createResolution({ gapId, option, approver, evidenceDocRef: note });
  store.put('resolutions', resolution);
  store.put('gaps', { ...gap, status: GapStatus.UNRESOLVABLE });
  store.appendAudit(createAuditEntry({
    entityId: gapId, actor,
    change: `backdoor: marked Unresolvable via ${option} (approved by ${approver})`,

}

/** Record a decision + next steps for an open item (Req 8.3). */function recordDecision(store, entityId, { decision, nextSteps = null, actor = 'system' } = {}) {
  store.appendAudit(createAuditEntry({
    entityId, actor,
    change: `decision: ${decision}${nextSteps ? `; next: ${nextSteps}` : ''}`,

  return store.auditLog().at(-1);

/**
 * Generate a closure document — only when the invoice is fully matched AND paid.
 * (Lifecycle sets status Paid only after Fully Matched, so Paid implies matched.) Req 8.2.

  const inv = store.get('invoices', invoiceNumber);

  if (inv.status !== InvoiceStatus.PAID) {

  }

    type: 'closure',
    invoiceNumber,
    distributorId: inv.distributorId,
    totalValueStandard: inv.totalValueStandard,

// ===== src/lib/lifecycle.js =====
// Invoice lifecycle state machine. Enforces valid status transitions and audits
// each change. Also derives the natural status from a match result so ingestion
// can auto-advance an invoice (Received -> In Transit / Partially Received / Fully Matched).




// Allowed transitions per the design state diagram.const TRANSITIONS = Object.freeze({
  [InvoiceStatus.RECEIVED]: [
    InvoiceStatus.IN_TRANSIT_PENDING, InvoiceStatus.PARTIALLY_RECEIVED,
    InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.IN_TRANSIT_PENDING]: [
    InvoiceStatus.PARTIALLY_RECEIVED, InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.PARTIALLY_RECEIVED]: [
    InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.FULLY_MATCHED]: [InvoiceStatus.PAID],
  [InvoiceStatus.PAID]: [InvoiceStatus.ARCHIVED],
  [InvoiceStatus.ARCHIVED]: [],
  [InvoiceStatus.UNDER_INVESTIGATION]: [InvoiceStatus.RESOLVED, InvoiceStatus.UNRESOLVABLE],
  [InvoiceStatus.RESOLVED]: [InvoiceStatus.FULLY_MATCHED, InvoiceStatus.PARTIALLY_RECEIVED],
  [InvoiceStatus.UNRESOLVABLE]: [],
});function canTransition(from, to) {
  return (TRANSITIONS[from] || []).includes(to);
}

/** Transition an invoice's status, validating and auditing. Throws on invalid transition. */function transition(store, invoiceNumber, to, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Lifecycle: invoice "${invoiceNumber}" not found`);
  const from = inv.status;
  if (from === to) return inv; // no-op
  if (!canTransition(from, to)) {
    throw new Error(`Lifecycle: invalid transition ${from} -> ${to} for ${invoiceNumber}`);
  }
  const updated = store.setInvoiceStatus(invoiceNumber, to);
  store.appendAudit(createAuditEntry({ entityId: invoiceNumber, actor, change: `status ${from} -> ${to}` }));
  return updated;
}

/** Natural status implied by a match result. */function deriveStatus(matchResult) {
  if (matchResult.fullyMatched) return InvoiceStatus.FULLY_MATCHED;
  const anyReceived = matchResult.lines.some((l) => l.received > 0);
  return anyReceived ? InvoiceStatus.PARTIALLY_RECEIVED : InvoiceStatus.IN_TRANSIT_PENDING;
}

/**
 * Advance an invoice to the status implied by its match result, if that transition
 * is valid from the current status. Returns the (possibly unchanged) status.
 */function applyMatchStatus(store, invoiceNumber, matchResult, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Lifecycle: invoice "${invoiceNumber}" not found`);
  const target = deriveStatus(matchResult);
  if (inv.status === target) return inv.status;
  if (canTransition(inv.status, target)) {
    transition(store, invoiceNumber, target, { actor });
    return target;
  }
  return inv.status; // leave as-is if not a valid auto-advance
}


// ===== src/lib/analytics.js =====
// Analytics / view-model layer. Turns stored documents into per-invoice views and
// role-specific selections for the Storage, Accounting, and Finance dashboards.
// Pure functions (no DOM) so they can be unit-tested.





const CLOSED = new Set([InvoiceStatus.FULLY_MATCHED, InvoiceStatus.PAID, InvoiceStatus.ARCHIVED]);

/** Build an enriched view for one invoice. */function buildInvoiceView(invoice, goodsReceipts, deliveryNotes = [], opts = {}) {
  const receipts = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);
  const { match, gaps, contra } = analyzeInvoice(invoice, receipts, deliveryNotes);
  const timing = analyzeTiming(invoice, receipts, match, opts);

  const storages = new Set();
  match.lines.forEach((l) => {
    Object.keys(l.byStorage).forEach((s) => storages.add(s));
    (l.expectedStorages || []).forEach((s) => storages.add(s));
  });

  // Per-storage shortfall value (only storages genuinely short) — used by the aging
  // heatmap so at-risk value lands on the right storage, not spread across all of them.
  const netUnit = (invoice.totalValueStandard || 0) / Math.max(1, invoice.lines.reduce((s, l) => s + l.qtyInvoiced, 0));
  const shortByStorage = {};
  match.lines.forEach((l) => {
    const notes = deliveryNotes.filter((d) => d.invoiceNumber === invoice.invoiceNumber);
    const expBy = {};
    notes.forEach((d) => d.lines.forEach((dl) => { if (dl.stockId === l.stockId) expBy[d.targetStorageId] = (expBy[d.targetStorageId] || 0) + (dl.qtyShipped || 0); }));

    distributorId: invoice.distributorId,

// ---- role selectors -------------------------------------------------------

function touchesStorage(view, storageId) {

}

/** Storage view: on-way, pending delivery, aged pending, and a period trend. */function storageView(portfolio, { storageId = null } = {}) {
  const scoped = portfolio.filter((v) => touchesStorage(v, storageId));
  const onWay = scoped.filter((v) => v.status === InvoiceStatus.IN_TRANSIT_PENDING);
  const pendingDelivery = scoped.filter((v) => v.status === InvoiceStatus.PARTIALLY_RECEIVED);
  const agedPending = scoped
    .filter((v) => v.timing.ginr)
    .map((v) => ({ invoiceNumber: v.invoiceNumber, value: v.timing.ginr.value, ageDays: v.timing.ginr.ageDays }))
    .sort((a, b) => b.ageDays - a.ageDays);

  scoped.forEach((v) => v.timing.splitDebits.forEach((d) => { trend[d.period] = (trend[d.period] || 0) + d.amount; }));
  const trendByPeriod = Object.entries(trend).sort(([a], [b]) => a.localeCompare(b)).map(([period, amount]) => ({ period, amount: Number(amount.toFixed(2)) }));

/** Accounting view: closed invoices + summary of not-fully-closed and open. */function accountingView(portfolio) {
  const closed = portfolio.filter((v) => CLOSED.has(v.status));
  const open = portfolio.filter((v) => !CLOSED.has(v.status));
  return {
    closed,
    open,
    summary: {
      closedCount: closed.length,
      openCount: open.length,

/** Finance view: high-level portfolio summary + storages with pending issues. */function financeView(portfolio) {
  const byStatus = {};
  portfolio.forEach((v) => { byStatus[v.status] = (byStatus[v.status] || 0) + 1; });

  // Storages linked to still-open invoices that have a shortfall. We count open
  // invoices per storage (no value inflation — the same invoice's value at risk is
  // not multiplied across every storage it touches).
  const storagesWithIssues = {};
  portfolio.forEach((v) => {
    if (v.missingQty > 0 && !CLOSED.has(v.status)) {
      v.storages.forEach((s) => {
        if (!storagesWithIssues[s]) storagesWithIssues[s] = { storageId: s, openInvoices: [], count: 0 };
        storagesWithIssues[s].openInvoices.push(v.invoiceNumber);
        storagesWithIssues[s].count += 1;

    totals: {
      invoices: portfolio.length,
      openValueAtRisk: Number(portfolio.filter((v) => !CLOSED.has(v.status)).reduce((s, v) => s + v.valueAtRisk, 0).toFixed(2)),
      totalPendingCredit: Number(portfolio.reduce((s, v) => s + (v.contra.pendingCredit || 0), 0).toFixed(2)),
    },
    byStatus,
    storagesWithIssues: Object.values(storagesWithIssues).sort((a, b) => b.count - a.count),

const r2 = (n) => Number((n || 0).toFixed(2));

/** Portfolio-wide financial totals (gross, discounts, delivered, contra, exposure). */function portfolioTotals(portfolio) {

    recognized += v.contra.recognizedContra || 0;
    pending += v.contra.pendingCredit || 0;
    atRisk += v.valueAtRisk || 0;
    invoicedQty += v.invoicedQty || 0;
    receivedQty += v.receivedQty || 0;

    invoices: portfolio.length,

/** Per-distributor breakdown: invoices, delivered value, contra recognized/pending, exposure. */function distributorView(portfolio) {
  const by = {};
