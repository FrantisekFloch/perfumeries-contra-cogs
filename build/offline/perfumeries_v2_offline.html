    b.receivedQty += v.receivedQty || 0;
    b.deliveredValue += v.contra.deliveredValue || 0;
    b.recognizedContra += v.contra.recognizedContra || 0;
    b.pendingContra += v.contra.pendingCredit || 0;
    b.openValueAtRisk += CLOSED.has(v.status) ? 0 : (v.valueAtRisk || 0);
  });
  return Object.values(by).map((b) => ({
    ...b,
    deliveredValue: r2(b.deliveredValue), recognizedContra: r2(b.recognizedContra),
    pendingContra: r2(b.pendingContra), openValueAtRisk: r2(b.openValueAtRisk),
    fillRate: b.invoicedQty ? r2((b.receivedQty / b.invoicedQty) * 100) : 0,
  })).sort((a, b) => b.deliveredValue - a.deliveredValue);
}

/** Per-storage breakdown: how many invoices touch it, received qty, open exposure. */function storageBreakdown(portfolio) {
  const by = {};
  portfolio.forEach((v) => {
    v.storages.forEach((s) => {
      if (!by[s]) by[s] = { storageId: s, invoices: 0, openInvoices: 0, openValueAtRisk: 0 };
      by[s].invoices += 1;
      if (!CLOSED.has(v.status) && v.missingQty > 0) { by[s].openInvoices += 1; by[s].openValueAtRisk += v.valueAtRisk || 0; }
    });
  });
  return Object.values(by).map((b) => ({ ...b, openValueAtRisk: r2(b.openValueAtRisk) }))
    .sort((a, b) => b.openValueAtRisk - a.openValueAtRisk || b.invoices - a.invoices);
}


// ===== src/lib/insights.js =====
// Insights layer (v2). Pure selectors that turn the portfolio into control-tower &
// finance intelligence: exception feed, SLA timers, contra waterfall,
// DPO/working-capital, margin erosion, tier progress, rebate-at-risk, what-if, digest,
// and data quality. No DOM. Built on the portfolio view models (analytics.js) + raw docs.



// Module-unique helper names (avoid colliding with analytics.js / timing.js in the
// single-scope offline bundle).
const r2i = (n) => Number((n || 0).toFixed(2));
const CLOSED_I = new Set(['FullyMatched', 'Paid', 'Archived']);
const DAY_I = 86400000;
const daysBetweenI = (a, b) => {
  const x = new Date(a).getTime(); const y = new Date(b).getTime();
  return (Number.isNaN(x) || Number.isNaN(y)) ? 0 : Math.max(0, Math.round((y - x) / DAY_I));
};

/** #4 Predicted-disruption: an open, unreceived invoice past its expected window with no signal. */function predictLikelyLost(v, asOf = new Date().toISOString(), slaDays = 21) {
  if (CLOSED_I.has(v.status)) return false;
  if ((v.receivedQty || 0) > 0) return false; // something arrived → not "silent"
  const age = daysBetweenI(v.invoiceDate || asOf, asOf);
  return age > slaDays; // nothing received well past the expected window
}

/**
 * #2 Exception feed — impact-weighted list of what needs attention now.
 * Severity order: likely-lost > lost leg > over-delivery > partial/short > delayed > aged-pending.
 */function exceptionFeed(portfolio, { asOf = new Date().toISOString(), slaDays = 21 } = {}) {
  const out = [];
  portfolio.forEach((v) => {
    const sit = v.receivedSituation || [];
    const has = (s) => sit.some((x) => x.situation === s);
    const age = daysBetweenI(v.invoiceDate || asOf, asOf);
    const push = (type, sev) => out.push({
      type, severity: sev, invoiceNumber: v.invoiceNumber, distributorId: v.distributorId,
      valueAtRisk: v.valueAtRisk || 0, missingQty: v.missingQty || 0, ageDays: age, status: v.status,
    });
    if (predictLikelyLost(v, asOf, slaDays)) push('likelyLost', 5);
    else if (has('lost')) push('lost', 5);
    if ((v.overQty || 0) > 0 || has('over')) push('over', 3);
    if (!CLOSED_I.has(v.status) && v.missingQty > 0 && !has('lost')) push('short', 3);
    if (has('delayed') || has('rerouted')) push('delayed', 2);
    if (v.timing && v.timing.ginr && age > slaDays) push('aged', 2);
  });
  // de-dup by invoice+type, keep highest severity, sort by severity then € at risk
  const seen = new Set();
  return out
    .filter((e) => { const k = e.invoiceNumber + e.type; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => b.severity - a.severity || b.valueAtRisk - a.valueAtRisk);
}

/** #5 SLA countdown — days used vs. an SLA window per open invoice (breach flagged). */function slaTimers(portfolio, { asOf = new Date().toISOString(), slaDays = 21 } = {}) {
  return portfolio
    .filter((v) => !CLOSED_I.has(v.status) && (v.missingQty || 0) > 0)
    .map((v) => {
      const used = daysBetweenI(v.invoiceDate || asOf, asOf);
      return {
        invoiceNumber: v.invoiceNumber, distributorId: v.distributorId,
        used, sla: slaDays, remaining: slaDays - used, breached: used > slaDays,
        pct: Math.min(100, Math.round((used / slaDays) * 100)), valueAtRisk: v.valueAtRisk || 0,
      };
    })
    .sort((a, b) => a.remaining - b.remaining);
}

/** #6 Contra COGS waterfall — full potential → recognized → pending → at-risk/forfeited. */function contraWaterfall(portfolio) {
  const full = r2i(portfolio.reduce((s, v) => s + (v.contra.headerDiscountTotal || 0), 0));
  const recognized = r2i(portfolio.reduce((s, v) => s + (v.contra.recognizedContra || 0), 0));
  const pending = r2i(portfolio.reduce((s, v) => s + (v.contra.pendingCredit || 0), 0));
  // "at risk" = the slice of full contra tied to still-missing goods on open invoices.
  const atRisk = r2i(portfolio.reduce((s, v) => {
    if (CLOSED_I.has(v.status)) return s;
    const gap = Math.max(0, (v.contra.headerDiscountTotal || 0) - (v.contra.recognizedContra || 0));
    return s + gap;
  }, 0));
  return {
    steps: [
      { key: 'full', label: 'full', value: full, kind: 'base' },
      { key: 'recognized', label: 'recognized', value: recognized, kind: 'good' },
      { key: 'pending', label: 'pending', value: pending, kind: 'warn' },
      { key: 'atRisk', label: 'atRisk', value: atRisk, kind: 'bad' },
    ],
    full, recognized, pending, atRisk,
  };
}

/**
 * Contra COGS "missing opportunity" — the material cost of a one-month recognition slip.
 *
 * Business case: Contra COGS earned on goods that ARRIVE ON TIME this month can be
 * recognized / invoiced THIS month. If the delivery slips past the month-end, that same
 * contra is pushed into NEXT month. Recognizing money a month later is worth less today —
 * the classic time-value-of-money / cost-of-capital effect. So the material loss of the
 * slip is the deferred contra carried for one month at the company's cost of capital:
 *
 *     materialLoss = deferrableContra × (annualCostOfCapital / 12)
 *
 * where `deferrableContra` is the at-risk contra (full tier contra not yet recognized
 * because goods are still missing) on OPEN invoices whose delivery deadline falls in the
 * current month — i.e. the contra we could still book this month if the goods land in time.
 * `annualCostOfCapital` defaults to 8% (a common corporate WACC proxy) and is adjustable.
 */function contraMissedOpportunity(portfolio, {
  asOf = new Date().toISOString(), slaDays = 21, annualCostOfCapital = 0.08,
} = {}) {
  const now = new Date(asOf);
  const curPeriod = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const monthlyRate = annualCostOfCapital / 12;
  const items = [];
  let deferrable = 0;
  portfolio.forEach((v) => {
    if (CLOSED_I.has(v.status)) return;
    const atRiskContra = Math.max(0, (v.contra.headerDiscountTotal || 0) - (v.contra.recognizedContra || 0));
    if (atRiskContra <= 0) return;
    // Delivery deadline = invoice date + SLA. If that deadline lands in the CURRENT month,
    // the contra is bookable this month provided goods arrive in time → it's deferrable.
    const inv = new Date(v.invoiceDate || asOf);
    const deadline = new Date(inv.getTime() + slaDays * DAY_I);
    const deadlinePeriod = `${deadline.getFullYear()}-${String(deadline.getMonth() + 1).padStart(2, '0')}`;
    if (deadlinePeriod !== curPeriod) return; // deadline not this month → not a this-month opportunity
    deferrable += atRiskContra;
    items.push({
      invoiceNumber: v.invoiceNumber, distributorId: v.distributorId,
      atRiskContra: r2i(atRiskContra), missingQty: v.missingQty || 0,
      deadline: deadline.toISOString().slice(0, 10),
      loss: r2i(atRiskContra * monthlyRate),
    });
  });
  deferrable = r2i(deferrable);
  const materialLoss = r2i(deferrable * monthlyRate);
  items.sort((a, b) => b.atRiskContra - a.atRiskContra);
  return {
    period: curPeriod, slaDays,
    annualCostOfCapital, monthlyRate: r2i(monthlyRate * 100) / 100,
    deferrableContra: deferrable, // contra bookable this month if goods land on time
    materialLoss,                 // one-month carrying cost if it slips to next month
    items,
  };
}

/** #8 DPO / working-capital proxy tile. */function workingCapital(portfolio, { asOf = new Date().toISOString(), termsDays = 30 } = {}) {
  const tot = portfolioTotals(portfolio);
  const open = portfolio.filter((v) => !CLOSED_I.has(v.status));
  const avgAge = open.length ? Math.round(open.reduce((s, v) => s + daysBetweenI(v.invoiceDate || asOf, asOf), 0) / open.length) : 0;
  return {
    dpo: termsDays,                 // demo: standard payment terms
    avgOpenAgeDays: avgAge,         // how long open items have been sitting
    openInvoices: open.length,
    openValueAtRisk: tot.openValueAtRisk,
    pendingContra: tot.pendingContra, // cash locked until contra clears
    cashLocked: tot.pendingContra,
  };
}

/** #10 Margin-erosion — invoices where recognized contra trails the tier-eligible amount. */function marginErosion(portfolio) {
  const rows = portfolio.map((v) => {
    const eligible = v.contra.headerDiscountTotal || 0;
    const recognized = v.contra.recognizedContra || 0;
    return { invoiceNumber: v.invoiceNumber, distributorId: v.distributorId, eligible: r2i(eligible), recognized: r2i(recognized), erosion: r2i(Math.max(0, eligible - recognized)), status: v.status };
  }).filter((row) => row.erosion > 0.005)
    .sort((a, b) => b.erosion - a.erosion);
  const total = r2i(rows.reduce((s, row) => s + row.erosion, 0));
  return { rows, total };
}

/**
 * #12 Tier progress — per distributor, progress toward the next contra tier and the
 * extra rebate € unlocked by reaching it. Tiers inferred from each invoice's discountTiers.
 */function tierProgress(portfolio) {
  const by = {};
  portfolio.forEach((v) => {
    const tiers = v.discountTiers || [];
    if (!by[v.distributorId]) by[v.distributorId] = { distributorId: v.distributorId, model: v.model, receivedQty: 0, deliveredValue: 0, tiers };
    const b = by[v.distributorId];
    b.receivedQty += v.receivedQty || 0;
    b.deliveredValue += v.contra.deliveredValue || 0;
    if (tiers.length && !b.tiers.length) b.tiers = tiers;
  });
  return Object.values(by).map((b) => {
    const sorted = [...b.tiers].filter((t) => (t.pct || 0) > 0).sort((x, y) => (x.minQty || 0) - (y.minQty || 0));
    const qtyNow = b.receivedQty;
    let current = null; let next = null;
    for (const tier of sorted) { if (qtyNow >= (tier.minQty || 0)) current = tier; }
    next = sorted.find((tier) => (tier.minQty || 0) > qtyNow) || null;
    const curPct = current ? current.pct : 0;
    const nextPct = next ? next.pct : (current ? current.pct : 0);
    const toNext = next ? Math.max(0, (next.minQty || 0) - qtyNow) : 0;
    // approx extra rebate € from the incremental pct on the delivered value once next tier hit
    const avgUnit = qtyNow ? b.deliveredValue / qtyNow : 0;
    const extraRebate = next ? r2i((avgUnit * (next.minQty || 0)) * ((nextPct - curPct) / 100)) : 0;
    const floor = current ? (current.minQty || 0) : 0;
    const ceil = next ? (next.minQty || 0) : (floor || 1);
    const pct = next ? Math.min(100, Math.round(((qtyNow - floor) / Math.max(1, ceil - floor)) * 100)) : 100;
    return { distributorId: b.distributorId, model: b.model, receivedQty: qtyNow, currentPct: curPct, nextPct, toNextTier: toNext, extraRebate, pct };
  }).sort((a, b) => b.receivedQty - a.receivedQty);
}

/** #15 Rebate-at-risk register — every pending/at-risk contra with its blocking reason. */function rebateAtRisk(portfolio) {
  const reasonOf = (v) => {
    const sit = v.receivedSituation || [];
    if (sit.some((s) => s.situation === 'lost')) return 'lost';
    if ((v.timing && v.timing.straddles)) return 'splitMonth';
    if (v.missingQty > 0) return 'missingQty';
    return 'pending';
  };
  return portfolio
    .filter((v) => (v.contra.pendingCredit || 0) > 0 || (!CLOSED_I.has(v.status) && (v.contra.headerDiscountTotal || 0) - (v.contra.recognizedContra || 0) > 0.005))
    .map((v) => ({
      invoiceNumber: v.invoiceNumber, distributorId: v.distributorId,
      atRisk: r2i(Math.max(v.contra.pendingCredit || 0, (v.contra.headerDiscountTotal || 0) - (v.contra.recognizedContra || 0))),
      reason: reasonOf(v), missingQty: v.missingQty || 0, status: v.status,
    }))
    .sort((a, b) => b.atRisk - a.atRisk);
}

/**
 * #16 What-if contra simulator (pure). Given an invoice view and a hypothetical extra
 * delivered quantity, returns the new recognized contra + delta and whether it clears.
 */function whatIfContra(v, extraQty, invoice) {
  const tierPct = v.contra.tierPct || 0;
  const invoicedQty = v.invoicedQty || 0;
  const unit = invoicedQty ? (invoice ? invoice.totalValueStandard / invoicedQty : (v.contra.deliveredValue / Math.max(1, v.receivedQty))) : 0;
  const newReceived = Math.min(invoicedQty, (v.receivedQty || 0) + Math.max(0, extraQty));
  const newDeliveredValue = unit * newReceived;
  const newRecognized = r2i((newDeliveredValue * tierPct) / 100);
  const clears = newReceived >= invoicedQty;
  return {
    before: r2i(v.contra.recognizedContra || 0),
    after: newRecognized,
    delta: r2i(newRecognized - (v.contra.recognizedContra || 0)),
    clears, newReceived, invoicedQty,
  };
}

/** #24 Home digest — plain-language summary sentence(s). Returns a params object for i18n. */function homeDigest(portfolio) {
  const tot = portfolioTotals(portfolio);
  const partial = portfolio.filter((v) => v.status === 'PartiallyReceived').length;
  const transit = portfolio.filter((v) => v.status === 'InTransitPending').length;
  const over = portfolio.filter((v) => (v.receivedQty || 0) > (v.invoicedQty || 0)).length;
  const likelyLost = portfolio.filter((v) => predictLikelyLost(v)).length;
  return {
    invoices: tot.invoices, risk: tot.openValueAtRisk, recognized: tot.recognizedContra,
    pending: tot.pendingContra, partial, transit, over, likelyLost, fill: tot.fillRate,
  };
}

/** #25 Data quality — incomplete invoices, orphan receipts, notes without invoices. */function dataQuality({ invoices = [], goodsReceipts = [], deliveryNotes = [], creditNotes = [], incomplete = [] } = {}) {
  const invNums = new Set(invoices.map((i) => i.invoiceNumber));
  const orphanReceipts = goodsReceipts.filter((g) => g.invoiceNumber && !invNums.has(g.invoiceNumber)).length;
  const orphanNotes = deliveryNotes.filter((d) => d.invoiceNumber && !invNums.has(d.invoiceNumber)).length;
  const orphanCredits = creditNotes.filter((c) => c.invoiceRef && !invNums.has(c.invoiceRef)).length;
  const issues = [];
  if (incomplete.length) issues.push({ type: 'incomplete', count: incomplete.length });
  if (orphanReceipts) issues.push({ type: 'orphanReceipts', count: orphanReceipts });
  if (orphanNotes) issues.push({ type: 'orphanNotes', count: orphanNotes });
  if (orphanCredits) issues.push({ type: 'orphanCredits', count: orphanCredits });
  return { clean: issues.length === 0, issues, checked: invoices.length + goodsReceipts.length + deliveryNotes.length + creditNotes.length };
}


// ===== src/lib/inventory.js =====
// Inventory audit sub-module (logic). Produces monthly per-invoice audit detail:
// delivered vs invoiced, contra COGS status (applied/pending/cleared), receipts by
// storage with dates, linked delivery/credit notes, provenance, and audit history.
// Exportable per month or per invoice. Pure functions (no DOM).





/** Contra status label for audit display. */function contraStatus(view) {
  if (view.model === ContraCogsModel.A) return 'Applied';
  return view.contra.creditStatus === CreditNoteStatus.CLEARED ? 'Cleared' : 'Pending';
}

/** Months an invoice is active in (invoice date + any receipt periods). */function invoiceMonths(invoice, goodsReceipts) {
  const months = new Set();
  const p = periodOf(invoice.invoiceDate);
  if (p) months.add(p);
  goodsReceipts
    .filter((g) => g.invoiceNumber === invoice.invoiceNumber)
    .forEach((g) => { const m = periodOf(g.receiptDatetime); if (m) months.add(m); });
  return [...months];
}

/** All months present across the portfolio (sorted). */function inventoryMonths(invoices, goodsReceipts) {
  const set = new Set();
  invoices.forEach((inv) => invoiceMonths(inv, goodsReceipts).forEach((m) => set.add(m)));
  return [...set].sort();
}

/**
 * Per-intended-storage received situation for one invoice, comparing the EXPECTED
 * quantity for each storage (from the delivery-note lines) against what was actually
 * RECEIVED (from goods receipts). Only the storages the invoice ships to are included.
 * Each entry carries expected/received/missing plus a chip situation:
 *   received (green, full)   · short (yellow, partial) · pending (red, nothing yet)
 *   rerouted (yellow)        · delayed (amber)         · lost (red)
 */function receivedSituation(invoice, { goodsReceipts, deliveryNotes = [] }) {
  const notes = deliveryNotes.filter((d) => d.invoiceNumber === invoice.invoiceNumber);
  const receipts = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);
  const receivedBy = {};
  receipts.forEach((g) => { receivedBy[g.storageId] = (receivedBy[g.storageId] || 0) + g.qtyReceived; });

  const rank = (s) => ({ [DeliveryStatus.LOST]: 3, [DeliveryStatus.REROUTED]: 2, [DeliveryStatus.DELAYED]: 1, [DeliveryStatus.ON_TIME]: 0 }[s] ?? 0);

  // Group by intended storage: sum expected qty from delivery-note lines; keep the
  // worst logistics flag + an ETA if any leg to this storage has one.
  const byStorage = new Map();
  for (const n of notes) {
    const cur = byStorage.get(n.targetStorageId)
      || { storageId: n.targetStorageId, expected: 0, status: DeliveryStatus.ON_TIME, expectedDate: null };
    cur.expected += (n.lines || []).reduce((s, l) => s + (l.qtyShipped || 0), 0);
    if (rank(n.deliveryStatus) > rank(cur.status)) { cur.status = n.deliveryStatus; cur.expectedDate = n.expectedDate || cur.expectedDate; }
    else if (!cur.expectedDate && n.expectedDate) cur.expectedDate = n.expectedDate;
    byStorage.set(n.targetStorageId, cur);
  }

  return [...byStorage.values()].map((s) => {
    const received = receivedBy[s.storageId] || 0;
    const missing = Math.max(0, s.expected - received);
    const over = Math.max(0, received - s.expected); // received more than planned here
    let situation;
    if (s.status === DeliveryStatus.LOST) situation = 'lost';
    else if (over > 0) situation = 'over';                                            // over-delivery → yellow (shortfall likely elsewhere)
    else if (received >= s.expected && s.expected > 0) situation = 'received';         // full → green
    else if (received > 0) situation = 'short';                                        // partial → yellow
    else if (s.status === DeliveryStatus.REROUTED) situation = 'rerouted';
    else if (s.status === DeliveryStatus.DELAYED) situation = 'delayed';
    else situation = 'pending';                                                        // nothing yet → red
    return {
      storageId: s.storageId, situation,
      expected: s.expected, received, missing, over,
      expectedDate: s.expectedDate, deliveryStatus: s.status,
    };
  }).sort((a, b) => a.storageId.localeCompare(b.storageId));
}

/** Full audit detail for one invoice. */function invoiceDetail(invoice, { goodsReceipts, deliveryNotes = [], creditNotes = [], auditLog = [] }) {
  const view = buildInvoiceView(invoice, goodsReceipts, deliveryNotes, {});
  const mine = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);

  const situation = receivedSituation(invoice, { goodsReceipts, deliveryNotes });
  const expectedByStorage = {};
  situation.forEach((s) => { expectedByStorage[s.storageId] = s.expected; });

  // Storages-by-storage view: start from every intended storage (so short/missing
  // storages appear even with zero receipts), then fold in the actual receipts.
  const byStorage = {};
  situation.forEach((s) => {
    byStorage[s.storageId] = { storageId: s.storageId, expected: s.expected, qty: 0, missing: s.missing, receipts: [] };
  });
  mine.forEach((g) => {
    if (!byStorage[g.storageId]) byStorage[g.storageId] = { storageId: g.storageId, expected: expectedByStorage[g.storageId] || 0, qty: 0, missing: 0, over: 0, disputed: 0, receipts: [] };
    byStorage[g.storageId].qty += g.qtyReceived;
    byStorage[g.storageId].disputed += (g.qtyDisputed || 0);
    byStorage[g.storageId].receipts.push({ qty: g.qtyReceived, disputed: g.qtyDisputed || 0, datetime: g.receiptDatetime, recadvRef: g.recadvRef, sourceFile: g.sourceFile });
  });
  // Recompute missing / over per storage after folding receipts in.
  Object.values(byStorage).forEach((b) => {
    b.missing = Math.max(0, (b.expected || 0) - b.qty);
    b.over = Math.max(0, b.qty - (b.expected || 0));
  });

  // Map each intended storage to its delivery-note source file (folded into the
  // Receipts-by-storage table as FYI, so the separate Delivery-notes block is dropped).
  const dnByStorage = {};
  deliveryNotes
    .filter((d) => d.invoiceNumber === invoice.invoiceNumber)
    .forEach((d) => { (dnByStorage[d.targetStorageId] ||= []).push(d.sourceFile || d.deliveryNoteId); });
  Object.values(byStorage).forEach((b) => { b.deliverySource = (dnByStorage[b.storageId] || []).join(', '); });

  // Monthly invoicing split (from the timing engine's split debits): the value of goods
  // actually received/invoiced per calendar month. When this spans >1 month it signals
  // the Contra COGS miss — the tier volume gets split across periods (FCF impact).
  const monthlySplit = (view.timing.splitDebits || []).map((d) => ({ period: d.period, amount: d.amount }));

  return {
    invoiceNumber: invoice.invoiceNumber,
    distributorId: invoice.distributorId,
    model: invoice.contraCogsModel,
    type: invoice.type,
    proformaDate: invoice.invoiceDate,
    status: invoice.status,
    invoicedQty: view.invoicedQty,
    receivedQty: view.receivedQty,
    missingQty: view.missingQty,
    overQty: Math.max(0, view.receivedQty - view.invoicedQty),
    disputedQty: mine.reduce((s, g) => s + (g.qtyDisputed || 0), 0),
    contraStatus: contraStatus(view),
    recognizedContra: view.contra.recognizedContra,
    pendingCredit: view.contra.pendingCredit,
    monthlySplit,
    straddles: view.timing.straddles,
    receivedSituation: situation,
    receiptsByStorage: Object.values(byStorage),
    creditNotes: creditNotes
      .filter((c) => c.invoiceRef === invoice.invoiceNumber)
      .map((c) => ({ creditNoteId: c.creditNoteId, period: c.period, amount: c.amount, status: c.status, sourceFile: c.sourceFile })),
    provenance: { invoiceSourceFile: invoice.sourceFile ?? null },
    audit: auditLog.filter((a) => a.entityId === invoice.invoiceNumber),
  };
}

/** Per-invoice detail for every invoice active in `month`. */function monthlyInventory(invoices, ctx, { month }) {
  return invoices
    .filter((inv) => invoiceMonths(inv, ctx.goodsReceipts).includes(month))
    .map((inv) => invoiceDetail(inv, ctx));
}

/** Export helper (JSON string) for a month or a single invoice detail. */function exportInventory(data) {
  return JSON.stringify(data, null, 2);
}

/**
 * CSV export of a list of invoice-detail objects — one invoice per row with the main
 * details. Safe CSV quoting. Used by the Inventory "Export (CSV)" button.
 */function exportInventoryCsv(list) {
  const headers = [
    'invoice_number', 'invoice_date', 'type', 'distributor', 'model', 'status',
    'invoiced_qty', 'received_qty', 'not_delivered_qty', 'over_qty', 'disputed_qty',

// ===== src/lib/forecast.js =====
// Monthly aggregation + a simple forecast for the Finance view. Pure functions.

/** Aggregate a portfolio into monthly series: value at risk, debits, recognized contra. */function monthlySeries(portfolio) {
  const months = new Set();
  const risk = {};
  const debits = {};
  const contra = {};

  for (const v of portfolio) {
    if (v.month) {
      months.add(v.month);
      risk[v.month] = (risk[v.month] || 0) + v.valueAtRisk;
      contra[v.month] = (contra[v.month] || 0) + (v.contra?.recognizedContra || 0);
    }
    for (const d of v.timing?.splitDebits || []) {
      months.add(d.period);
      debits[d.period] = (debits[d.period] || 0) + d.amount;
    }
  }

  const sorted = [...months].sort();
  return {
    months: sorted,
    risk: sorted.map((m) => Number((risk[m] || 0).toFixed(2))),
    debits: sorted.map((m) => Number((debits[m] || 0).toFixed(2))),
    contra: sorted.map((m) => Number((contra[m] || 0).toFixed(2))),
  };
}

/** Add n months to a 'YYYY-MM' string. */function addMonths(period, n) {
  const [y, m] = period.split('-').map(Number);
  const idx = (y * 12 + (m - 1)) + n;
  const ny = Math.floor(idx / 12);
  const nm = (idx % 12) + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}

/**
 * Least-squares linear forecast of `values` projected `n` steps ahead.
 * Returns { months, values } for the projected points (clamped at >= 0).
 */function forecast(months, values, n = 3) {
  const k = values.length;
  if (k === 0) return { months: [], values: [] };
  if (k === 1) {
    const out = { months: [], values: [] };
    for (let i = 1; i <= n; i++) { out.months.push(addMonths(months[0], i)); out.values.push(Number(values[0].toFixed(2))); }
    return out;
  }
  // linear regression y = a + b*x, x = 0..k-1
  const xs = values.map((_, i) => i);
  const meanX = xs.reduce((s, x) => s + x, 0) / k;
  const meanY = values.reduce((s, y) => s + y, 0) / k;
  let num = 0, den = 0;
  for (let i = 0; i < k; i++) { num += (xs[i] - meanX) * (values[i] - meanY); den += (xs[i] - meanX) ** 2; }
  const b = den === 0 ? 0 : num / den;
  const a = meanY - b * meanX;
  const out = { months: [], values: [] };
  const last = months[months.length - 1];
  for (let i = 1; i <= n; i++) {
    const y = a + b * (k - 1 + i);
    out.months.push(addMonths(last, i));
    out.values.push(Number(Math.max(0, y).toFixed(2)));
  }
  return out;
}


// ===== src/lib/pipeline.js =====
// End-to-end pipeline orchestrator: scan -> ingest -> persist -> advance lifecycle
// -> build portfolio. Shared by the app UI and the integration test so both drive
// the exact same flow.async function runPipeline(store, sources, { onStatus, asOf } = {}) {
  const { files, results } = await new SourceScanner(sources, { onStatus }).scanAll();
  // A scan reflects the current source truth. Reset first so re-scans / page
  // reloads are idempotent (goodsReceipts is a list and would otherwise pile up).
  store.clearAll();
  const ingest = ingestFiles(files);
  persistIngest(store, ingest);

  const receipts = store.all('goodsReceipts');
  const dns = store.all('deliveryNotes');
  for (const inv of store.all('invoices')) {
    applyMatchStatus(store, inv.invoiceNumber, matchInvoice(inv, receipts, dns), { actor: 'system' });
  }

  const invoices = store.all('invoices');
  const portfolio = buildPortfolio(invoices, receipts, dns, { asOf: asOf || new Date().toISOString() });
  return { scanResults: results, ingest, invoices, portfolio };
}

// Tiny dependency-free SVG charts. Return markup strings.

function scaleMax(vals) {
  const m = Math.max(1, ...vals.map((v) => Number(v) || 0));
  const pow = Math.pow(10, Math.floor(Math.log10(m)));
  return Math.ceil(m / pow) * pow;
}
const short = (lab) => String(lab).slice(2); // '2026-01' -> '26-01'

/** Grouped bar chart of two monthly series. */function groupedBars(labels, a, b, opts = {}) {
  const { width = 680, height = 220, colorA = '#2d6cdf', colorB = '#1c9c6b', labelA = 'A', labelB = 'B' } = opts;
  const pad = { l: 44, r: 10, t: 18, b: 28 };
  const iw = width - pad.l - pad.r, ih = height - pad.t - pad.b;
  const max = scaleMax([...a, ...b]);
  const n = labels.length || 1, groupW = iw / n, barW = Math.min(16, groupW / 3);
  const y = (v) => pad.t + ih - ((Number(v) || 0) / max) * ih;
  let bars = '';
  labels.forEach((lab, i) => {
    const gx = pad.l + i * groupW + groupW / 2;
    bars += `<rect x="${(gx - barW - 1).toFixed(1)}" y="${y(a[i]).toFixed(1)}" width="${barW}" height="${(pad.t + ih - y(a[i])).toFixed(1)}" fill="${colorA}"/>`;
    bars += `<rect x="${(gx + 1).toFixed(1)}" y="${y(b[i]).toFixed(1)}" width="${barW}" height="${(pad.t + ih - y(b[i])).toFixed(1)}" fill="${colorB}"/>`;
    bars += `<text x="${gx.toFixed(1)}" y="${height - 10}" font-size="9" text-anchor="middle" fill="#6b6b6b">${short(lab)}</text>`;
  });
  const axis = `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${width - pad.r}" y2="${pad.t + ih}" stroke="#e5e5e5"/><text x="2" y="${pad.t + 8}" font-size="9" fill="#6b6b6b">${max.toLocaleString()}</text>`;
  const legend = `<rect x="${pad.l}" y="2" width="10" height="10" fill="${colorA}"/><text x="${pad.l + 14}" y="11" font-size="10" fill="#1a1a1a">${labelA}</text><rect x="${pad.l + 120}" y="2" width="10" height="10" fill="${colorB}"/><text x="${pad.l + 134}" y="11" font-size="10" fill="#1a1a1a">${labelB}</text>`;
  const desc = opts.ariaLabel || `Grouped bar chart: ${labelA} vs ${labelB} across ${labels.length} months.`;
  return `<svg viewBox="0 0 ${width} ${height}" class="chart" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${desc}">${axis}${bars}${legend}</svg>`;
}

/** Line chart with a dashed forecast tail. */function lineForecast(labels, actual, fLabels, fValues, opts = {}) {
  const { width = 680, height = 220, color = '#2d6cdf', fcolor = '#e0a400' } = opts;
  const pad = { l: 44, r: 10, t: 18, b: 28 };
  const iw = width - pad.l - pad.r, ih = height - pad.t - pad.b;
  const allLabels = [...labels, ...fLabels];
  const max = scaleMax([...actual, ...fValues]);
  const n = allLabels.length || 1, stepX = iw / Math.max(1, n - 1);
  const x = (i) => pad.l + i * stepX;
  const y = (v) => pad.t + ih - ((Number(v) || 0) / max) * ih;
  // Shade + separator to clearly mark where real data ends and the projection begins.
  const bIdx = Math.max(0, actual.length - 1);
  const shade = fValues.length ? `<rect x="${x(bIdx).toFixed(1)}" y="${pad.t}" width="${(width - pad.r - x(bIdx)).toFixed(1)}" height="${ih}" fill="${fcolor}" opacity="0.08"/>` : '';
  const sep = fValues.length ? `<line x1="${x(bIdx).toFixed(1)}" y1="${pad.t}" x2="${x(bIdx).toFixed(1)}" y2="${pad.t + ih}" stroke="${fcolor}" stroke-dasharray="3 3" opacity="0.7"/>` : '';
  const actualLine = `<polyline points="${actual.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2"/>`;
  const fSeq = [];
  if (actual.length) fSeq.push(`${x(actual.length - 1).toFixed(1)},${y(actual[actual.length - 1]).toFixed(1)}`);
  fValues.forEach((v, i) => fSeq.push(`${x(actual.length + i).toFixed(1)},${y(v).toFixed(1)}`));
  const fLine = `<polyline points="${fSeq.join(' ')}" fill="none" stroke="${fcolor}" stroke-width="2" stroke-dasharray="5 4"/>`;
  const dots = actual.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${color}"/>`).join('')
    + fValues.map((v, i) => `<circle cx="${x(actual.length + i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${fcolor}"/>`).join('');
  const xlabels = allLabels.map((lab, i) => `<text x="${x(i).toFixed(1)}" y="${height - 10}" font-size="9" text-anchor="middle" fill="#6b6b6b">${short(lab)}</text>`).join('');
  const axis = `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${width - pad.r}" y2="${pad.t + ih}" stroke="#e5e5e5"/><text x="2" y="${pad.t + 8}" font-size="9" fill="#6b6b6b">${max.toLocaleString()}</text>`;
  const desc = opts.ariaLabel || `Line chart with a dashed forecast tail over ${allLabels.length} months.`;
  return `<svg viewBox="0 0 ${width} ${height}" class="chart" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${desc}">${axis}${shade}${sep}${actualLine}${fLine}${dots}${xlabels}</svg>`;
}

  const sit = d.receivedSituation || [];

function monthlySplitLine(d) {
  const parts = (d.monthlySplit || []).filter((m) => m.amount > 0);
  if (parts.length <= 1) return '';
  const list = parts.map((m) => `${m.period} (${money(m.amount)})`).join(' · ');
  // The split-month signal is the Contra COGS miss: because an invoice may only be
  // raised for goods actually delivered (delivery date required), the tier volume gets
  // split across months and the discount can't fully qualify until the rest arrives.
  return `<p class="cc-miss" title="${t('inv.ccMissTip')}">⚠ ${t('inv.ccMiss')}: ${list}</p>`;
}

// #1 Journey timeline — Invoiced → Shipped → In transit → Received.
// Progress varies by invoice age so brand-new invoices show only "Invoiced",
// slightly older ones "Shipped", then "In transit", then "Received" once goods arrive.
function invoiceAgeDays(d) {
  const t0 = new Date(d.proformaDate || Date.now()).getTime();
  if (Number.isNaN(t0)) return 99;
  return Math.max(0, Math.round((Date.now() - t0) / 86400000));
}
function journeyHtml(d) {
  const age = invoiceAgeDays(d);
  const allReceived = d.missingQty <= 0 && d.invoicedQty > 0;
  const anyReceived = (d.receivedQty || 0) > 0;
  // Age gates for the pre-receipt legs (only when nothing has been received yet).
  const shipped = anyReceived || allReceived || age >= 1; // shipped ~a day after invoicing
  const transit = anyReceived || allReceived || age >= 3; // in transit a few days out
  const steps = [
    { key: 'invoiced', done: true },
    { key: 'shipped', done: shipped },
    { key: 'transit', done: transit },
    { key: 'received', done: allReceived },
  ];
  const dots = steps.map((s, i) => `
    <span class="jn-step ${s.done ? 'done' : ''}">
      <span class="jn-dot"></span><span class="jn-lbl">${t('journey.' + s.key)}</span>
    </span>${i < steps.length - 1 ? `<span class="jn-line ${s.done ? 'done' : ''}"></span>` : ''}`).join('');
  return `<div class="journey">${dots}</div>`;
}

// Which situations count as "issue" (for the "Has issues" filter).
const hasIssue = (d) => (d.overQty || 0) > 0 || (d.receivedSituation || []).some((s) => ['lost', 'delayed', 'rerouted', 'pending', 'short', 'over'].includes(s.situation));
function matchesStatusFilter(d, f) {
  if (!f || f === 'all') return true;
  if (f === 'partial') return d.status === 'PartiallyReceived';
  if (f === 'intransit') return d.status === 'InTransitPending';
  if (f === 'matched') return ['FullyMatched', 'Paid', 'Archived'].includes(d.status);
  if (f === 'issues') return hasIssue(d);
  return true;
}

const collapsedSet = new Set(); // remembers collapsed invoices across re-rendersfunction renderInventory(container, invoices, ctx, handlers = {}) {
  const months = inventoryMonths(invoices, ctx.goodsReceipts);
  const allMonths = handlers.allMonths === true;
  const statusFilter = handlers.statusFilter || 'all';
  const month = allMonths ? '' : (handlers.month || months[months.length - 1] || '');

  // Build the list: all months (union) or a single month.
  let list = allMonths
    ? invoices.flatMap((inv) => monthlyInventory([inv], ctx, { month: inventoryMonths([inv], ctx.goodsReceipts)[0] || '' }))
    : (month ? monthlyInventory(invoices, ctx, { month }) : []);
  // De-dupe (an invoice can appear once per active month when unioned).
  const seen = new Set();
  list = list.filter((d) => (seen.has(d.invoiceNumber) ? false : seen.add(d.invoiceNumber)));
  list = list.filter((d) => matchesStatusFilter(d, statusFilter));

  // Sort by invoice date (newest / oldest) when requested.

    <div class="inv-list">${list.length ? list.map((d) => detailCard(d, collapsedSet.has(d.invoiceNumber))).join('') : `<p class="muted">${t('inv.none')}</p>`}</div>`;

  // Wire month + all-months + export.
  const sel = container.querySelector('#inv-month');
  if (sel && handlers.onMonth) sel.addEventListener('change', (e) => handlers.onMonth(e.target.value));
  const am = container.querySelector('#inv-allmonths');
  if (am && handlers.onAllMonths) am.addEventListener('click', () => handlers.onAllMonths(!allMonths));
  const exp = container.querySelector('#inv-export');
  if (exp && handlers.onExport) exp.addEventListener('click', () => handlers.onExport(allMonths ? 'all' : month, list));

  // Status filter buttons.
  container.querySelectorAll('.chip-btn[data-status]').forEach((b) => {
    if (handlers.onStatusFilter) b.addEventListener('click', () => handlers.onStatusFilter(b.dataset.status));
  });
  // Sort buttons (toggle off if already active → back to default order).
  container.querySelectorAll('.chip-btn[data-sort]').forEach((b) => {
    if (handlers.onSort) b.addEventListener('click', () => handlers.onSort(sort === b.dataset.sort ? 'default' : b.dataset.sort));
  });

  // Collapse / expand (local UI state, no re-fetch).
  container.querySelectorAll('.inv-toggle').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.inv;
    if (collapsedSet.has(id)) collapsedSet.delete(id); else collapsedSet.add(id);
    const card = container.querySelector(`.inv-card[data-inv="${id}"]`);
    const nowCollapsed = collapsedSet.has(id);
    card.classList.toggle('collapsed', nowCollapsed);

    b.title = nowCollapsed ? t('inv.expand') : t('inv.collapse');
  }));
  const setAll = (collapse) => {
    list.forEach((d) => { if (collapse) collapsedSet.add(d.invoiceNumber); else collapsedSet.delete(d.invoiceNumber); });
    container.querySelectorAll('.inv-card').forEach((card) => {
      card.classList.toggle('collapsed', collapse);
      const b = card.querySelector('.inv-toggle');
      if (b) { b.textContent = collapse ? '▸' : '▾'; b.setAttribute('aria-expanded', String(!collapse)); }
    });
  };
  const cAll = container.querySelector('#inv-collapse');
  if (cAll) cAll.addEventListener('click', () => setAll(true));
  const eAll = container.querySelector('#inv-expand');
  if (eAll) eAll.addEventListener('click', () => setAll(false));

  // "View invoice" → open the printable e-invoice document for that invoice.
  container.querySelectorAll('.inv-doc-btn').forEach((b) => b.addEventListener('click', (e) => {

// ---- Printable EU e-invoice document (task 9) ----
const VAT_RATE = 0.20;
function addDaysIso(dateStr, days) {
  const d = new Date(dateStr || Date.now());
  if (Number.isNaN(d.getTime())) return dateStr || '';
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// Consolidated delivery note — merges all warehouse delivery notes for one invoice.function deliveryNoteDocHtml(invoice, deliveryNotes = [], goodsReceipts = []) {
  const sup = supplierFor(invoice.distributorId);
  const notes = deliveryNotes.filter((d) => d.invoiceNumber === invoice.invoiceNumber);
  // Received keyed by storage + product, so each line shows its own received qty
  // (not the storage's all-product total).
  const recByKey = {};
  goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber)
    .forEach((g) => { const k = `${g.storageId}|${g.stockId}`; recByKey[k] = (recByKey[k] || 0) + g.qtyReceived; });
  const rows = notes.flatMap((n) => n.lines.map((l) => {
    const rec = recByKey[`${n.targetStorageId}|${l.stockId}`] || 0;
    return `<tr>
      <td>${n.deliveryNoteId}</td><td>${n.targetStorageId}</td>
      <td>${productName(l.stockId, l.stockId)}</td>
      <td class="num">${qty(l.qtyShipped)}</td>
      <td class="num">${rec ? qty(rec) : '—'}</td>
      <td>${t('status.' + statusForDeliveryStatus(n.deliveryStatus))}${n.expectedDate ? ` · ${t('inv.eta')} ${n.expectedDate}` : ''}</td>
    </tr>`;
  })).join('');
  const totalShipped = notes.reduce((s, n) => s + n.lines.reduce((a, l) => a + (l.qtyShipped || 0), 0), 0);
  return `
  <article class="invoice-doc">
    <header class="doc-head"><div class="doc-brand">Perfumeries</div>
      <div class="doc-title">${t('dn.title')}</div></header>
    <div class="doc-meta">
      <div><span>${t('inv.doc.number')}</span><strong>${invoice.invoiceNumber}</strong></div>
      <div><span>${t('inv.doc.supplier')}</span><strong>${sup.name}</strong></div>
      <div><span>${t('dn.shipDate')}</span><strong>${invoice.shipDate || invoice.invoiceDate || '—'}</strong></div>
      <div><span>${t('dn.storages')}</span><strong>${new Set(notes.map((n) => n.targetStorageId)).size}</strong></div>
      <div><span>${t('dn.totalShipped')}</span><strong>${qty(totalShipped)}</strong></div>
    </div>
    <p class="muted small">${t('dn.note')}</p>
    <table class="doc-lines"><thead><tr>
      <th>${t('dn.col.note')}</th><th>${t('th.storage')}</th><th>${t('inv.doc.col.desc')}</th>
      <th class="num">${t('dn.col.shipped')}</th><th class="num">${t('th.received')}</th><th>${t('th.status')}</th>
    </tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted">—</td></tr>`}</tbody></table>
  </article>`;
}
function statusForDeliveryStatus(s) {
  if (s === 'Lost') return 'InTransitPending';
  if (s === 'Delayed' || s === 'Rerouted') return 'InTransitPending';
  return 'Received';
}

/** Line-item × storage distribution (from delivery notes) for the doc's second page. */
function lineItemSplit(invoice, deliveryNotes) {
  const notes = deliveryNotes.filter((d) => d.invoiceNumber === invoice.invoiceNumber);
  const storages = [...new Set(notes.map((n) => n.targetStorageId))].sort();
  if (!storages.length) return '';
  // qty[stockId][storageId] = shipped
  const qtyMap = {};
  notes.forEach((n) => n.lines.forEach((l) => {
    (qtyMap[l.stockId] ||= {});
    qtyMap[l.stockId][n.targetStorageId] = (qtyMap[l.stockId][n.targetStorageId] || 0) + (l.qtyShipped || 0);
  }));
  const head = `<th>${t('inv.doc.col.desc')}</th>` + storages.map((s) => `<th class="num">${s}</th>`).join('') + `<th class="num">${t('inv.doc.col.total')}</th>`;
  const rows = invoice.lines.map((l) => {
    const per = qtyMap[l.stockId] || {};
    const cells = storages.map((s) => `<td class="num">${per[s] ? qty(per[s]) : '—'}</td>`).join('');
    const total = storages.reduce((sum, s) => sum + (per[s] || 0), 0);
    return `<tr><td>${productName(l.stockId, l.description)}</td>${cells}<td class="num">${qty(total)}</td></tr>`;
  }).join('');
  const totalsRow = `<tr class="split-total"><td>${t('inv.doc.split.total')}</td>` +
    storages.map((s) => {
      const col = invoice.lines.reduce((sum, l) => sum + ((qtyMap[l.stockId] || {})[s] || 0), 0);
      return `<td class="num">${qty(col)}</td>`;
    }).join('') +
    `<td class="num">${qty(invoice.lines.reduce((sum, l) => sum + Object.values(qtyMap[l.stockId] || {}).reduce((a, b) => a + b, 0), 0))}</td></tr>`;
  return `
    <section class="doc-split">
      <h4 class="doc-split-h">${t('inv.doc.split.title')}</h4>
      <p class="muted small">${t('inv.doc.split.note')}</p>
      <table class="doc-lines"><thead><tr>${head}</tr></thead><tbody>${rows}${totalsRow}</tbody></table>
    </section>`;
}

/** Full Slovak/English e-invoice document for one invoice (returns HTML). */function invoiceDocHtml(invoice, deliveryNotes = []) {
  const sup = supplierFor(invoice.distributorId);
  const isProforma = invoice.type === 'proforma';
  const issue = invoice.invoiceDate || '';
  const rows = invoice.lines.map((l) => {
    const unit = (l.unitPriceNet != null ? l.unitPriceNet : l.unitPriceStandard);
    const net = unit * l.qtyInvoiced;
    const vat = net * VAT_RATE;
    return { name: productName(l.stockId, l.description), qty: l.qtyInvoiced, unit, net, vat, total: net + vat };
  });
  const subtotal = rows.reduce((s, r) => s + r.net, 0);
  const vatTotal = rows.reduce((s, r) => s + r.vat, 0);
  const grand = subtotal + vatTotal;
  const party = (title, p) => `
    <div class="doc-party">

      <div class="doc-ids">
        <span>${t('inv.doc.ico')}: ${p.ico}</span><span>${t('inv.doc.dic')}: ${p.dic}</span><span>${t('inv.doc.icdph')}: ${p.icdph}</span>
      </div>
    </div>`;
  const cell = (v, cls = '') => `<td class="${cls}">${v}</td>`;
  const lineRows = rows.map((r) => `<tr>
    ${cell(r.name)}${cell(qty(r.qty), 'num')}${cell(money(r.unit), 'num')}
    ${cell(money(r.net), 'num')}${cell(money(r.vat), 'num')}${cell(money(r.total), 'num')}
  </tr>`).join('');

  return `
  <article class="invoice-doc">
    <header class="doc-head">
      <div class="doc-brand">Perfumeries</div>
      <div class="doc-title">${isProforma ? t('inv.doc.proforma') : t('inv.doc.title')}</div>
    </header>
    <div class="doc-parties">
      ${party(t('inv.doc.supplier'), sup)}
      ${party(t('inv.doc.buyer'), BUYER)}
    </div>
    <div class="doc-meta">
      <div><span>${t('inv.doc.number')}</span><strong>${invoice.invoiceNumber}</strong></div>
      <div><span>${t('inv.doc.issue')}</span><strong>${issue}</strong></div>
      <div><span>${t('inv.doc.delivery')}</span><strong>${invoice.shipDate || issue}</strong></div>
      <div><span>${t('inv.doc.due')}</span><strong>${addDaysIso(issue, 30)}</strong></div>
      <div><span>${t('inv.doc.po')}</span><strong>${invoice.poReference || '—'}</strong></div>
      <div><span>${t('inv.doc.vs')}</span><strong>${String(invoice.invoiceNumber).replace(/\D/g, '') || '—'}</strong></div>
    </div>
    <table class="doc-lines">
      <thead><tr>
        <th>${t('inv.doc.col.desc')}</th><th class="num">${t('inv.doc.col.qty')}</th>
        <th class="num">${t('inv.doc.col.unit')}</th><th class="num">${t('inv.doc.col.net')}</th>
        <th class="num">${t('inv.doc.col.vat')}</th><th class="num">${t('inv.doc.col.total')}</th>
      </tr></thead>
      <tbody>${lineRows}</tbody>
    </table>
    <div class="doc-totals">
      <div><span>${t('inv.doc.subtotal')}</span><strong>${money(subtotal)}</strong></div>
      <div><span>${t('inv.doc.vat20')}</span><strong>${money(vatTotal)}</strong></div>
      <div class="grand"><span>${t('inv.doc.grand')}</span><strong>${money(grand)}</strong></div>
    </div>
    <div class="doc-pay">
      <div><span>${t('inv.doc.bank')}</span> ${BUYER.bank}</div>
      <div><span>${t('inv.doc.iban')}</span> ${sup.iban}</div>
      <div><span>${t('inv.doc.currency')}</span> ${invoice.currency || 'EUR'}</div>
    </div>
    <p class="doc-reg">${t('inv.doc.reg')}: ${BUYER.reg}</p>
    <p class="doc-einv">🔒 ${t('inv.doc.einv')}</p>
    ${lineItemSplit(invoice, deliveryNotes)}
  </article>`;
}function renderDashboard(container, role, pf, handlers = {}) {
  if (role === 'operations') container.innerHTML = operationsHtml(pf, handlers.storageId || null);
  else if (role === 'finance') container.innerHTML = financeHtml(pf);
  else container.innerHTML = operationsHtml(pf, handlers.storageId || null);

  const filter = container.querySelector('#storage-filter');
  if (filter && handlers.onFilter) filter.addEventListener('change', (e) => handlers.onFilter(e.target.value || null));
  container.querySelectorAll('.drill').forEach((b) => { if (handlers.onDrill) b.addEventListener('click', () => handlers.onDrill(b.dataset.storage)); });
  const board = container.querySelector('#board-export');
  if (board && handlers.onBoardExport) board.addEventListener('click', () => handlers.onBoardExport());

  // Penalty calculator sliders — live penalty = outstanding value × %.
  container.querySelectorAll('.penalty-row').forEach((row) => {
    const base = Number(row.dataset.base) || 0;
    const range = row.querySelector('.penalty-range');
    const pctOut = row.querySelector('.penalty-pct');
    const amtOut = row.querySelector('.penalty-amt');
    if (range) range.addEventListener('input', () => {
      const p = Number(range.value);
      pctOut.textContent = p.toFixed(1) + '%';
      amtOut.textContent = money(base * p / 100);
    });
  });
  container.querySelectorAll('.act-pay').forEach((b) => { if (handlers.onMarkPaid) b.addEventListener('click', () => handlers.onMarkPaid(b.dataset.inv)); });
  container.querySelectorAll('.act-archive').forEach((b) => { if (handlers.onArchive) b.addEventListener('click', () => handlers.onArchive(b.dataset.inv)); });

  // Bulk actions (#21): enable the bulk button when any checkbox is ticked.
  const cbs = [...container.querySelectorAll('.bulk-cb')];
  const bulkBtn = container.querySelector('#bulk-pay');
  if (bulkBtn) {
    const sync = () => { bulkBtn.disabled = !cbs.some((c) => c.checked); };
    cbs.forEach((c) => c.addEventListener('change', sync));
    bulkBtn.addEventListener('click', () => {
      const ids = cbs.filter((c) => c.checked).map((c) => c.dataset.inv);
      if (handlers.onBulkPay && ids.length) handlers.onBulkPay(ids);
    });
    sync();
  }
}


// ===== src/ui/tour.js =====
// Guided "walk me through" demo. An animated pointer glides to each target, a
// spotlight ring highlights it, a click pulse fires, and a caption explains the step.
// Special steps:
//   { intro: true, text }                      — centered welcome window (no target)
//   { selector, text, before?, satellites? }   — highlight one element; optional
//        satellites: [{ selector, text, dir }] render small arrow-tip banners pointing
//        at several parts of the screen at once (dir: 'up'|'down'|'left'|'right').
// `before` runs first (e.g. switch tab) so the target exists before we point at it.function startTour(steps, labels = { next: 'Next', skip: 'Skip', done: 'Done', start: 'Start tour' }) {
  let i = 0;
  const overlay = document.createElement('div'); overlay.className = 'tour-overlay';
  const ring = document.createElement('div'); ring.className = 'tour-ring'; ring.setAttribute('aria-hidden', 'true');
  const pointer = document.createElement('div'); pointer.className = 'tour-pointer'; pointer.setAttribute('aria-hidden', 'true');
  const box = document.createElement('div'); box.className = 'tour-box';
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-live', 'polite');
  const satLayer = document.createElement('div'); satLayer.className = 'tour-satellites'; satLayer.setAttribute('aria-hidden', 'true');
  overlay.append(ring, pointer, satLayer, box);
  document.body.appendChild(overlay);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); cleanup(); }
    else if (e.key === 'Enter') { const nx = box.querySelector('.tour-next'); if (nx) { e.preventDefault(); nx.click(); } }
  };
  const cleanup = () => { document.removeEventListener('keydown', onKey); overlay.remove(); };
  document.addEventListener('keydown', onKey);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function positionTo(el) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2 + window.scrollX;
    const cy = r.top + r.height / 2 + window.scrollY;
    pointer.style.transform = `translate(${cx}px, ${cy}px)`;
    ring.style.left = `${r.left + window.scrollX}px`;
    ring.style.top = `${r.top + window.scrollY}px`;
    ring.style.width = `${r.width}px`;
    ring.style.height = `${r.height}px`;
    ring.style.opacity = '1';
    const boxTop = r.bottom + window.scrollY + 14;
    box.style.left = `${clamp(r.left + window.scrollX, 12, window.innerWidth - 352)}px`;
    box.style.top = `${boxTop}px`;
    box.style.transform = '';
    pointer.classList.remove('click'); void pointer.offsetWidth; pointer.classList.add('click');
  }

  function centerBox() {
    ring.style.opacity = '0';
    pointer.style.opacity = '0';
    box.style.left = '50%';
    box.style.top = '42%';
    box.style.transform = 'translate(-50%, -50%)';
  }

  // Place small arrow-tip banners next to several targets at once.
  function renderSatellites(sats = []) {
    satLayer.innerHTML = '';
    sats.forEach((s) => {
      const el = document.querySelector(s.selector);
      if (!el) return;
      const r = el.getBoundingClientRect();
      const dir = s.dir || 'up';
      const tip = document.createElement('div');
      tip.className = `tour-tip tip-${dir}`;
      tip.innerHTML = `<span class="tour-tip-arrow"></span><span class="tour-tip-tx">${s.text}</span>`;
      let left = r.left + window.scrollX;
      let top = r.top + window.scrollY;
      const W = 220;
      if (dir === 'up') { top = r.bottom + window.scrollY + 8; left = clamp(left, 8, window.innerWidth - W - 8); }
      else if (dir === 'down') { top = r.top + window.scrollY - 8; left = clamp(left, 8, window.innerWidth - W - 8); }
      else if (dir === 'left') { left = r.right + window.scrollX + 10; top = r.top + window.scrollY; }
      else { left = clamp(r.left + window.scrollX - W - 10, 8, window.innerWidth - W - 8); top = r.top + window.scrollY; }
      tip.style.left = `${left}px`;
      tip.style.top = `${top}px`;
      // fade/slide in with a slight stagger
      tip.style.animationDelay = `${Math.random() * 180}ms`;
      satLayer.appendChild(tip);
    });
  }

  async function show() {
    const step = steps[i];
    satLayer.innerHTML = '';
    if (step.before) { try { step.before(); } catch { /* ignore */ } }
    await wait(160);

    const last = i === steps.length - 1;
    const nextLabel = last ? labels.done : labels.next;

    if (step.intro) {
      centerBox();
      box.innerHTML = `<h4 class="tour-h">${step.title || ''}</h4><p>${step.text}</p><div class="tour-actions">
        <button class="tour-skip">${labels.skip}</button>
        <button class="tour-next">${labels.start || labels.next}</button></div>`;
    } else {
      const el = document.querySelector(step.selector) || document.body;
      try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch { /* ignore */ }
      await wait(240);
      pointer.style.opacity = '1';
      positionTo(el);
      box.innerHTML = `<p>${step.text}</p><div class="tour-actions">
        <button class="tour-skip">${labels.skip}</button>
        <button class="tour-next">${nextLabel}</button></div>`;
      if (step.satellites) { await wait(180); renderSatellites(step.satellites); }
    }

    const nextBtn = box.querySelector('.tour-next');
    nextBtn.onclick = () => { i += 1; if (i >= steps.length) cleanup(); else show(); };
    box.querySelector('.tour-skip').onclick = cleanup;
    try { nextBtn.focus(); } catch { /* ignore */ }
  }

  show();
  return { stop: cleanup };
}


// ===== src/ui/boot.js =====
// Animated "connecting to systems" boot loader. Shows a centered console card with
// a progress bar and a step log: the current step spins, completed steps get a ✓
// (and can swap to a "done" text). Returns a promise that resolves when finished.
// Steps: [{ text, done? }].

/**
 * Controller-based loader shown IMMEDIATELY (before data finishes loading), so the
 * page never sits blank. Drive it with step()/markDone()/finish() from the caller,
 * interleaving with async work.
 */function createBootLoader({ title = 'Connecting…' } = {}) {
  const ov = document.createElement('div');
  ov.className = 'boot-overlay';
  ov.innerHTML = `
    <div class="boot-card">
      <div class="boot-title"><span class="boot-dot"></span>${title}</div>
      <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
      <ul class="boot-log" id="boot-log"></ul>
    </div>`;
  document.body.appendChild(ov);
  const log = ov.querySelector('#boot-log');
  const fill = ov.querySelector('#boot-fill');
  let current = null;
  let pct = 6;
  fill.style.width = `${pct}%`;

  function finalize() {
    if (!current) return;
    current.classList.remove('active');
    current.classList.add('done');
    current.querySelector('.ic').textContent = '✓';
    const d = current.dataset.done;
    if (d) current.querySelector('.tx').textContent = d;
  }

  return {
    step(text) {
      finalize();
      const li = document.createElement('li');
      li.className = 'boot-step active';
      li.innerHTML = `<span class="ic spin"></span><span class="tx">${text}</span>`;
      log.appendChild(li);
      log.scrollTop = log.scrollHeight;
      current = li;
      pct = Math.min(92, pct + 9);
      fill.style.width = `${pct}%`;
    },
    markDone(doneText) { if (current) current.dataset.done = doneText; },
    finish() {
      finalize();
      fill.style.width = '100%';
      return new Promise((r) => setTimeout(() => { ov.remove(); r(); }, 350));
    },
  };
}function playBootLoader(steps, { title = 'Connecting…', perStepMs = 1500 } = {}) {
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.className = 'boot-overlay';
    ov.innerHTML = `
      <div class="boot-card">
        <div class="boot-title"><span class="boot-dot"></span>${title}</div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
        <ul class="boot-log" id="boot-log"></ul>
      </div>`;
    document.body.appendChild(ov);
    const log = ov.querySelector('#boot-log');
    const fill = ov.querySelector('#boot-fill');
    let i = 0;

    function tick() {
      // finalize the previous step
      if (i > 0) {
        const prev = log.children[i - 1];
        prev.classList.remove('active');
        prev.classList.add('done');
        prev.querySelector('.ic').textContent = '✓';
        if (steps[i - 1].done) prev.querySelector('.tx').textContent = steps[i - 1].done;
      }
      if (i >= steps.length) {
        fill.style.width = '100%';
        setTimeout(() => { ov.remove(); resolve(); }, 350);
        return;
      }
      const li = document.createElement('li');
      li.className = 'boot-step active';
      li.innerHTML = `<span class="ic spin"></span><span class="tx">${steps[i].text}</span>`;
      log.appendChild(li);
      log.scrollTop = log.scrollHeight;
      fill.style.width = `${Math.round((i / steps.length) * 100)}%`;
      i += 1;
      setTimeout(tick, perStepMs);
    }
    tick();
  });
}

        { selector: '.chart-wrap', text: t('tour.sat.charts'), dir: 'up' },
      ],
    },
    { selector: '.role-tab[data-role="operations"]', text: t('tour.operations'), before: () => selectRole('operations') },
    { selector: '.connect-bar', text: t('tour.connect') },
    { selector: '.role-tab[data-about]', text: t('tour.about'), before: () => showAbout() },
  ];
  startTour(steps, { next: t('tour.next'), skip: t('tour.skip'), done: t('tour.done'), start: t('tour.start') });
}

// ---- connect a new source (demo dialog) ----
function openConnect(kind) {
  const modal = $('connect-modal');
  const { title, html } = connectForm(kind);
  $('connect-title').textContent = title;
  $('connect-form').innerHTML = html;
  $('connect-cancel').textContent = t('connect.cancel');
  $('connect-save').textContent = t('connect.save');
  modal.dataset.kind = kind;
  modal.hidden = false;
  const first = $('connect-form').querySelector('input, select');
  if (first) try { first.focus(); } catch { /* ignore */ }
}
function closeConnect() { $('connect-modal').hidden = true; }
function saveConnect() {
  const kind = $('connect-modal').dataset.kind;
  const name = ($('cf-name') && $('cf-name').value) || 'Source';
  // Demo: connecting a folder points at ./data/incoming/ where sample files live.
  const path = kind === 'folder' ? (($('cf-path') && $('cf-path').value) || './data/incoming/') : `(${kind.toUpperCase()})`;
  const n = kind === 'folder' ? 2 : 0; // incoming/ ships with a couple of demo files
  closeConnect();
  const li = document.createElement('li');
  li.innerHTML = `<span class="src">${name}</span><span class="state found">${t('connect.done', { name, n, path })}</span>`;
  $('scan-status').appendChild(li);
}
// Classify an uploaded file into an ingest category by extension + XML root tag.
function classifyUpload(name, content) {
  if (/\.csv$/i.test(name)) return 'storage_reports';
  const head = content.slice(0, 400);
  if (/<invoice[\s>]/.test(head)) return 'invoices';
  if (/<deliveryNote[\s>]/.test(head)) return 'delivery_notes';
  if (/<creditNote[\s>]/.test(head)) return 'credit_notes';
  return null;
}

async function handleUpload(fileList) {
  const files = [];
  const unreadable = [];
  for (const f of Array.from(fileList)) {
    try {
      const content = await f.text();
      const category = classifyUpload(f.name, content);
      if (category) files.push({ name: f.name, category, path: `upload://${f.name}`, content });
      else unreadable.push(f.name);
    } catch { unreadable.push(f.name); }
  }

  const status = $('scan-status');
  if (!files.length) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="src">Upload</span><span class="state error">${t('upload.none')}</span>`;
    status.appendChild(li);
    return;
  }

  const ingest = ingestFiles(files);
  persistIngest(store, ingest);
  // Re-run matching/lifecycle so newly uploaded receipts/notes update invoice status.
  const receipts = store.all('goodsReceipts');
  const dns = store.all('deliveryNotes');
  for (const inv of store.all('invoices')) {
    applyMatchStatus(store, inv.invoiceNumber, matchInvoice(inv, receipts, dns), { actor: 'upload' });
  }
  rebuildPortfolio();

  const li = document.createElement('li');
  li.innerHTML = `<span class="src">Upload</span><span class="state found">${t('upload.done', {
    n: files.length, inv: ingest.invoices.length, dn: ingest.deliveryNotes.length,
    gr: ingest.goodsReceipts.length, cn: ingest.creditNotes.length,
  })}</span>`;
  status.appendChild(li);
  if (unreadable.length) {
    const e = document.createElement('li');
    e.innerHTML = `<span class="src"></span><span class="state error">${t('upload.err', { n: unreadable.length, names: unreadable.join(', ') })}</span>`;
    status.appendChild(e);
  }
  renderCurrentView();
}

function wireConnectButtons() {
  ['edi', 'api', 'folder'].forEach((k) => {
    const b = $(`connect-${k}`);
    if (b) b.addEventListener('click', () => openConnect(k));
  });
  const close = $('connect-close'); if (close) close.addEventListener('click', closeConnect);
  const cancel = $('connect-cancel'); if (cancel) cancel.addEventListener('click', closeConnect);
  const save = $('connect-save'); if (save) save.addEventListener('click', saveConnect);
  const modal = $('connect-modal');
  if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeConnect(); });
  const upBtn = $('connect-upload'); const upInput = $('upload-input');
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('connect-modal').hidden) closeConnect();
    if (!$('doc-modal').hidden) closeDoc();
  });
  if (upBtn && upInput) {
    upBtn.addEventListener('click', () => upInput.click());
    upInput.addEventListener('change', (e) => { handleUpload(e.target.files); e.target.value = ''; });
  }
}

// ---- language ----
function switchLang(l) {
  session.setLang(l); setLang(l);
  applyI18n(); renderTopScan(); renderRoleBar(); renderCurrentView();
}

// ---- boot ----
async function runConnect() {
  // Show the loader IMMEDIATELY, then load data in the background so the page is never blank.
  const loader = createBootLoader({ title: t('boot.title') });
  loader.step(t('boot.db'));
  const pipelinePromise = runPipeline(store, defaultSources());

  await delay(jitter(650, 200)); // connecting to database — a moment to establish
  loader.step(t('boot.checkInv'));

  let ingest; let portfolio;
  try {
    ({ ingest, portfolio } = await pipelinePromise);
  } catch (err) {
    await loader.finish();
    const root = $('view-root'); show(root);
    root.innerHTML = `<h2>Startup error</h2><p class="err">${err.message}</p>`;
    return;
  }
  lastIngest = ingest; ALL_PORTFOLIO = portfolio;

  await delay(jitter(1100, 300)); loader.step(t('boot.invLoaded', { n: ingest.invoices.length })); // "downloading" invoices — longer
  await delay(jitter(500, 150)); loader.step(t('boot.api'));                                        // quick handshake
  await delay(jitter(900, 250)); loader.step(t('boot.cnLoaded', { n: ingest.creditNotes.length })); // pulling credit notes

  const whEntries = Object.entries(warehouseCounts(ingest)).sort(([a], [b]) => a.localeCompare(b));
  for (const [whId, n] of whEntries) {
    await delay(jitter(420, 220)); // connect to each warehouse — snappy but uneven
    loader.step(t('boot.whConnect', { wh: whId }));
    await delay(jitter(520, 260)); // receiving its delivery update — varies by volume
    loader.markDone(t('boot.whDone', { wh: whId, n }));
  }
  await delay(jitter(1300, 300)); loader.step(t('boot.finalizing')); // reconciling — the heavy step
  await delay(jitter(700, 200)); await loader.finish();

  show($('scan-panel'));
  renderTopScan();
  // Default landing view: Home (page 0).
  showHome();
}

function boot() {
  setLang(session.getLang());
  if ($('build-status')) $('build-status').textContent = `v${VERSION}`;
  applyI18n();
  $('tour-btn').addEventListener('click', launchTour);
  document.querySelectorAll('#lang-switch .flag').forEach((b) => b.addEventListener('click', () => switchLang(b.dataset.lang)));
  wireConnectButtons();
  wireDocModal();
  runConnect();
}

// ---- login gate (demo-only, hardcoded credentials) ----
// NOTE: client-side hardcoded credentials are visible in the source and provide no
// real security. This is a demonstration gate only.
const DEMO_CREDS = { user: 'Finance', pass: 'Pegasus' };

function enterApp() {
  $('login-screen').hidden = true;
  $('denied-screen').hidden = true;
  $('app-header').hidden = false;
  $('app').hidden = false;
  $('app-footer').hidden = false;
  boot();
}

function showDenied() {
  $('login-screen').hidden = true;
  $('app-header').hidden = true;
  $('app').hidden = true;
  $('app-footer').hidden = true;
  $('denied-screen').hidden = false;
}

function applyLoginI18n() {
  if ($('login-sub')) $('login-sub').textContent = t('app.subtitle');
  if ($('login-user-label')) $('login-user-label').textContent = t('login.user');
  if ($('login-pass-label')) $('login-pass-label').textContent = t('login.pass');
  if ($('login-btn')) $('login-btn').textContent = t('login.signIn');
  if ($('login-note')) $('login-note').textContent = t('login.note');
  if ($('denied-title')) $('denied-title').textContent = t('login.deniedTitle');
  if ($('denied-body')) $('denied-body').textContent = t('login.deniedBody');
  if ($('denied-back')) $('denied-back').textContent = t('login.back');
}

function wireLogin() {
  setLang(session.getLang());
  applyLoginI18n();
  const form = $('login-card');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const u = $('login-user').value.trim();
    const p = $('login-pass').value;
    if (u === DEMO_CREDS.user && p === DEMO_CREDS.pass) {
      enterApp();
    } else {
      const err = $('login-err');
      err.textContent = t('login.error');
      err.hidden = false;
      // After a clearly wrong attempt, route to the "not granted" page.
      setTimeout(showDenied, 700);
    }
  });
  const back = $('denied-back');
  if (back) back.addEventListener('click', () => {
    $('denied-screen').hidden = true;
    $('login-screen').hidden = false;
    $('login-err').hidden = true;
    $('login-pass').value = '';
    try { $('login-user').focus(); } catch { /* ignore */ }
  });
  try { $('login-user').focus(); } catch { /* ignore */ }
}

document.addEventListener('DOMContentLoaded', wireLogin);
