<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfumeries — Contra COGS Reconciliation</title>
  <style>
:root {
  --bg: #f5f5f5;
  --panel: #ffffff;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --border: #e5e5e5;
  --accent: #2d6cdf;
  --ok: #1c9c6b;
  --warn: #e0a400;
  --err: #e74c3c;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
}

.app-header {
  background: var(--ink);
  color: #fff;
  padding: 14px 22px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.app-header h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
.app-header .subtitle { color: #b9b9b9; font-size: 0.85rem; }

main { max-width: 1100px; margin: 22px auto; padding: 0 18px; display: grid; gap: 18px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
}
.panel h2 { margin: 0 0 12px; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

.scan-status { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.scan-status li { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; }
.scan-status .src { font-weight: 600; min-width: 120px; }
.scan-status .state { color: var(--muted); }
.scan-status .state.found { color: var(--ok); }
.scan-status .state.error { color: var(--err); }

.app-footer {
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
  padding: 14px;
}

.summary { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.summary li { font-size: 0.95rem; }
.summary li strong { font-size: 1.05rem; color: var(--accent); }
.summary li.warn { color: var(--warn); }
.summary li.err { color: var(--err); }
.hint { color: var(--muted); font-size: 0.85rem; margin-top: 14px; }

.model-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
@media (max-width: 640px) { .model-choices { grid-template-columns: 1fr; } }
.model-btn {
  text-align: left; background: #fff; border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; cursor: pointer; display: grid; gap: 6px;
  transition: border-color .15s, box-shadow .15s;
}
.model-btn:hover { border-color: var(--accent); }
.model-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,108,223,0.15); }
.model-btn .model-name { font-weight: 700; font-size: 1rem; }
.model-btn .model-desc { color: var(--muted); font-size: 0.85rem; }
.badge {
  display: inline-block; font-size: 0.72rem; font-weight: 700; color: #fff;
  background: var(--accent); border-radius: 999px; padding: 2px 10px; vertical-align: middle; margin-left: 8px;
}

.summary-line { font-size: 0.9rem; color: var(--ink); margin: 12px 0 0; }
.summary-line .warn { color: var(--warn); }
.summary-line .err { color: var(--err); }

.role-bar { max-width: 1100px; margin: 0 auto; padding: 0 18px; display: flex; gap: 8px; }
.role-tab {
  background: #fff; border: 1px solid var(--border); border-bottom: none;
  border-radius: 8px 8px 0 0; padding: 10px 18px; cursor: pointer; font-weight: 600; color: var(--muted);
}
.role-tab.active { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }

.dash-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dash-head h3 { margin: 0; }
.filter select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }

h3 { margin: 4px 0 12px; }
h4 { margin: 18px 0 8px; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

table.grid { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.grid th, table.grid td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
table.grid th { color: var(--muted); font-weight: 600; }
table.grid tbody tr:hover { background: #fafafa; }

.muted { color: var(--muted); font-size: 0.9rem; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 4px; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
.card .k { color: var(--muted); font-size: 0.8rem; }
.card .v { font-size: 1.4rem; font-weight: 700; color: var(--accent); }

button.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }

.inv-controls { display: flex; align-items: center; gap: 10px; }
.btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 12px; cursor: pointer; font: inherit; }
.btn:hover { filter: brightness(1.05); }
.inv-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.inv-card-head { font-size: 1rem; margin-bottom: 4px; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; background: #eef2fb; color: var(--accent); border-radius: 999px; padding: 2px 10px; }

.kv { list-style: none; margin: 6px 0 4px; padding: 0; display: grid; gap: 4px; }
.kv li { display: flex; gap: 10px; font-size: 0.92rem; }
.kv li span { color: var(--muted); min-width: 90px; }

</style>
</head>
<body>
  <header class="app-header">
    <h1>Perfumeries</h1>
    <span class="subtitle">Contra COGS Reconciliation</span>
  </header>

  <main id="app">

    </section>
    <nav id="role-bar" class="role-bar" hidden></nav>
    <section id="view-root" class="panel" hidden></section>
  </main>

  <footer class="app-footer">
    <span id="build-status">offline build</span>
  </footer>

// Frozen objects; use the exported *_VALUES arrays for membership checks.const ContraCogsModel = Object.freeze({ A: 'A', B: 'B' });const CONTRA_COGS_MODEL_VALUES = Object.freeze(Object.values(ContraCogsModel));const FulfilmentStatus = Object.freeze({

});const INVOICE_STATUS_VALUES = Object.freeze(Object.values(InvoiceStatus));const ResolutionOption = Object.freeze({

/** True if `value` is a member of the given *_VALUES array. */function isEnumValue(values, value) {
  return values.includes(value);
}


// ===== src/lib/models.js =====
// Domain model factories with validation.
// Each factory normalizes input, validates required fields, and returns a frozen object.
// Throws a descriptive Error on invalid input so ingestion can capture the reason.



// ---- validation helpers ---------------------------------------------------

function req(obj, field, ctx) {
  const v = obj[field];
  if (v === undefined || v === null || v === '') {
    throw new Error(`${ctx}: missing required field "${field}"`);
  }
  return v;
}

function num(obj, field, ctx, { min = -Infinity } = {}) {
  const v = obj[field];
  if (typeof v !== 'number' || Number.isNaN(v)) {
    throw new Error(`${ctx}: field "${field}" must be a number (got ${JSON.stringify(v)})`);
  }
  if (v < min) throw new Error(`${ctx}: field "${field}" must be >= ${min} (got ${v})`);
  return v;
}

function optNum(obj, field, ctx, opts) {
  return obj[field] === undefined || obj[field] === null || obj[field] === ''
    ? null
    : num(obj, field, ctx, opts);
}

function oneOf(obj, field, values, ctx) {
  const v = req(obj, field, ctx);
  if (!isEnumValue(values, v)) {
    throw new Error(`${ctx}: field "${field}" must be one of ${values.join('|')} (got "${v}")`);
  }
  return v;
}

// ---- source documents -----------------------------------------------------function createInvoiceLine(input, ctx = 'InvoiceLine') {
  return Object.freeze({
    stockId: req(input, 'stockId', ctx),
    description: input.description ?? '',
    qtyInvoiced: num(input, 'qtyInvoiced', ctx, { min: 0 }),
    unitPriceStandard: num(input, 'unitPriceStandard', ctx, { min: 0 }),
    unitPriceNet: optNum(input, 'unitPriceNet', ctx, { min: 0 }), // Model A only
    targetStorage: input.targetStorage ?? null,
  });
}function createInvoice(input) {
  const ctx = `Invoice(${input?.invoiceNumber ?? '?'})`;
  const lines = Array.isArray(input.lines) ? input.lines.map((l) => createInvoiceLine(l, ctx)) : [];
  if (lines.length === 0) throw new Error(`${ctx}: must have at least one line`);
  return Object.freeze({
    invoiceNumber: req(input, 'invoiceNumber', ctx),
    type: input.type ?? 'final', // proforma | final
    distributorId: req(input, 'distributorId', ctx),
    contraCogsModel: oneOf(input, 'contraCogsModel', CONTRA_COGS_MODEL_VALUES, ctx),
    poReference: input.poReference ?? null,
    invoiceDate: input.invoiceDate ?? null,
    shipDate: input.shipDate ?? null,
    incoterms: input.incoterms ?? null,
    currency: input.currency ?? null,
    discountTiers: Array.isArray(input.discountTiers) ? Object.freeze([...input.discountTiers]) : [],
    totalValueStandard: num(input, 'totalValueStandard', ctx, { min: 0 }),
    status: input.status ? oneOf(input, 'status', INVOICE_STATUS_VALUES, ctx) : InvoiceStatus.RECEIVED,
    sourceFile: input.sourceFile ?? null,
    lines,
  });
}function createDeliveryNote(input) {
  const ctx = `DeliveryNote(${input?.deliveryNoteId ?? '?'})`;
  const lines = Array.isArray(input.lines)
    ? input.lines.map((l, i) => Object.freeze({
        stockId: req(l, 'stockId', `${ctx}.line[${i}]`),
        qtyShipped: num(l, 'qtyShipped', `${ctx}.line[${i}]`, { min: 0 }),
      }))
    : [];
  return Object.freeze({
    deliveryNoteId: req(input, 'deliveryNoteId', ctx),
    invoiceNumber: input.invoiceNumber ?? null,
    targetStorageId: req(input, 'targetStorageId', ctx),
    shipDate: input.shipDate ?? null,
    sourceFile: input.sourceFile ?? null,
    lines,
  });
}function createGoodsReceipt(input) {
  const ctx = 'GoodsReceipt';
  return Object.freeze({
    invoiceNumber: req(input, 'invoiceNumber', ctx),
    stockId: req(input, 'stockId', ctx),
    storageId: req(input, 'storageId', ctx),
    qtyReceived: num(input, 'qtyReceived', ctx, { min: 0 }),
    receiptDatetime: req(input, 'receiptDatetime', ctx),
    recadvRef: input.recadvRef ?? null,
    sourceFile: input.sourceFile ?? null,
  });
}function createCreditNote(input) {
  const ctx = `CreditNote(${input?.creditNoteId ?? '?'})`;
  return Object.freeze({
    creditNoteId: req(input, 'creditNoteId', ctx),
    distributorId: req(input, 'distributorId', ctx),
    period: req(input, 'period', ctx),
    invoiceRef: input.invoiceRef ?? null,
    basisQty: num(input, 'basisQty', ctx, { min: 0 }),
    basisValue: num(input, 'basisValue', ctx, { min: 0 }),
    tierApplied: optNum(input, 'tierApplied', ctx, { min: 0 }),
    amount: num(input, 'amount', ctx, { min: 0 }),
    status: input.status ? oneOf(input, 'status', CREDIT_NOTE_STATUS_VALUES, ctx) : CreditNoteStatus.PENDING,
    sourceFile: input.sourceFile ?? null,
  });
}

// ---- derived / operational models -----------------------------------------function createGap(input) {
  const ctx = `Gap(${input?.gapId ?? '?'})`;
  return Object.freeze({
    gapId: req(input, 'gapId', ctx),
    invoiceNumber: req(input, 'invoiceNumber', ctx),
    stockId: req(input, 'stockId', ctx),
    missingQty: num(input, 'missingQty', ctx, { min: 0 }),
    valueAtRisk: num(input, 'valueAtRisk', ctx, { min: 0 }),

}function createGinrAccrual(input) {
  const ctx = 'GinrAccrual';
  return Object.freeze({
    invoiceNumber: req(input, 'invoiceNumber', ctx),
    period: req(input, 'period', ctx),

  const fullyMatched = lines.length > 0 && lines.every((l) => l.status === FulfilmentStatus.FULLY_DELIVERED);

/** Match many invoices; aggregates receipts once. */function matchAll(invoices, goodsReceipts, deliveryNotes = []) {
  const agg = aggregateReceipts(goodsReceipts);

}


// ===== src/lib/gap.js =====
// Gap engine. Detects contra COGS gaps on missing units, allocates the header
// discount proportionally by line value, and values gaps under Model A vs Model B.
// Invariants: tier is derived from INVOICED qty; contra amount from RECEIVED qty
// (kept separate); allocated discount sums to the header total; Model B credit
// stays Pending until the full volume/period condition clears.





/** Resolve the tier percentage for a quantity. maxQty null = open-ended top tier. */function resolveTier(discountTiers, qty) {
  for (const t of discountTiers) {
    const min = t.minQty ?? 0;
    const max = t.maxQty; // null = no upper bound
    if (qty >= min && (max === null || max === undefined || qty <= max)) return t.pct ?? 0;
  }
  return null;
}const totalInvoicedQty = (invoice) => invoice.lines.reduce((s, l) => s + l.qtyInvoiced, 0);const lineValue = (l) => l.unitPriceStandard * l.qtyInvoiced;const totalInvoicedValue = (invoice) => invoice.lines.reduce((s, l) => s + lineValue(l), 0);

/** Header discount total = totalValueStandard * tier%(from invoiced qty). */function headerDiscountTotal(invoice) {
  const pct = resolveTier(invoice.discountTiers, totalInvoicedQty(invoice));
  return pct == null ? 0 : (invoice.totalValueStandard * pct) / 100;
}

/**
 * Allocate the header discount to each line proportionally by line value.
 * Property 5: the sum of allocations equals the header discount total.
 */function allocateDiscount(invoice) {
  const total = headerDiscountTotal(invoice);
  const totVal = totalInvoicedValue(invoice) || 1;
  return invoice.lines.map((l) => {
    const lv = lineValue(l);
    return { stockId: l.stockId, lineValue: lv, allocated: total * (lv / totVal), perUnit: (total * (lv / totVal)) / (l.qtyInvoiced || 1) };
  });
}

/** Per-unit net price for a line under the active model. */
function netUnitPrice(invoice, line, alloc) {
  if (invoice.contraCogsModel === ContraCogsModel.A && line.unitPriceNet != null) return line.unitPriceNet;
  return line.unitPriceStandard - alloc.perUnit; // Model B (or A without explicit net): standard minus allocated discount
}

/**
 * Build gaps for an invoice given its match result. One gap per short line,
 * valued at the net value of the missing units.
 */function gapsForInvoice(invoice, matchResult) {
  const allocs = allocateDiscount(invoice);
  const gaps = [];
  matchResult.lines.forEach((ml, i) => {
    if (ml.missingQty > 0) {
      const line = invoice.lines[i];
      const alloc = allocs[i];
      const netUnit = netUnitPrice(invoice, line, alloc);
      gaps.push(createGap({
        gapId: `${invoice.invoiceNumber}:${ml.stockId}`,
        invoiceNumber: invoice.invoiceNumber,
        stockId: ml.stockId,
        missingQty: ml.missingQty,
        valueAtRisk: Number((netUnit * ml.missingQty).toFixed(2)),
      }));
    }
  });
  return gaps;
}

/**
 * Contra COGS recognition summary for an invoice.
 * - tierPct: from INVOICED qty (Property 4)
 * - headerDiscountTotal: full contra if fully delivered
 * - recognizedContra: on DELIVERED value (received capped at invoiced)
 * - Model B: creditStatus stays Pending until fully delivered (Property 10)
 */function computeContra(invoice, matchResult) {
  const invoicedQty = totalInvoicedQty(invoice);
  const tierPct = resolveTier(invoice.discountTiers, invoicedQty);
  const discountTotal = headerDiscountTotal(invoice);

  const deliveredValue = matchResult.lines.reduce((s, ml, i) => {
    const line = invoice.lines[i];
    const delivered = Math.min(ml.received, line.qtyInvoiced); // don't let over-delivery inflate
    return s + line.unitPriceStandard * delivered;
  }, 0);

  const recognizedContra = tierPct == null ? 0 : Number(((deliveredValue * tierPct) / 100).toFixed(2));

  const isModelB = invoice.contraCogsModel === ContraCogsModel.B;
  const creditStatus = isModelB
    ? (matchResult.fullyMatched ? CreditNoteStatus.CLEARED : CreditNoteStatus.PENDING)
    : null;
  const pendingCredit = isModelB && !matchResult.fullyMatched ? recognizedContra : 0;

  return {
    invoiceNumber: invoice.invoiceNumber,
    model: invoice.contraCogsModel,
    tierPct,
    headerDiscountTotal: Number(discountTotal.toFixed(2)),
    deliveredValue: Number(deliveredValue.toFixed(2)),
    recognizedContra,
    creditStatus,
    pendingCredit,
    fullyMatched: matchResult.fullyMatched,
  };
}

/** Map of stockId -> net unit price under the active model (used by the timing engine). */function netUnitPrices(invoice) {
  const allocs = allocateDiscount(invoice);
  const map = {};
  invoice.lines.forEach((l, i) => { map[l.stockId] = netUnitPrice(invoice, l, allocs[i]); });
  return map;
}

/** Net payable retained for the invoice (never reduced by unreceived goods). */function netPayable(invoice) {
  return Number((invoice.totalValueStandard - headerDiscountTotal(invoice)).toFixed(2));
}

/** Convenience: match + gaps + contra for one invoice. */function analyzeInvoice(invoice, goodsReceipts, deliveryNotes = []) {
  const match = matchInvoice(invoice, goodsReceipts, deliveryNotes);
  return { match, gaps: gapsForInvoice(invoice, match), contra: computeContra(invoice, match) };
}


// ===== src/lib/timing.js =====
// Timing engine. Assigns receipts to calendar-month periods, detects invoices whose
// receipts straddle a period boundary, produces split debits per period, and carries
// unreceived value as a GINR accrual flagged "value missing — locate". The full
// liability is always retained (never netted down). FOB shipping point puts
// in-transit loss risk on the receiver.





/** Calendar-month period 'YYYY-MM' from a datetime string. */function periodOf(datetime) {
  const m = String(datetime).match(/^(\d{4})-(\d{2})/);
  return m ? `${m[1]}-${m[2]}` : null;
}

/** Distinct periods present in a set of receipts (sorted). */function periodsOf(goodsReceipts) {
  return [...new Set(goodsReceipts.map((g) => periodOf(g.receiptDatetime)).filter(Boolean))].sort();
}

/** True if the receipts span more than one calendar month. */function straddles(goodsReceipts) {
  return periodsOf(goodsReceipts).length > 1;
}

/**
 * One split debit per period: net value of units received in that period.
 * Uses net unit prices (contra COGS already applied) per the invoice's model.
 */function splitDebits(invoice, goodsReceipts) {
  const net = netUnitPrices(invoice);
  const byPeriod = new Map();
  for (const g of goodsReceipts) {
    if (g.invoiceNumber !== invoice.invoiceNumber) continue;
    const p = periodOf(g.receiptDatetime);
    if (!byPeriod.has(p)) byPeriod.set(p, { amount: 0, date: g.receiptDatetime });
    const bucket = byPeriod.get(p);
    bucket.amount += (net[g.stockId] ?? g.qtyReceived * 0) * g.qtyReceived;
    if (g.receiptDatetime > bucket.date) bucket.date = g.receiptDatetime;
  }
  return [...byPeriod.entries()]
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([period, b]) => createSplitDebit({
      invoiceNumber: invoice.invoiceNumber,
      period,
      amount: Number(b.amount.toFixed(2)),
      date: b.date,
    }));
}

/** Days between two dates (whole days, >= 0). */
function daysBetween(fromDate, toDate) {
  const a = new Date(fromDate).getTime();
  const b = new Date(toDate).getTime();
  if (Number.isNaN(a) || Number.isNaN(b)) return 0;
  return Math.max(0, Math.round((b - a) / 86400000));
}

/**
 * GINR accrual for unreceived value at period close. Returns null if fully matched.
 * Value = net value of missing units. Flagged "value missing — locate" with age + owner.
 */function ginrAccrual(invoice, matchResult, { period, owner = null, asOf = new Date().toISOString() } = {}) {
  if (matchResult.fullyMatched) return null;
  const net = netUnitPrices(invoice);
  let value = 0;
  matchResult.lines.forEach((ml) => { value += (net[ml.stockId] ?? 0) * ml.missingQty; });
  if (value <= 0) return null;
  const closePeriod = period || periodOf(asOf) || periodOf(invoice.invoiceDate) || '';
  return createGinrAccrual({
    invoiceNumber: invoice.invoiceNumber,
    period: closePeriod,
    value: Number(value.toFixed(2)),
    ageDays: daysBetween(invoice.invoiceDate || invoice.shipDate || asOf, asOf),
    owner,
  });
}

/** Who bears in-transit loss for unreceived value. */function inTransitRisk(invoice) {
  const terms = String(invoice.incoterms || '').toUpperCase();
  return terms.includes('SHIPPING_POINT') || terms.includes('EX_WORKS') ? 'receiver' : 'supplier';
}

/** Bundle the timing view for one invoice. */function analyzeTiming(invoice, goodsReceipts, matchResult, opts = {}) {
  const mine = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);
  const match = matchResult || matchInvoice(invoice, mine);
  return {
    invoiceNumber: invoice.invoiceNumber,
    periods: periodsOf(mine),
    straddles: straddles(mine),
    splitDebits: splitDebits(invoice, mine),
    ginr: ginrAccrual(invoice, match, opts),
    inTransitRisk: inTransitRisk(invoice),
    netPayableRetained: netPayable(invoice), // full liability retained regardless of receipts
  };
}


// ===== src/lib/governance.js =====
// Governance engine + audit trail. Manages gap ownership, resolution options,
// the closure document, the lost-forever "backdoor" (1-manager approval), and an
// append-only audit trail. All six resolution options stay available regardless
// of cause. A gap cannot close without a recorded resolution; Unresolvable
// requires a recorded manager approval (Property 9). Audit is append-only (Property 8).const GapStatus = Object.freeze({ OPEN: 'open', RESOLVED: 'resolved', UNRESOLVABLE: 'unresolvable' });

/** All resolution options, always available regardless of the gap's cause (Req 7.1, 7.2). */function availableResolutionOptions() {
  return [...RESOLUTION_OPTION_VALUES];
}

/** Persist a gap as open + owned, and audit it. */function registerGap(store, gap, { actor = 'system', owner = null } = {}) {
  const g = { ...gap, status: GapStatus.OPEN, owner: owner ?? gap.owner ?? null };
  store.put('gaps', g);
  store.appendAudit(createAuditEntry({ entityId: gap.gapId, actor, change: `gap opened (missing ${gap.missingQty})` }));
  return g;
}

/** Gaps still open (flagged/owned until resolved) — Req 8.1. */function openGaps(store) {
  return store.all('gaps').filter((g) => g.status === GapStatus.OPEN);
}

/**
 * Resolve a gap with a chosen option (records a Resolution first, then closes it).
 * Misroute handling is manual: pass option StockTransfer with a note; we record the
 * decision without injecting phantom receipts, so nothing is double counted (Req 7.4).
 */function resolveGap(store, gapId, { option, evidenceDocRef = null, actor = 'system', approver = null, note = null } = {}) {
  if (!isEnumValue(RESOLUTION_OPTION_VALUES, option)) {
    throw new Error(`Governance: unknown resolution option "${option}"`);
  }
  const gap = store.get('gaps', gapId);
  if (!gap) throw new Error(`Governance: gap "${gapId}" not found`);

  const resolution = createResolution({ gapId, option, evidenceDocRef, approver });
  store.put('resolutions', resolution);
  store.put('gaps', { ...gap, status: GapStatus.RESOLVED });
  store.appendAudit(createAuditEntry({
    entityId: gapId, actor,
    change: `resolved via ${option}${note ? `: ${note}` : ''}`,
    evidenceRef: evidenceDocRef,
  }));
  return resolution;
}

/**
 * Backdoor: mark a lost-forever item Unresolvable. REQUIRES a manager approver
 * before the terminal state (Req 8.4 / Property 9). Records a resolution + audit.
 */function applyBackdoor(store, gapId, { actor = 'system', approver = null, option = 'WriteOff', note = null } = {}) {
  if (!approver) throw new Error('Governance: backdoor requires 1-manager approval (approver required)');
  if (!isEnumValue(RESOLUTION_OPTION_VALUES, option)) {
    throw new Error(`Governance: unknown resolution option "${option}"`);
  }
  const gap = store.get('gaps', gapId);
  if (!gap) throw new Error(`Governance: gap "${gapId}" not found`);

  const resolution = createResolution({ gapId, option, approver, evidenceDocRef: note });
  store.put('resolutions', resolution);
  store.put('gaps', { ...gap, status: GapStatus.UNRESOLVABLE });
  store.appendAudit(createAuditEntry({
    entityId: gapId, actor,
    change: `backdoor: marked Unresolvable via ${option} (approved by ${approver})`,
  }));
  return resolution;
}

/** Record a decision + next steps for an open item (Req 8.3). */function recordDecision(store, entityId, { decision, nextSteps = null, actor = 'system' } = {}) {
  store.appendAudit(createAuditEntry({
    entityId, actor,
    change: `decision: ${decision}${nextSteps ? `; next: ${nextSteps}` : ''}`,
  }));
  return store.auditLog().at(-1);
}

/**
 * Generate a closure document — only when the invoice is fully matched AND paid.
 * (Lifecycle sets status Paid only after Fully Matched, so Paid implies matched.) Req 8.2.
 */function generateClosureDocument(store, invoiceNumber, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Governance: invoice "${invoiceNumber}" not found`);
  if (inv.status !== InvoiceStatus.PAID) {
    throw new Error('Governance: closure document only for fully matched & Paid invoices');
  }
  const doc = {
    type: 'closure',
    invoiceNumber,
    distributorId: inv.distributorId,
    totalValueStandard: inv.totalValueStandard,
    generatedAt: new Date().toISOString(),
  };
  store.appendAudit(createAuditEntry({ entityId: invoiceNumber, actor, change: 'closure document generated' }));
  return doc;
}

/** Align recognized contra COGS to verified received quantity (Req 7.5). */function alignRecognizedContra(invoice, goodsReceipts) {
  return computeContra(invoice, matchInvoice(invoice, goodsReceipts));
}


// ===== src/lib/lifecycle.js =====
// Invoice lifecycle state machine. Enforces valid status transitions and audits
// each change. Also derives the natural status from a match result so ingestion
// can auto-advance an invoice (Received -> In Transit / Partially Received / Fully Matched).




// Allowed transitions per the design state diagram.const TRANSITIONS = Object.freeze({
  [InvoiceStatus.RECEIVED]: [
    InvoiceStatus.IN_TRANSIT_PENDING, InvoiceStatus.PARTIALLY_RECEIVED,
    InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.IN_TRANSIT_PENDING]: [
    InvoiceStatus.PARTIALLY_RECEIVED, InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.PARTIALLY_RECEIVED]: [
    InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.FULLY_MATCHED]: [InvoiceStatus.PAID],
  [InvoiceStatus.PAID]: [InvoiceStatus.ARCHIVED],
  [InvoiceStatus.ARCHIVED]: [],
  [InvoiceStatus.UNDER_INVESTIGATION]: [InvoiceStatus.RESOLVED, InvoiceStatus.UNRESOLVABLE],
  [InvoiceStatus.RESOLVED]: [InvoiceStatus.FULLY_MATCHED, InvoiceStatus.PARTIALLY_RECEIVED],
  [InvoiceStatus.UNRESOLVABLE]: [],
});function canTransition(from, to) {
  return (TRANSITIONS[from] || []).includes(to);
}

/** Transition an invoice's status, validating and auditing. Throws on invalid transition. */function transition(store, invoiceNumber, to, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Lifecycle: invoice "${invoiceNumber}" not found`);
  const from = inv.status;
  if (from === to) return inv; // no-op
  if (!canTransition(from, to)) {
    throw new Error(`Lifecycle: invalid transition ${from} -> ${to} for ${invoiceNumber}`);
  }
  const updated = store.setInvoiceStatus(invoiceNumber, to);
  store.appendAudit(createAuditEntry({ entityId: invoiceNumber, actor, change: `status ${from} -> ${to}` }));
  return updated;
}

/** Natural status implied by a match result. */function deriveStatus(matchResult) {
  if (matchResult.fullyMatched) return InvoiceStatus.FULLY_MATCHED;
  const anyReceived = matchResult.lines.some((l) => l.received > 0);
  return anyReceived ? InvoiceStatus.PARTIALLY_RECEIVED : InvoiceStatus.IN_TRANSIT_PENDING;
}

/**
 * Advance an invoice to the status implied by its match result, if that transition
 * is valid from the current status. Returns the (possibly unchanged) status.
 */function applyMatchStatus(store, invoiceNumber, matchResult, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Lifecycle: invoice "${invoiceNumber}" not found`);
  const target = deriveStatus(matchResult);
  if (inv.status === target) return inv.status;
  if (canTransition(inv.status, target)) {
    transition(store, invoiceNumber, target, { actor });
    return target;
  }
  return inv.status; // leave as-is if not a valid auto-advance
}


// ===== src/lib/analytics.js =====
// Analytics / view-model layer. Turns stored documents into per-invoice views and
// role-specific selections for the Storage, Accounting, and Finance dashboards.
// Pure functions (no DOM) so they can be unit-tested.





const CLOSED = new Set([InvoiceStatus.FULLY_MATCHED, InvoiceStatus.PAID, InvoiceStatus.ARCHIVED]);

/** Build an enriched view for one invoice. */function buildInvoiceView(invoice, goodsReceipts, deliveryNotes = [], opts = {}) {
  const receipts = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);
  const { match, gaps, contra } = analyzeInvoice(invoice, receipts, deliveryNotes);
  const timing = analyzeTiming(invoice, receipts, match, opts);

  const storages = new Set();
  match.lines.forEach((l) => {
    Object.keys(l.byStorage).forEach((s) => storages.add(s));
    (l.expectedStorages || []).forEach((s) => storages.add(s));
  });

  return {
    invoiceNumber: invoice.invoiceNumber,
    distributorId: invoice.distributorId,
    model: invoice.contraCogsModel,
    status: invoice.status,
    invoicedQty: invoice.lines.reduce((s, l) => s + l.qtyInvoiced, 0),
    receivedQty: match.lines.reduce((s, l) => s + l.received, 0),
    missingQty: match.lines.reduce((s, l) => s + l.missingQty, 0),
    valueAtRisk: Number(gaps.reduce((s, g) => s + g.valueAtRisk, 0).toFixed(2)),
    storages: [...storages],
    contra,
    timing,
    gaps,
    match,
  };
}function buildPortfolio(invoices, goodsReceipts, deliveryNotes = [], opts = {}) {
  return invoices.map((inv) => buildInvoiceView(inv, goodsReceipts, deliveryNotes, opts));
}

// ---- role selectors -------------------------------------------------------

function touchesStorage(view, storageId) {
  return !storageId || view.storages.includes(storageId);
}

/** Storage view: on-way, pending delivery, aged pending, and a period trend. */function storageView(portfolio, { storageId = null } = {}) {
  const scoped = portfolio.filter((v) => touchesStorage(v, storageId));
  const onWay = scoped.filter((v) => v.status === InvoiceStatus.IN_TRANSIT_PENDING);
  const pendingDelivery = scoped.filter((v) => v.status === InvoiceStatus.PARTIALLY_RECEIVED);
  const agedPending = scoped
    .filter((v) => v.timing.ginr)
    .map((v) => ({ invoiceNumber: v.invoiceNumber, value: v.timing.ginr.value, ageDays: v.timing.ginr.ageDays }))
    .sort((a, b) => b.ageDays - a.ageDays);

  const trend = {};
  scoped.forEach((v) => v.timing.splitDebits.forEach((d) => { trend[d.period] = (trend[d.period] || 0) + d.amount; }));
  const trendByPeriod = Object.entries(trend).sort(([a], [b]) => a.localeCompare(b)).map(([period, amount]) => ({ period, amount: Number(amount.toFixed(2)) }));

  return { storageId, onWay, pendingDelivery, agedPending, trendByPeriod, count: scoped.length };
}

/** Accounting view: closed invoices + summary of not-fully-closed and open. */function accountingView(portfolio) {
  const closed = portfolio.filter((v) => CLOSED.has(v.status));
  const open = portfolio.filter((v) => !CLOSED.has(v.status));
  return {
    closed,
    open,
    summary: {
      closedCount: closed.length,
      openCount: open.length,
      openValueAtRisk: Number(open.reduce((s, v) => s + v.valueAtRisk, 0).toFixed(2)),
    },
  };
}

/** Finance view: high-level portfolio summary + storages with pending issues. */function financeView(portfolio) {
  const byStatus = {};
  portfolio.forEach((v) => { byStatus[v.status] = (byStatus[v.status] || 0) + 1; });

  const storagesWithIssues = {};
  portfolio.forEach((v) => {
    if (v.missingQty > 0) {
      // attribute the shortfall to storages that under-delivered vs expected is complex;
      // for the summary we flag every storage the troubled invoice touches.
      v.storages.forEach((s) => {
        if (!storagesWithIssues[s]) storagesWithIssues[s] = { storageId: s, invoices: [], valueAtRisk: 0 };
        storagesWithIssues[s].invoices.push(v.invoiceNumber);
        storagesWithIssues[s].valueAtRisk += v.valueAtRisk;
      });
    }
  });

  return {
    totals: {
      invoices: portfolio.length,
      totalValueAtRisk: Number(portfolio.reduce((s, v) => s + v.valueAtRisk, 0).toFixed(2)),
      totalPendingCredit: Number(portfolio.reduce((s, v) => s + (v.contra.pendingCredit || 0), 0).toFixed(2)),
    },
    byStatus,
    storagesWithIssues: Object.values(storagesWithIssues)
      .map((s) => ({ ...s, valueAtRisk: Number(s.valueAtRisk.toFixed(2)) }))
      .sort((a, b) => b.valueAtRisk - a.valueAtRisk),
  };
}


// ===== src/lib/inventory.js =====
// Inventory audit sub-module (logic). Produces monthly per-invoice audit detail:
// delivered vs invoiced, contra COGS status (applied/pending/cleared), receipts by
// storage with dates, linked delivery/credit notes, provenance, and audit history.
// Exportable per month or per invoice. Pure functions (no DOM).





/** Contra status label for audit display. */function contraStatus(view) {
  if (view.model === ContraCogsModel.A) return 'Applied';
  return view.contra.creditStatus === CreditNoteStatus.CLEARED ? 'Cleared' : 'Pending';
}

/** Months an invoice is active in (invoice date + any receipt periods). */function invoiceMonths(invoice, goodsReceipts) {
  const months = new Set();
  const p = periodOf(invoice.invoiceDate);
  if (p) months.add(p);
  goodsReceipts
    .filter((g) => g.invoiceNumber === invoice.invoiceNumber)
    .forEach((g) => { const m = periodOf(g.receiptDatetime); if (m) months.add(m); });
  return [...months];
}

/** All months present across the portfolio (sorted). */function inventoryMonths(invoices, goodsReceipts) {
  const set = new Set();
  invoices.forEach((inv) => invoiceMonths(inv, goodsReceipts).forEach((m) => set.add(m)));
  return [...set].sort();
}

/** Full audit detail for one invoice. */function invoiceDetail(invoice, { goodsReceipts, deliveryNotes = [], creditNotes = [], auditLog = [] }) {
  const view = buildInvoiceView(invoice, goodsReceipts, deliveryNotes, {});
  const mine = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);

  const byStorage = {};
  mine.forEach((g) => {
    if (!byStorage[g.storageId]) byStorage[g.storageId] = { storageId: g.storageId, qty: 0, receipts: [] };
    byStorage[g.storageId].qty += g.qtyReceived;
    byStorage[g.storageId].receipts.push({ qty: g.qtyReceived, datetime: g.receiptDatetime, recadvRef: g.recadvRef, sourceFile: g.sourceFile });
  });

  return {
    invoiceNumber: invoice.invoiceNumber,
    distributorId: invoice.distributorId,
    model: invoice.contraCogsModel,
    status: invoice.status,
    invoicedQty: view.invoicedQty,
    receivedQty: view.receivedQty,
    missingQty: view.missingQty,
    contraStatus: contraStatus(view),
    recognizedContra: view.contra.recognizedContra,
    pendingCredit: view.contra.pendingCredit,
    receiptsByStorage: Object.values(byStorage),
    deliveryNotes: deliveryNotes
      .filter((d) => d.invoiceNumber === invoice.invoiceNumber)
      .map((d) => ({ deliveryNoteId: d.deliveryNoteId, targetStorageId: d.targetStorageId, sourceFile: d.sourceFile })),
    creditNotes: creditNotes
      .filter((c) => c.invoiceRef === invoice.invoiceNumber)
      .map((c) => ({ creditNoteId: c.creditNoteId, period: c.period, amount: c.amount, status: c.status, sourceFile: c.sourceFile })),
    provenance: { invoiceSourceFile: invoice.sourceFile ?? null },
    audit: auditLog.filter((a) => a.entityId === invoice.invoiceNumber),
  };
}

/** Per-invoice detail for every invoice active in `month`. */function monthlyInventory(invoices, ctx, { month }) {
  return invoices
    .filter((inv) => invoiceMonths(inv, ctx.goodsReceipts).includes(month))
    .map((inv) => invoiceDetail(inv, ctx));
}

/** Export helper (JSON string) for a month or a single invoice detail. */function exportInventory(data) {
  return JSON.stringify(data, null, 2);
}


// ===== src/lib/archive.js =====
// Archival. A fully matched & Paid invoice is moved to the archive: status set to
// Archived and an archive record stored. In the static demo this is an in-app status
// change (+ optional JSON download). A cloud stage supplies a real file-write hook.function canArchive(invoice) {
  return invoice.status === InvoiceStatus.PAID;
}function buildArchiveRecord(invoice) {
  return {
    invoiceNumber: invoice.invoiceNumber,
    distributorId: invoice.distributorId,
    status: InvoiceStatus.ARCHIVED,
    totalValueStandard: invoice.totalValueStandard,
    archivedAt: new Date().toISOString(),
    snapshot: invoice,
  };
}

/**
 * Archive a Paid invoice. Transitions Paid -> Archived (validated + audited by the
 * lifecycle), stores an archive record, and calls the optional persistWrite hook
 * (real file write at the cloud stage). Returns the archive record.
 */function archiveInvoice(store, invoiceNumber, { actor = 'system', persistWrite = null } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Archive: invoice "${invoiceNumber}" not found`);
  if (inv.status !== InvoiceStatus.PAID) {
    throw new Error('Archive: only fully matched & Paid invoices can be archived');
  }
  transition(store, invoiceNumber, InvoiceStatus.ARCHIVED, { actor });
  const record = buildArchiveRecord(store.get('invoices', invoiceNumber));
  store.put('archive', record);
  if (typeof persistWrite === 'function') persistWrite(record); // cloud hook (no-op in demo)
  return record;
}function exportArchive(record) {
  return JSON.stringify(record, null, 2);
}


// ===== src/lib/session.js =====
// Session state for the demo (currently the selected Contra COGS model).
// Backed by a key-value store: sessionStorage in the browser, memory in tests.function createMemoryKV() {
  const m = new Map();
  return {
    getItem: (k) => (m.has(k) ? m.get(k) : null),
    setItem: (k, v) => { m.set(k, String(v)); },
    removeItem: (k) => { m.delete(k); },
  };
}function getSessionBackend() {
  try { if (typeof sessionStorage !== 'undefined') return sessionStorage; } catch { /* sandboxed */ }
  return null;
}class Session {
  constructor(backend = createMemoryKV(), ns = 'perfumeries:session') {
    this.backend = backend;
    this.ns = ns;
  }

  _k(x) { return `${this.ns}:${x}`; }

  setModel(model) {
    if (!isEnumValue(CONTRA_COGS_MODEL_VALUES, model)) throw new Error(`Session: invalid model "${model}"`);
    this.backend.setItem(this._k('model'), model);
    return model;
  }

  getModel() { return this.backend.getItem(this._k('model')); }

  isModelSelected() { return isEnumValue(CONTRA_COGS_MODEL_VALUES, this.getModel()); }

  setRole(role) {
    if (!ROLES.includes(role)) throw new Error(`Session: invalid role "${role}"`);
    this.backend.setItem(this._k('role'), role);
    return role;
  }

  getRole() { return this.backend.getItem(this._k('role')); }

  isRoleSelected() { return ROLES.includes(this.getRole()); }

  clear() { this.backend.removeItem(this._k('model')); this.backend.removeItem(this._k('role')); }
}const ROLES = Object.freeze(['storage', 'accounting', 'finance']);


// ===== src/lib/pipeline.js =====
// End-to-end pipeline orchestrator: scan -> ingest -> persist -> advance lifecycle
// -> build portfolio. Shared by the app UI and the integration test so both drive
// the exact same flow.async function runPipeline(store, sources, { onStatus, asOf } = {}) {
  const { files, results } = await new SourceScanner(sources, { onStatus }).scanAll();
  // A scan reflects the current source truth. Reset first so re-scans / page
  // reloads are idempotent (goodsReceipts is a list and would otherwise pile up).
  store.clearAll();
  const ingest = ingestFiles(files);
  persistIngest(store, ingest);

  const receipts = store.all('goodsReceipts');
  const dns = store.all('deliveryNotes');
  for (const inv of store.all('invoices')) {
    applyMatchStatus(store, inv.invoiceNumber, matchInvoice(inv, receipts, dns), { actor: 'system' });
  }

  const invoices = store.all('invoices');
  const portfolio = buildPortfolio(invoices, receipts, dns, { asOf: asOf || new Date().toISOString() });
  return { scanResults: results, ingest, invoices, portfolio };
}


// ===== src/ui/dashboards.js =====
// Dashboard rendering (DOM). Consumes the pure analytics selectors and renders
// the Storage, Accounting, and Finance views. Event wiring is attached after render.




const money = (n) => '€' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = (n) => (Number(n) || 0).toLocaleString();

function tbl(headers, rows) {
  if (!rows.length) return '<p class="muted">None.</p>';
  const head = headers.map((h) => `<th>${h}</th>`).join('');
  const body = rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
  return `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function storageHtml(pf, storageId) {
  const sv = storageView(pf, { storageId });
  const storages = [...new Set(pf.flatMap((v) => v.storages))].sort();
  const options = ['<option value="">All storages</option>']
    .concat(storages.map((s) => `<option value="${s}"${s === storageId ? ' selected' : ''}>${s}</option>`)).join('');
  return `
    <div class="dash-head"><h3>Storage view</h3>
      <label class="filter">Storage <select id="storage-filter">${options}</select></label></div>
    <h4>On the way (${sv.onWay.length})</h4>
    ${tbl(['Invoice', 'Distributor', 'Invoiced', 'Received'], sv.onWay.map((v) => [v.invoiceNumber, v.distributorId, qty(v.invoicedQty), qty(v.receivedQty)]))}
    <h4>Pending delivery (${sv.pendingDelivery.length})</h4>
    ${tbl(['Invoice', 'Missing', 'Value at risk', 'Storages'], sv.pendingDelivery.map((v) => [v.invoiceNumber, qty(v.missingQty), money(v.valueAtRisk), v.storages.join(', ')]))}
    <h4>Aged pending</h4>
    ${tbl(['Invoice', 'Value', 'Age (days)'], sv.agedPending.map((a) => [a.invoiceNumber, money(a.value), a.ageDays]))}
    <h4>Trend by period (debits)</h4>
    ${tbl(['Period', 'Amount'], sv.trendByPeriod.map((t) => [t.period, money(t.amount)]))}
  `;
}

function accountingHtml(pf) {
  const av = accountingView(pf);
  return `
    <h3>Accounting view</h3>
    <p class="muted">Open: ${av.summary.openCount} · Closed: ${av.summary.closedCount} · Open value at risk: ${money(av.summary.openValueAtRisk)}</p>
    <h4>Open / not fully closed (${av.open.length})</h4>
    ${tbl(['Invoice', 'Status', 'Missing', 'Value at risk'], av.open.map((v) => [v.invoiceNumber, v.status, qty(v.missingQty), money(v.valueAtRisk)]))}
    <h4>Closed (${av.closed.length})</h4>
    ${tbl(['Invoice', 'Status', 'Contra recognized', 'Actions'], av.closed.map((v) => [
      v.invoiceNumber, v.status, money(v.contra.recognizedContra), closedAction(v),
    ]))}
  `;
}

function closedAction(v) {
  if (v.status === 'FullyMatched') return `<button class="link act-pay" data-inv="${v.invoiceNumber}">Mark paid</button>`;
  if (v.status === 'Paid') return `<button class="link act-archive" data-inv="${v.invoiceNumber}">Archive + download</button>`;
  return '—';
}

function financeHtml(pf) {
  const fv = financeView(pf);
  const cards = `
    <div class="cards">
      <div class="card"><span class="k">Invoices</span><span class="v">${fv.totals.invoices}</span></div>
      <div class="card"><span class="k">Value at risk</span><span class="v">${money(fv.totals.totalValueAtRisk)}</span></div>
      <div class="card"><span class="k">Pending contra credit</span><span class="v">${money(fv.totals.totalPendingCredit)}</span></div>
    </div>`;
  return `
    <h3>Finance view</h3>
    ${cards}
    <h4>By status</h4>
    ${tbl(['Status', 'Count'], Object.entries(fv.byStatus).map(([s, c]) => [s, c]))}
    <h4>Storages with pending issues</h4>
    ${tbl(['Storage', 'Invoices', 'Value at risk', ''], fv.storagesWithIssues.map((s) => [s.storageId, s.invoices.join(', '), money(s.valueAtRisk), `<button class="link drill" data-storage="${s.storageId}">view</button>`]))}
  `;
}

const fmtDate = (dt) => String(dt).replace('T', ' ').slice(0, 16);

function detailCard(d) {
  const contraLine = d.contraStatus === 'Applied'
    ? `Contra COGS applied: ${money(d.recognizedContra)}`
    : `Contra COGS ${d.contraStatus.toLowerCase()} — recognized ${money(d.recognizedContra)}${d.pendingCredit ? ` (${money(d.pendingCredit)} pending)` : ''}`;
  return `
    <div class="inv-card">
      <div class="inv-card-head"><strong>${d.invoiceNumber}</strong> <span class="tag">${d.status}</span></div>
      <p class="muted">${d.distributorId} · Model ${d.model}</p>
      <ul class="kv">
        <li><span>Delivered</span><strong>${qty(d.receivedQty)} of ${qty(d.invoicedQty)}</strong></li>
        <li><span>Missing</span><strong>${qty(d.missingQty)}</strong></li>
        <li><span>Contra COGS</span><strong>${contraLine}</strong></li>
      </ul>
      <h4>Receipts by storage</h4>
      ${tbl(['Storage', 'Qty', 'Received on'], d.receiptsByStorage.map((s) => [s.storageId, qty(s.qty), s.receipts.map((r) => fmtDate(r.datetime)).join('<br>')]))}
      <h4>Delivery notes</h4>
      ${tbl(['Note', 'Storage', 'Source'], d.deliveryNotes.map((n) => [n.deliveryNoteId, n.targetStorageId, n.sourceFile || '—']))}
      <h4>Credit notes</h4>
      ${tbl(['Note', 'Period', 'Amount', 'Status', 'Source'], d.creditNotes.map((n) => [n.creditNoteId, n.period, money(n.amount), n.status, n.sourceFile || '—']))}
      <h4>Audit history</h4>
      ${tbl(['When', 'Actor', 'Change'], d.audit.map((a) => [fmtDate(a.timestamp), a.actor, a.change]))}
      <p class="muted">Source: ${d.provenance.invoiceSourceFile || '—'}</p>
    </div>`;
}

/**
 * Render the Inventory audit module.
 * ctx: { goodsReceipts, deliveryNotes, creditNotes, auditLog }
 * handlers: { month, onMonth(month), onExport(month, list) }
 */function renderInventory(container, invoices, ctx, handlers = {}) {
  const months = inventoryMonths(invoices, ctx.goodsReceipts);
  const month = handlers.month || months[months.length - 1] || '';
  const list = month ? monthlyInventory(invoices, ctx, { month }) : [];
  const monthOpts = months.map((m) => `<option value="${m}"${m === month ? ' selected' : ''}>${m}</option>`).join('');

  container.innerHTML = `
    <div class="dash-head"><h3>Inventory — audit</h3>
      <div class="inv-controls">
        <label class="filter">Month <select id="inv-month">${monthOpts}</select></label>
        <button class="btn" id="inv-export">Export month (JSON)</button>
      </div>
    </div>
    ${list.length ? list.map(detailCard).join('') : '<p class="muted">No invoices for this month.</p>'}`;

  const sel = container.querySelector('#inv-month');
  if (sel && handlers.onMonth) sel.addEventListener('change', (e) => handlers.onMonth(e.target.value));
  const exp = container.querySelector('#inv-export');
  if (exp && handlers.onExport) exp.addEventListener('click', () => handlers.onExport(month, list));
}

/**
 * Render a role dashboard into `container`.
 * handlers: { storageId, onFilter(storageId), onDrill(storageId) }
 */function renderDashboard(container, role, pf, handlers = {}) {
  if (role === 'storage') container.innerHTML = storageHtml(pf, handlers.storageId || null);
  else if (role === 'accounting') container.innerHTML = accountingHtml(pf);
  else if (role === 'finance') container.innerHTML = financeHtml(pf);
  else container.innerHTML = '<p class="muted">Select a role.</p>';

  const filter = container.querySelector('#storage-filter');
  if (filter && handlers.onFilter) filter.addEventListener('change', (e) => handlers.onFilter(e.target.value || null));
  container.querySelectorAll('.drill').forEach((b) => {
    if (handlers.onDrill) b.addEventListener('click', () => handlers.onDrill(b.dataset.storage));
  });
  container.querySelectorAll('.act-pay').forEach((b) => {
    if (handlers.onMarkPaid) b.addEventListener('click', () => handlers.onMarkPaid(b.dataset.inv));
  });
  container.querySelectorAll('.act-archive').forEach((b) => {
    if (handlers.onArchive) b.addEventListener('click', () => handlers.onArchive(b.dataset.inv));
  });
}


// ===== src/app.js =====
// Perfumeries — Contra COGS Reconciliation
// Startup flow: choose model -> scan -> ingest -> advance lifecycle -> build
// portfolio -> pick role -> render dashboard.













const $ = (id) => document.getElementById(id);
const show = (el) => { if (el) el.hidden = false; };

const LABELS = { database: 'Database', api: 'API', folder: 'Folder' };
const STATE_CLASS = { [ScanStatus.FOUND]: 'found', [ScanStatus.ERROR]: 'error', [ScanStatus.NO_UPDATES]: '', [ScanStatus.SCANNING]: '' };
const MODEL_DESC = {
  [ContraCogsModel.A]: 'Direct / line-item — net (discounted) unit price already on the invoice.',
  [ContraCogsModel.B]: 'Back-edge allowance — standard price + monthly credit note; contra held pending until cleared.',
};
const ROLE_LABELS = { storage: 'Storage', accounting: 'Accounting', finance: 'Finance' };

// module state
const store = new StateStore(getLocalStorageBackend() || createMemoryBackend(), 'perfumeries');
const session = new Session(getSessionBackend() || createMemoryKV());
let PORTFOLIO = [];
let storageFilter = null;
let currentView = 'role'; // 'role' | 'inventory'
let invMonth = null;

function downloadText(filename, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function renderModelPanel(onChosen) {
  const panel = $('model-panel');
  const current = session.getModel();
  panel.innerHTML = `
    <h2>Choose Contra COGS model</h2>
    <div class="model-choices">
      ${[ContraCogsModel.A, ContraCogsModel.B].map((m) => `
        <button class="model-btn${current === m ? ' selected' : ''}" data-model="${m}">
          <span class="model-name">Model ${m}</span>
          <span class="model-desc">${MODEL_DESC[m]}</span>
        </button>`).join('')}
    </div>
    <p class="hint">Sets the session model for the demo. Individual invoices still carry their own model.</p>`;
  panel.querySelectorAll('.model-btn').forEach((btn) => btn.addEventListener('click', () => {
    session.setModel(btn.dataset.model);
    renderModelPanel(onChosen);
    onChosen(btn.dataset.model);
  }));
}

function renderScanRows() {
  const scan = $('scan-status');
  scan.innerHTML = '';
  const rows = {};
  for (const id of ['database', 'api', 'folder']) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="src">${LABELS[id]}</span><span class="state">idle</span>`;
    scan.appendChild(li);
    rows[id] = li.querySelector('.state');
  }
  return rows;
}

function renderIngestSummary(result, model) {
  const el = $('ingest-summary');
  const storages = new Set(result.goodsReceipts.map((g) => g.storageId));
  const received = result.goodsReceipts.reduce((s, g) => s + g.qtyReceived, 0);
  el.innerHTML = `
    <p class="summary-line">Ingested <span class="badge">Model ${model}</span>
      ${result.invoices.length} invoice(s), ${result.deliveryNotes.length} delivery note(s),
      ${result.goodsReceipts.length} receipt row(s) — ${received} units / ${storages.size} storage(s),
      ${result.creditNotes.length} credit note(s)
      ${result.incomplete.length ? `· <span class="warn">${result.incomplete.length} incomplete</span>` : ''}
      ${result.errors.length ? `· <span class="err">${result.errors.length} error(s)</span>` : ''}
    </p>`;
}

function renderRoleBar() {
  const bar = $('role-bar');
  show(bar);
  const current = session.getRole();
  const roleTabs = ROLES.map((r) =>
    `<button class="role-tab${currentView === 'role' && current === r ? ' active' : ''}" data-role="${r}">${ROLE_LABELS[r]}</button>`).join('');
  const invTab = `<button class="role-tab${currentView === 'inventory' ? ' active' : ''}" data-inventory="1">Inventory</button>`;
  bar.innerHTML = roleTabs + invTab;
  bar.querySelectorAll('.role-tab').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.inventory) openInventory(); else selectRole(b.dataset.role);
  }));
}

function rebuildPortfolio() {
  PORTFOLIO = buildPortfolio(store.all('invoices'), store.all('goodsReceipts'), store.all('deliveryNotes'), { asOf: new Date().toISOString() });
}

function renderCurrentDashboard() {
  const root = $('view-root');
  show(root);
  renderDashboard(root, session.getRole(), PORTFOLIO, {
    storageId: storageFilter,
    onFilter: (sid) => { storageFilter = sid; renderCurrentDashboard(); },
    onDrill: (sid) => { storageFilter = sid; selectRole('storage'); },
    onMarkPaid: (inv) => { transition(store, inv, InvoiceStatus.PAID, { actor: 'accounting' }); rebuildPortfolio(); renderCurrentDashboard(); },
    onArchive: (inv) => {
      const record = archiveInvoice(store, inv, { actor: 'accounting' });
      downloadText(`archive_${inv}.json`, exportArchive(record));
      rebuildPortfolio(); renderCurrentDashboard();
    },
  });
}

function inventoryCtx() {
  return {
    goodsReceipts: store.all('goodsReceipts'),
    deliveryNotes: store.all('deliveryNotes'),
    creditNotes: store.all('creditNotes'),
    auditLog: store.auditLog(),
  };
}

function renderInventoryView() {
  const root = $('view-root');
  show(root);
  const invoices = store.all('invoices');
  renderInventory(root, invoices, inventoryCtx(), {
    month: invMonth,
    onMonth: (m) => { invMonth = m; renderInventoryView(); },
    onExport: (month, list) => downloadText(`inventory_${month || 'all'}.json`, exportInventory(list)),
  });
}

function selectRole(role) {
  currentView = 'role';
  session.setRole(role);
  renderRoleBar();
  renderCurrentDashboard();
}

function openInventory() {
  currentView = 'inventory';
  renderRoleBar();
  renderInventoryView();
}

async function runScan(model) {
  show($('scan-panel'));
  const rows = renderScanRows();
  const onStatus = (id, state, message) => {
    const el = rows[id];
    if (!el) return;
    el.textContent = state === ScanStatus.SCANNING ? (message || 'scanning…') : (message || state);
    el.className = `state ${STATE_CLASS[state] || ''}`.trim();
  };
  try {
    const { ingest, portfolio } = await runPipeline(store, defaultSources(), { onStatus });
    renderIngestSummary(ingest, model);
    PORTFOLIO = portfolio;

    renderRoleBar();
    selectRole(session.isRoleSelected() ? session.getRole() : 'finance');
  } catch (err) {
    const root = $('view-root');
    show(root);
    root.innerHTML = `<h2>Startup error</h2><p class="err">${err.message}</p>`;
  }
}

function boot() {
  const status = $('build-status');
  if (status) status.textContent = `v${VERSION}`;
  let started = false;
  const start = (model) => { if (started) return; started = true; runScan(model); };
  renderModelPanel(start);
  if (session.isModelSelected()) start(session.getModel());
}

document.addEventListener('DOMContentLoaded', boot);

</script>
