<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfumeries — Contra COGS Reconciliation</title>
  <style>
:root {
  --bg: #f5f5f5;
  --panel: #ffffff;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --border: #e5e5e5;
  --accent: #2d6cdf;
  --ok: #1c9c6b;
  --warn: #e0a400;
  --err: #e74c3c;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
}

.app-header {
  background: var(--ink);
  color: #fff;
  padding: 14px 22px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.app-header h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
.app-header .subtitle { color: #b9b9b9; font-size: 0.85rem; }

main { max-width: 1100px; margin: 22px auto; padding: 0 18px; display: grid; gap: 18px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
}
.panel h2 { margin: 0 0 12px; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

.scan-status { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.scan-status li { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; }
.scan-status .src { font-weight: 600; min-width: 120px; }
.scan-status .state { color: var(--muted); }
.scan-status .state.found { color: var(--ok); }
.scan-status .state.error { color: var(--err); }

.app-footer {
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
  padding: 14px;
}

.summary { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.summary li { font-size: 0.95rem; }
.summary li strong { font-size: 1.05rem; color: var(--accent); }
.summary li.warn { color: var(--warn); }
.summary li.err { color: var(--err); }
.hint { color: var(--muted); font-size: 0.85rem; margin-top: 14px; }

.model-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
@media (max-width: 640px) { .model-choices { grid-template-columns: 1fr; } }
.model-btn {
  text-align: left; background: #fff; border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; cursor: pointer; display: grid; gap: 6px;
  transition: border-color .15s, box-shadow .15s;
}
.model-btn:hover { border-color: var(--accent); }
.model-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,108,223,0.15); }
.model-btn .model-name { font-weight: 700; font-size: 1rem; }
.model-btn .model-desc { color: var(--muted); font-size: 0.85rem; }
.badge {
  display: inline-block; font-size: 0.72rem; font-weight: 700; color: #fff;
  background: var(--accent); border-radius: 999px; padding: 2px 10px; vertical-align: middle; margin-left: 8px;
}

.summary-line { font-size: 0.9rem; color: var(--ink); margin: 12px 0 0; }
.summary-line .warn { color: var(--warn); }
.summary-line .err { color: var(--err); }

.role-bar { max-width: 1100px; margin: 0 auto; padding: 0 18px; display: flex; gap: 8px; }
.role-tab {
  background: #fff; border: 1px solid var(--border); border-bottom: none;
  border-radius: 8px 8px 0 0; padding: 10px 18px; cursor: pointer; font-weight: 600; color: var(--muted);
}
.role-tab.active { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }

.dash-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dash-head h3 { margin: 0; }
.filter select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }

h3 { margin: 4px 0 12px; }
h4 { margin: 18px 0 8px; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

table.grid { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.grid th, table.grid td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
table.grid th { color: var(--muted); font-weight: 600; }
table.grid tbody tr:hover { background: #fafafa; }

.muted { color: var(--muted); font-size: 0.9rem; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 4px; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
.card .k { color: var(--muted); font-size: 0.8rem; }
.card .v { font-size: 1.4rem; font-weight: 700; color: var(--accent); }

button.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }

.inv-controls { display: flex; align-items: center; gap: 10px; }
.btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 12px; cursor: pointer; font: inherit; }
.btn:hover { filter: brightness(1.05); }
.inv-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.inv-card-head { font-size: 1rem; margin-bottom: 4px; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; background: #eef2fb; color: var(--accent); border-radius: 999px; padding: 2px 10px; }

.kv { list-style: none; margin: 6px 0 4px; padding: 0; display: grid; gap: 4px; }
.kv li { display: flex; gap: 10px; font-size: 0.92rem; }
.kv li span { color: var(--muted); min-width: 90px; }

/* header controls */
.app-header { justify-content: space-between; align-items: center; }
.app-header .brand { display: flex; align-items: baseline; gap: 12px; }
.header-controls { display: flex; align-items: center; gap: 12px; }
.hc-model { display: flex; align-items: center; gap: 6px; color: #cfcfcf; font-size: 0.8rem; }
.hc-model select { padding: 4px 6px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
.hc-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.85rem; }
.hc-btn:hover { filter: brightness(1.08); }
.lang { display: flex; gap: 4px; }
.lang .flag { background: #2a2a2a; color: #cfcfcf; border: 1px solid #444; border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 0.8rem; }
.lang .flag.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* charts */
.chart-wrap { border: 1px solid var(--border); border-radius: 10px; padding: 8px; background: #fff; }
.chart { width: 100%; height: auto; display: block; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-left: 8px; }
.legend-dot.forecast { background: var(--warn); }
.legend-label { font-size: 0.75rem; color: var(--muted); text-transform: none; letter-spacing: 0; }

/* tour */
.tour-overlay { position: absolute; inset: 0; z-index: 9999; pointer-events: none; }
.tour-ring { position: absolute; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); transition: all .35s ease; }
.tour-pointer { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: rgba(45,108,223,0.85); border: 2px solid #fff; transition: transform .5s cubic-bezier(.4,.2,.2,1); }
.tour-pointer.click { animation: tourClick .5s ease; }
@keyframes tourClick { 0% { box-shadow: 0 0 0 0 rgba(45,108,223,0.5);} 100% { box-shadow: 0 0 0 22px rgba(45,108,223,0);} }
.tour-box { position: absolute; width: 320px; background: #1a1a1a; color: #fff; border-radius: 10px; padding: 14px 16px; pointer-events: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.tour-box p { margin: 0 0 12px; font-size: 0.9rem; line-height: 1.4; }
.tour-actions { display: flex; justify-content: flex-end; gap: 8px; }
.tour-actions button { border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.82rem; }
.tour-skip { background: transparent; color: #cfcfcf; }
.tour-next { background: var(--accent); color: #fff; }

</style>
</head>

  if (!gap) throw new Error(`Governance: gap "${gapId}" not found`);

  const resolution = createResolution({ gapId, option, approver, evidenceDocRef: note });
  store.put('resolutions', resolution);
  store.put('gaps', { ...gap, status: GapStatus.UNRESOLVABLE });
  store.appendAudit(createAuditEntry({
    entityId: gapId, actor,
    change: `backdoor: marked Unresolvable via ${option} (approved by ${approver})`,
  }));
  return resolution;
}

/** Record a decision + next steps for an open item (Req 8.3). */function recordDecision(store, entityId, { decision, nextSteps = null, actor = 'system' } = {}) {

/**

 * (Lifecycle sets status Paid only after Fully Matched, so Paid implies matched.) Req 8.2.
 */function generateClosureDocument(store, invoiceNumber, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);

// ===== src/lib/lifecycle.js =====
// Invoice lifecycle state machine. Enforces valid status transitions and audits
// each change. Also derives the natural status from a match result so ingestion
// can auto-advance an invoice (Received -> In Transit / Partially Received / Fully Matched).




// Allowed transitions per the design state diagram.const TRANSITIONS = Object.freeze({
  [InvoiceStatus.RECEIVED]: [
    InvoiceStatus.IN_TRANSIT_PENDING, InvoiceStatus.PARTIALLY_RECEIVED,
    InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.IN_TRANSIT_PENDING]: [
    InvoiceStatus.PARTIALLY_RECEIVED, InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.PARTIALLY_RECEIVED]: [
    InvoiceStatus.FULLY_MATCHED, InvoiceStatus.UNDER_INVESTIGATION,
  ],
  [InvoiceStatus.FULLY_MATCHED]: [InvoiceStatus.PAID],
  [InvoiceStatus.PAID]: [InvoiceStatus.ARCHIVED],
  [InvoiceStatus.ARCHIVED]: [],
  [InvoiceStatus.UNDER_INVESTIGATION]: [InvoiceStatus.RESOLVED, InvoiceStatus.UNRESOLVABLE],
  [InvoiceStatus.RESOLVED]: [InvoiceStatus.FULLY_MATCHED, InvoiceStatus.PARTIALLY_RECEIVED],
  [InvoiceStatus.UNRESOLVABLE]: [],
});function canTransition(from, to) {
  return (TRANSITIONS[from] || []).includes(to);
}

/** Transition an invoice's status, validating and auditing. Throws on invalid transition. */function transition(store, invoiceNumber, to, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Lifecycle: invoice "${invoiceNumber}" not found`);
  const from = inv.status;
  if (from === to) return inv; // no-op
  if (!canTransition(from, to)) {
    throw new Error(`Lifecycle: invalid transition ${from} -> ${to} for ${invoiceNumber}`);
  }
  const updated = store.setInvoiceStatus(invoiceNumber, to);
  store.appendAudit(createAuditEntry({ entityId: invoiceNumber, actor, change: `status ${from} -> ${to}` }));
  return updated;
}

/** Natural status implied by a match result. */function deriveStatus(matchResult) {
  if (matchResult.fullyMatched) return InvoiceStatus.FULLY_MATCHED;
  const anyReceived = matchResult.lines.some((l) => l.received > 0);
  return anyReceived ? InvoiceStatus.PARTIALLY_RECEIVED : InvoiceStatus.IN_TRANSIT_PENDING;
}

/**
 * Advance an invoice to the status implied by its match result, if that transition
 * is valid from the current status. Returns the (possibly unchanged) status.
 */function applyMatchStatus(store, invoiceNumber, matchResult, { actor = 'system' } = {}) {
  const inv = store.get('invoices', invoiceNumber);
  if (!inv) throw new Error(`Lifecycle: invoice "${invoiceNumber}" not found`);
  const target = deriveStatus(matchResult);
  if (inv.status === target) return inv.status;
  if (canTransition(inv.status, target)) {
    transition(store, invoiceNumber, target, { actor });
    return target;
  }
  return inv.status; // leave as-is if not a valid auto-advance
}

// Analytics / view-model layer. Turns stored documents into per-invoice views and
// role-specific selections for the Storage, Accounting, and Finance dashboards.
// Pure functions (no DOM) so they can be unit-tested.





const CLOSED = new Set([InvoiceStatus.FULLY_MATCHED, InvoiceStatus.PAID, InvoiceStatus.ARCHIVED]);

/** Build an enriched view for one invoice. */function buildInvoiceView(invoice, goodsReceipts, deliveryNotes = [], opts = {}) {
  const receipts = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);
  const { match, gaps, contra } = analyzeInvoice(invoice, receipts, deliveryNotes);
  const timing = analyzeTiming(invoice, receipts, match, opts);

  const storages = new Set();
  match.lines.forEach((l) => {
    Object.keys(l.byStorage).forEach((s) => storages.add(s));
    (l.expectedStorages || []).forEach((s) => storages.add(s));
  });

  return {
    invoiceNumber: invoice.invoiceNumber,
    distributorId: invoice.distributorId,
    model: invoice.contraCogsModel,
    status: invoice.status,
    month: periodOf(invoice.invoiceDate),
    invoicedQty: invoice.lines.reduce((s, l) => s + l.qtyInvoiced, 0),
    receivedQty: match.lines.reduce((s, l) => s + l.received, 0),
    missingQty: match.lines.reduce((s, l) => s + l.missingQty, 0),
    valueAtRisk: Number(gaps.reduce((s, g) => s + g.valueAtRisk, 0).toFixed(2)),
    storages: [...storages],
    contra,
    timing,
    gaps,
    match,
  };

  return invoices.map((inv) => buildInvoiceView(inv, goodsReceipts, deliveryNotes, opts));
}

// ---- role selectors -------------------------------------------------------

function touchesStorage(view, storageId) {
  return !storageId || view.storages.includes(storageId);
}

/** Storage view: on-way, pending delivery, aged pending, and a period trend. */function storageView(portfolio, { storageId = null } = {}) {
  const scoped = portfolio.filter((v) => touchesStorage(v, storageId));
  const onWay = scoped.filter((v) => v.status === InvoiceStatus.IN_TRANSIT_PENDING);
  const pendingDelivery = scoped.filter((v) => v.status === InvoiceStatus.PARTIALLY_RECEIVED);
  const agedPending = scoped
    .filter((v) => v.timing.ginr)
    .map((v) => ({ invoiceNumber: v.invoiceNumber, value: v.timing.ginr.value, ageDays: v.timing.ginr.ageDays }))
    .sort((a, b) => b.ageDays - a.ageDays);

  const trend = {};
  scoped.forEach((v) => v.timing.splitDebits.forEach((d) => { trend[d.period] = (trend[d.period] || 0) + d.amount; }));
  const trendByPeriod = Object.entries(trend).sort(([a], [b]) => a.localeCompare(b)).map(([period, amount]) => ({ period, amount: Number(amount.toFixed(2)) }));

  return { storageId, onWay, pendingDelivery, agedPending, trendByPeriod, count: scoped.length };
}

/** Accounting view: closed invoices + summary of not-fully-closed and open. */function accountingView(portfolio) {
  const closed = portfolio.filter((v) => CLOSED.has(v.status));
  const open = portfolio.filter((v) => !CLOSED.has(v.status));
  return {
    closed,
    open,
    summary: {
      closedCount: closed.length,
      openCount: open.length,
      openValueAtRisk: Number(open.reduce((s, v) => s + v.valueAtRisk, 0).toFixed(2)),
    },
  };
}

/** Finance view: high-level portfolio summary + storages with pending issues. */function financeView(portfolio) {
  const byStatus = {};
  portfolio.forEach((v) => { byStatus[v.status] = (byStatus[v.status] || 0) + 1; });

  // Storages linked to still-open invoices that have a shortfall. We count open
  // invoices per storage (no value inflation — the same invoice's value at risk is
  // not multiplied across every storage it touches).
  const storagesWithIssues = {};
  portfolio.forEach((v) => {
    if (v.missingQty > 0 && !CLOSED.has(v.status)) {
      v.storages.forEach((s) => {
        if (!storagesWithIssues[s]) storagesWithIssues[s] = { storageId: s, openInvoices: [], count: 0 };
        storagesWithIssues[s].openInvoices.push(v.invoiceNumber);
        storagesWithIssues[s].count += 1;
      });
    }
  });

  return {
    totals: {
      invoices: portfolio.length,
      openValueAtRisk: Number(portfolio.filter((v) => !CLOSED.has(v.status)).reduce((s, v) => s + v.valueAtRisk, 0).toFixed(2)),
      totalPendingCredit: Number(portfolio.reduce((s, v) => s + (v.contra.pendingCredit || 0), 0).toFixed(2)),
    },
    byStatus,
    storagesWithIssues: Object.values(storagesWithIssues).sort((a, b) => b.count - a.count),
  };
}

// Inventory audit sub-module (logic). Produces monthly per-invoice audit detail:
// delivered vs invoiced, contra COGS status (applied/pending/cleared), receipts by
// storage with dates, linked delivery/credit notes, provenance, and audit history.
// Exportable per month or per invoice. Pure functions (no DOM).





/** Contra status label for audit display. */function contraStatus(view) {
  if (view.model === ContraCogsModel.A) return 'Applied';
  return view.contra.creditStatus === CreditNoteStatus.CLEARED ? 'Cleared' : 'Pending';
}

/** Months an invoice is active in (invoice date + any receipt periods). */function invoiceMonths(invoice, goodsReceipts) {
  const months = new Set();
  const p = periodOf(invoice.invoiceDate);
  if (p) months.add(p);
  goodsReceipts
    .filter((g) => g.invoiceNumber === invoice.invoiceNumber)
    .forEach((g) => { const m = periodOf(g.receiptDatetime); if (m) months.add(m); });
  return [...months];
}

/** All months present across the portfolio (sorted). */function inventoryMonths(invoices, goodsReceipts) {
  const set = new Set();
  invoices.forEach((inv) => invoiceMonths(inv, goodsReceipts).forEach((m) => set.add(m)));
  return [...set].sort();
}

/** Full audit detail for one invoice. */function invoiceDetail(invoice, { goodsReceipts, deliveryNotes = [], creditNotes = [], auditLog = [] }) {
  const view = buildInvoiceView(invoice, goodsReceipts, deliveryNotes, {});
  const mine = goodsReceipts.filter((g) => g.invoiceNumber === invoice.invoiceNumber);

  const byStorage = {};
  mine.forEach((g) => {
    if (!byStorage[g.storageId]) byStorage[g.storageId] = { storageId: g.storageId, qty: 0, receipts: [] };
    byStorage[g.storageId].qty += g.qtyReceived;
    byStorage[g.storageId].receipts.push({ qty: g.qtyReceived, datetime: g.receiptDatetime, recadvRef: g.recadvRef, sourceFile: g.sourceFile });
  });

  return {
    invoiceNumber: invoice.invoiceNumber,
    distributorId: invoice.distributorId,
    model: invoice.contraCogsModel,
    status: invoice.status,
    invoicedQty: view.invoicedQty,
    receivedQty: view.receivedQty,
    missingQty: view.missingQty,
    contraStatus: contraStatus(view),
    recognizedContra: view.contra.recognizedContra,
    pendingCredit: view.contra.pendingCredit,
    receiptsByStorage: Object.values(byStorage),
    deliveryNotes: deliveryNotes
      .filter((d) => d.invoiceNumber === invoice.invoiceNumber)
      .map((d) => ({ deliveryNoteId: d.deliveryNoteId, targetStorageId: d.targetStorageId, sourceFile: d.sourceFile })),
    creditNotes: creditNotes
      .filter((c) => c.invoiceRef === invoice.invoiceNumber)
      .map((c) => ({ creditNoteId: c.creditNoteId, period: c.period, amount: c.amount, status: c.status, sourceFile: c.sourceFile })),
    provenance: { invoiceSourceFile: invoice.sourceFile ?? null },
    audit: auditLog.filter((a) => a.entityId === invoice.invoiceNumber),
  };
}

/** Per-invoice detail for every invoice active in `month`. */function monthlyInventory(invoices, ctx, { month }) {
  return invoices
    .filter((inv) => invoiceMonths(inv, ctx.goodsReceipts).includes(month))
    .map((inv) => invoiceDetail(inv, ctx));
}

/** Export helper (JSON string) for a month or a single invoice detail. */function exportInventory(data) {

}

// ===== src/lib/forecast.js =====
// Monthly aggregation + a simple forecast for the Finance view. Pure functions.

/** Aggregate a portfolio into monthly series: value at risk, debits, recognized contra. */function monthlySeries(portfolio) {
  const months = new Set();
  const risk = {};
  const debits = {};
  const contra = {};

  for (const v of portfolio) {
    if (v.month) {
      months.add(v.month);
      risk[v.month] = (risk[v.month] || 0) + v.valueAtRisk;
      contra[v.month] = (contra[v.month] || 0) + (v.contra?.recognizedContra || 0);
    }
    for (const d of v.timing?.splitDebits || []) {
      months.add(d.period);
      debits[d.period] = (debits[d.period] || 0) + d.amount;
    }
  }

  const sorted = [...months].sort();
  return {
    months: sorted,
    risk: sorted.map((m) => Number((risk[m] || 0).toFixed(2))),
    debits: sorted.map((m) => Number((debits[m] || 0).toFixed(2))),
    contra: sorted.map((m) => Number((contra[m] || 0).toFixed(2))),
  };
}

/** Add n months to a 'YYYY-MM' string. */function addMonths(period, n) {
  const [y, m] = period.split('-').map(Number);
  const idx = (y * 12 + (m - 1)) + n;
  const ny = Math.floor(idx / 12);
  const nm = (idx % 12) + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}

/**
 * Least-squares linear forecast of `values` projected `n` steps ahead.
 * Returns { months, values } for the projected points (clamped at >= 0).
 */function forecast(months, values, n = 3) {
  const k = values.length;
  if (k === 0) return { months: [], values: [] };
  if (k === 1) {
    const out = { months: [], values: [] };
    for (let i = 1; i <= n; i++) { out.months.push(addMonths(months[0], i)); out.values.push(Number(values[0].toFixed(2))); }
    return out;
  }
  // linear regression y = a + b*x, x = 0..k-1
  const xs = values.map((_, i) => i);
  const meanX = xs.reduce((s, x) => s + x, 0) / k;
  const meanY = values.reduce((s, y) => s + y, 0) / k;
  let num = 0, den = 0;
  for (let i = 0; i < k; i++) { num += (xs[i] - meanX) * (values[i] - meanY); den += (xs[i] - meanX) ** 2; }
  const b = den === 0 ? 0 : num / den;
  const a = meanY - b * meanX;
  const out = { months: [], values: [] };
  const last = months[months.length - 1];
  for (let i = 1; i <= n; i++) {
    const y = a + b * (k - 1 + i);
    out.months.push(addMonths(last, i));
    out.values.push(Number(Math.max(0, y).toFixed(2)));
  }
  return out;
}


// ===== src/lib/pipeline.js =====
// End-to-end pipeline orchestrator: scan -> ingest -> persist -> advance lifecycle
// -> build portfolio. Shared by the app UI and the integration test so both drive
// the exact same flow.async function runPipeline(store, sources, { onStatus, asOf } = {}) {
  const { files, results } = await new SourceScanner(sources, { onStatus }).scanAll();
  // A scan reflects the current source truth. Reset first so re-scans / page
  // reloads are idempotent (goodsReceipts is a list and would otherwise pile up).
  store.clearAll();
  const ingest = ingestFiles(files);
  persistIngest(store, ingest);

  const receipts = store.all('goodsReceipts');
  const dns = store.all('deliveryNotes');
  for (const inv of store.all('invoices')) {
    applyMatchStatus(store, inv.invoiceNumber, matchInvoice(inv, receipts, dns), { actor: 'system' });
  }

  const invoices = store.all('invoices');
  const portfolio = buildPortfolio(invoices, receipts, dns, { asOf: asOf || new Date().toISOString() });
  return { scanResults: results, ingest, invoices, portfolio };
}


// ===== src/ui/charts.js =====
// Tiny dependency-free SVG charts. Return markup strings.

function scaleMax(vals) {
  const m = Math.max(1, ...vals.map((v) => Number(v) || 0));
  const pow = Math.pow(10, Math.floor(Math.log10(m)));
  return Math.ceil(m / pow) * pow;
}
const short = (lab) => String(lab).slice(2); // '2026-01' -> '26-01'

/** Grouped bar chart of two monthly series. */function groupedBars(labels, a, b, opts = {}) {
  const { width = 680, height = 220, colorA = '#2d6cdf', colorB = '#1c9c6b', labelA = 'A', labelB = 'B' } = opts;
  const pad = { l: 44, r: 10, t: 18, b: 28 };
  const iw = width - pad.l - pad.r, ih = height - pad.t - pad.b;
  const max = scaleMax([...a, ...b]);
  const n = labels.length || 1, groupW = iw / n, barW = Math.min(16, groupW / 3);
  const y = (v) => pad.t + ih - ((Number(v) || 0) / max) * ih;
  let bars = '';
  labels.forEach((lab, i) => {
    const gx = pad.l + i * groupW + groupW / 2;
    bars += `<rect x="${(gx - barW - 1).toFixed(1)}" y="${y(a[i]).toFixed(1)}" width="${barW}" height="${(pad.t + ih - y(a[i])).toFixed(1)}" fill="${colorA}"/>`;
    bars += `<rect x="${(gx + 1).toFixed(1)}" y="${y(b[i]).toFixed(1)}" width="${barW}" height="${(pad.t + ih - y(b[i])).toFixed(1)}" fill="${colorB}"/>`;
    bars += `<text x="${gx.toFixed(1)}" y="${height - 10}" font-size="9" text-anchor="middle" fill="#6b6b6b">${short(lab)}</text>`;
  });
  const axis = `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${width - pad.r}" y2="${pad.t + ih}" stroke="#e5e5e5"/><text x="2" y="${pad.t + 8}" font-size="9" fill="#6b6b6b">${max.toLocaleString()}</text>`;
  const legend = `<rect x="${pad.l}" y="2" width="10" height="10" fill="${colorA}"/><text x="${pad.l + 14}" y="11" font-size="10" fill="#1a1a1a">${labelA}</text><rect x="${pad.l + 120}" y="2" width="10" height="10" fill="${colorB}"/><text x="${pad.l + 134}" y="11" font-size="10" fill="#1a1a1a">${labelB}</text>`;
  return `<svg viewBox="0 0 ${width} ${height}" class="chart" preserveAspectRatio="xMidYMid meet">${axis}${bars}${legend}</svg>`;
}

/** Line chart with a dashed forecast tail. */function lineForecast(labels, actual, fLabels, fValues, opts = {}) {
  const { width = 680, height = 220, color = '#2d6cdf', fcolor = '#e0a400' } = opts;
  const pad = { l: 44, r: 10, t: 18, b: 28 };
  const iw = width - pad.l - pad.r, ih = height - pad.t - pad.b;
  const allLabels = [...labels, ...fLabels];
  const max = scaleMax([...actual, ...fValues]);
  const n = allLabels.length || 1, stepX = iw / Math.max(1, n - 1);
  const x = (i) => pad.l + i * stepX;
  const y = (v) => pad.t + ih - ((Number(v) || 0) / max) * ih;
  const actualLine = `<polyline points="${actual.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2"/>`;
  const fSeq = [];
  if (actual.length) fSeq.push(`${x(actual.length - 1).toFixed(1)},${y(actual[actual.length - 1]).toFixed(1)}`);
  fValues.forEach((v, i) => fSeq.push(`${x(actual.length + i).toFixed(1)},${y(v).toFixed(1)}`));
  const fLine = `<polyline points="${fSeq.join(' ')}" fill="none" stroke="${fcolor}" stroke-width="2" stroke-dasharray="5 4"/>`;
  const dots = actual.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${color}"/>`).join('')
    + fValues.map((v, i) => `<circle cx="${x(actual.length + i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${fcolor}"/>`).join('');
  const xlabels = allLabels.map((lab, i) => `<text x="${x(i).toFixed(1)}" y="${height - 10}" font-size="9" text-anchor="middle" fill="#6b6b6b">${short(lab)}</text>`).join('');
  const axis = `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${width - pad.r}" y2="${pad.t + ih}" stroke="#e5e5e5"/><text x="2" y="${pad.t + 8}" font-size="9" fill="#6b6b6b">${max.toLocaleString()}</text>`;
  return `<svg viewBox="0 0 ${width} ${height}" class="chart" preserveAspectRatio="xMidYMid meet">${axis}${actualLine}${fLine}${dots}${xlabels}</svg>`;
}


// ===== src/ui/dashboards.js =====
// Dashboard rendering (DOM). Uses the analytics selectors + i18n. Renders the
// Storage, Accounting and Finance views (Finance includes SVG charts + forecast)
// and the Inventory audit module.







const money = (n) => '€' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = (n) => (Number(n) || 0).toLocaleString();
const STATUS_ORDER = ['Received', 'InTransitPending', 'PartiallyReceived', 'FullyMatched', 'Paid', 'Archived', 'UnderInvestigation', 'Resolved', 'Unresolvable'];
const label = (status) => t('status.' + status);

function tbl(headers, rows) {
  if (!rows.length) return `<p class="muted">${t('inv.none')}</p>`;
  const head = headers.map((h) => `<th>${h}</th>`).join('');
  const body = rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
  return `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

// ---- Storage ----
function storageHtml(pf, storageId) {
  const sv = storageView(pf, { storageId });
  const storages = [...new Set(pf.flatMap((v) => v.storages))].sort();
  const options = [`<option value="">${t('model.all')}</option>`]
    .concat(storages.map((s) => `<option value="${s}"${s === storageId ? ' selected' : ''}>${s}</option>`)).join('');
  return `
    <div class="dash-head"><h3>${t('storage.title')}</h3>
      <label class="filter">${t('storage.filter')} <select id="storage-filter">${options}</select></label></div>
    <h4>${t('storage.onway')} (${sv.onWay.length})</h4>
    ${tbl([t('th.invoice'), t('th.distributor'), t('th.invoiced'), t('th.received')], sv.onWay.map((v) => [v.invoiceNumber, v.distributorId, qty(v.invoicedQty), qty(v.received)]))}
    <h4>${t('storage.pending')} (${sv.pendingDelivery.length})</h4>
    ${tbl([t('th.invoice'), t('th.missing'), t('th.valueAtRisk'), t('th.storages')], sv.pendingDelivery.map((v) => [v.invoiceNumber, qty(v.missingQty), money(v.valueAtRisk), v.storages.join(', ')]))}
    <h4>${t('storage.aged')}</h4>
    ${tbl([t('th.invoice'), t('th.value'), t('th.ageDays')], sv.agedPending.map((a) => [a.invoiceNumber, money(a.value), a.ageDays]))}
    <h4>${t('storage.trend')}</h4>
    ${tbl([t('th.period'), t('th.amount')], sv.trendByPeriod.map((r) => [r.period, money(r.amount)]))}
  `;
}

// ---- Accounting ----
function closedAction(v) {
  if (v.status === 'FullyMatched') return `<button class="link act-pay" data-inv="${v.invoiceNumber}">${t('act.markPaid')}</button>`;
  if (v.status === 'Paid') return `<button class="link act-archive" data-inv="${v.invoiceNumber}">${t('act.archive')}</button>`;
  return '—';
}
function accountingHtml(pf) {
  const av = accountingView(pf);
  return `
    <h3>${t('acc.title')}</h3>
    <p class="muted">${t('acc.summary', { open: av.summary.openCount, closed: av.summary.closedCount, risk: money(av.summary.openValueAtRisk) })}</p>
    <h4>${t('acc.open')} (${av.open.length})</h4>
    ${tbl([t('th.invoice'), t('th.status'), t('th.missing'), t('th.valueAtRisk')], av.open.map((v) => [v.invoiceNumber, label(v.status), qty(v.missingQty), money(v.valueAtRisk)]))}
    <h4>${t('acc.closed')} (${av.closed.length})</h4>
    ${tbl([t('th.invoice'), t('th.status'), t('th.contraRecognized'), t('th.actions')], av.closed.map((v) => [v.invoiceNumber, label(v.status), money(v.contra.recognizedContra), closedAction(v)]))}
  `;
}

// ---- Finance (with charts + forecast) ----
function financeHtml(pf) {
  const fv = financeView(pf);
  const series = monthlySeries(pf);
  const fc = forecast(series.months, series.risk, 3);
  const bars = groupedBars(series.months, series.risk, series.debits, { labelA: t('fin.legendRisk'), labelB: t('fin.legendDebits') });
  const line = lineForecast(series.months, series.risk, fc.months, fc.values, {});
  const cards = `
    <div class="cards">
      <div class="card"><span class="k">${t('fin.invoices')}</span><span class="v">${fv.totals.invoices}</span></div>
      <div class="card"><span class="k">${t('fin.openVar')}</span><span class="v">${money(fv.totals.openValueAtRisk)}</span></div>
      <div class="card"><span class="k">${t('fin.pendingCredit')}</span><span class="v">${money(fv.totals.totalPendingCredit)}</span></div>
    </div>`;
  return `
    <h3>${t('fin.title')}</h3>
    ${cards}
    <h4>${t('fin.byStatus')}</h4>
    ${tbl([t('th.status'), t('th.count')], Object.entries(fv.byStatus).sort(([a], [b]) => STATUS_ORDER.indexOf(a) - STATUS_ORDER.indexOf(b)).map(([s, c]) => [label(s), c]))}
    <h4>${t('fin.storages')}</h4>
    ${tbl([t('th.storage'), t('th.openInvoices'), t('th.detail'), ''], fv.storagesWithIssues.map((s) => [s.storageId, s.count, s.openInvoices.join(', '), `<button class="link drill" data-storage="${s.storageId}">${t('fin.view')}</button>`]))}
    <h4>${t('fin.trendTitle')}</h4>
    <div class="chart-wrap">${bars}</div>
    <h4>${t('fin.forecastTitle')} <span class="legend-dot forecast"></span><span class="legend-label">${t('fin.legendForecast')}</span></h4>
    <div class="chart-wrap">${line}</div>
  `;
}

// ---- Inventory ----
const fmtDate = (dt) => String(dt).replace('T', ' ').slice(0, 16);
function detailCard(d) {
  const cs = d.contraStatus === 'Applied'
    ? `${t('inv.contra')} ${t('contra.applied')}: ${money(d.recognizedContra)}`
    : `${t('inv.contra')} ${t('contra.' + d.contraStatus.toLowerCase())} — ${t('contra.recognized')} ${money(d.recognizedContra)}${d.pendingCredit ? ` (${money(d.pendingCredit)} ${t('contra.pending')})` : ''}`;
  return `
    <div class="inv-card">
      <div class="inv-card-head"><strong>${d.invoiceNumber}</strong> <span class="tag">${label(d.status)}</span></div>
      <p class="muted">${d.distributorId} · Model ${d.model}</p>
      <ul class="kv">
        <li><span>${t('inv.delivered')}</span><strong>${qty(d.receivedQty)} ${t('inv.of')} ${qty(d.invoicedQty)}</strong></li>
        <li><span>${t('inv.missing')}</span><strong>${qty(d.missingQty)}</strong></li>
        <li><span>${t('inv.contra')}</span><strong>${cs}</strong></li>
      </ul>
      <h4>${t('inv.receipts')}</h4>
      ${tbl([t('th.storage'), t('th.qty'), t('th.receivedOn')], d.receiptsByStorage.map((s) => [s.storageId, qty(s.qty), s.receipts.map((r) => fmtDate(r.datetime)).join('<br>')]))}
      <h4>${t('inv.deliveryNotes')}</h4>
      ${tbl([t('th.note'), t('th.storage'), t('th.source')], d.deliveryNotes.map((n) => [n.deliveryNoteId, n.targetStorageId, n.sourceFile || '—']))}
      <h4>${t('inv.creditNotes')}</h4>
      ${tbl([t('th.note'), t('th.period'), t('th.amount'), t('th.status'), t('th.source')], d.creditNotes.map((n) => [n.creditNoteId, n.period, money(n.amount), n.status, n.sourceFile || '—']))}
      <h4>${t('inv.audit')}</h4>
      ${tbl([t('th.when'), t('th.actor'), t('th.change')], d.audit.map((a) => [fmtDate(a.timestamp), a.actor, a.change]))}
      <p class="muted">${t('inv.source')}: ${d.provenance.invoiceSourceFile || '—'}</p>
    </div>`;
}function renderInventory(container, invoices, ctx, handlers = {}) {
  const months = inventoryMonths(invoices, ctx.goodsReceipts);
  const month = handlers.month || months[months.length - 1] || '';
  const list = month ? monthlyInventory(invoices, ctx, { month }) : [];
  const monthOpts = months.map((m) => `<option value="${m}"${m === month ? ' selected' : ''}>${m}</option>`).join('');
  container.innerHTML = `
    <div class="dash-head"><h3>${t('inv.title')}</h3>
      <div class="inv-controls">
        <label class="filter">${t('inv.month')} <select id="inv-month">${monthOpts}</select></label>
        <button class="btn" id="inv-export">${t('inv.export')}</button>
      </div>
    </div>
    ${list.length ? list.map(detailCard).join('') : `<p class="muted">${t('inv.none')}</p>`}`;
  const sel = container.querySelector('#inv-month');
  if (sel && handlers.onMonth) sel.addEventListener('change', (e) => handlers.onMonth(e.target.value));
  const exp = container.querySelector('#inv-export');
  if (exp && handlers.onExport) exp.addEventListener('click', () => handlers.onExport(month, list));
}function renderDashboard(container, role, pf, handlers = {}) {
  if (role === 'storage') container.innerHTML = storageHtml(pf, handlers.storageId || null);
  else if (role === 'accounting') container.innerHTML = accountingHtml(pf);
  else if (role === 'finance') container.innerHTML = financeHtml(pf);
  else container.innerHTML = `<p class="muted">${t('inv.none')}</p>`;

  const filter = container.querySelector('#storage-filter');
  if (filter && handlers.onFilter) filter.addEventListener('change', (e) => handlers.onFilter(e.target.value || null));
  container.querySelectorAll('.drill').forEach((b) => { if (handlers.onDrill) b.addEventListener('click', () => handlers.onDrill(b.dataset.storage)); });
  container.querySelectorAll('.act-pay').forEach((b) => { if (handlers.onMarkPaid) b.addEventListener('click', () => handlers.onMarkPaid(b.dataset.inv)); });
  container.querySelectorAll('.act-archive').forEach((b) => { if (handlers.onArchive) b.addEventListener('click', () => handlers.onArchive(b.dataset.inv)); });
}


// ===== src/ui/tour.js =====
// Guided "walk me through" demo: an animated pointer glides to each target, a
// spotlight ring highlights it, a click pulse fires, and a caption explains the step.
// Steps: [{ selector, text, before? }]. `before` navigates (e.g., switch tab) first.function startTour(steps, labels = { next: 'Next', skip: 'Skip', done: 'Done' }) {
  let i = 0;
  const overlay = document.createElement('div'); overlay.className = 'tour-overlay';
  const ring = document.createElement('div'); ring.className = 'tour-ring';
  const pointer = document.createElement('div'); pointer.className = 'tour-pointer';
  const box = document.createElement('div'); box.className = 'tour-box';
  overlay.append(ring, pointer, box);
  document.body.appendChild(overlay);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const cleanup = () => overlay.remove();

  function positionTo(el) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2 + window.scrollX;
    const cy = r.top + r.height / 2 + window.scrollY;
    pointer.style.transform = `translate(${cx}px, ${cy}px)`;
    ring.style.left = `${r.left + window.scrollX}px`;
    ring.style.top = `${r.top + window.scrollY}px`;
    ring.style.width = `${r.width}px`;
    ring.style.height = `${r.height}px`;
    const boxTop = r.bottom + window.scrollY + 12;
    box.style.left = `${Math.max(12, Math.min(window.innerWidth - 340, r.left + window.scrollX))}px`;
    box.style.top = `${boxTop}px`;
    pointer.classList.remove('click'); void pointer.offsetWidth; pointer.classList.add('click');
  }

  async function show() {
    const step = steps[i];
    if (step.before) { try { step.before(); } catch { /* ignore */ } }
    await wait(140);
    const el = document.querySelector(step.selector) || document.body;
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch { /* ignore */ }
    await wait(220);
    positionTo(el);
    const last = i === steps.length - 1;
    box.innerHTML = `<p>${step.text}</p><div class="tour-actions">
      <button class="tour-skip">${labels.skip}</button>
      <button class="tour-next">${last ? labels.done : labels.next}</button></div>`;
    box.querySelector('.tour-next').onclick = () => { i += 1; if (i >= steps.length) cleanup(); else show(); };
    box.querySelector('.tour-skip').onclick = cleanup;
  }

  show();
  return { stop: cleanup };
}


// ===== src/app.js =====
// Perfumeries — Contra COGS Reconciliation
// Startup: scan -> ingest -> advance lifecycle -> build portfolio -> dashboards.
// Plus language (EN/SK), a model filter, an About view, and a guided tour.















const $ = (id) => document.getElementById(id);
const show = (el) => { if (el) el.hidden = false; };
const STATE_CLASS = { [ScanStatus.FOUND]: 'found', [ScanStatus.ERROR]: 'error', [ScanStatus.NO_UPDATES]: '', [ScanStatus.SCANNING]: '' };
const SCAN_LABEL = { database: 'Database', api: 'API', folder: 'Folder' };

const store = new StateStore(getLocalStorageBackend() || createMemoryBackend(), 'perfumeries');
const session = new Session(getSessionBackend() || createMemoryKV());
let ALL_PORTFOLIO = [];
let lastIngest = null;
let currentView = 'role'; // 'role' | 'inventory' | 'about'
let storageFilter = null;
let invMonth = null;

function downloadText(filename, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

const filteredPortfolio = () => {
  const f = session.getModelFilter();
  return f === 'all' ? ALL_PORTFOLIO : ALL_PORTFOLIO.filter((v) => v.model === f);
};

// ---- static chrome (i18n) ----
function applyI18n() {
  $('subtitle').textContent = t('app.subtitle');
  $('model-filter-label').textContent = t('model.title');
  $('tour-btn').textContent = t('btn.tour');
  $('scan-title').textContent = t('scan.title');
  const mf = $('model-filter');
  const cur = session.getModelFilter();
  mf.innerHTML = [['all', t('model.all')], ['A', t('model.aName')], ['B', t('model.bName')]]
    .map(([v, l]) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`).join('');
  document.querySelectorAll('#lang-switch .flag').forEach((b) => b.classList.toggle('active', b.dataset.lang === getLang()));
}

// ---- scan UI ----
function renderScanRows() {
  const scan = $('scan-status'); scan.innerHTML = '';
  const rows = {};
  for (const id of ['database', 'api', 'folder']) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="src">${SCAN_LABEL[id]}</span><span class="state">idle</span>`;
    scan.appendChild(li);
    rows[id] = li.querySelector('.state');
  }
  return rows;
}
function renderIngestSummary() {
  if (!lastIngest) return;
  const r = lastIngest;
  const storages = new Set(r.goodsReceipts.map((g) => g.storageId));
  const units = r.goodsReceipts.reduce((s, g) => s + g.qtyReceived, 0);
  $('ingest-summary').innerHTML = `<p class="summary-line">${t('ingest.line', {
    inv: r.invoices.length, dn: r.deliveryNotes.length, gr: r.goodsReceipts.length,
    units: units.toLocaleString(), st: storages.size, cn: r.creditNotes.length,
  })}</p>`;
}

// ---- role bar ----
function renderRoleBar() {
  const bar = $('role-bar'); show(bar);
  const role = session.getRole();
  const tabs = ROLES.map((r) => `<button class="role-tab${currentView === 'role' && role === r ? ' active' : ''}" data-role="${r}">${t('nav.' + r)}</button>`).join('');
  const inv = `<button class="role-tab${currentView === 'inventory' ? ' active' : ''}" data-inventory="1">${t('nav.inventory')}</button>`;
  const about = `<button class="role-tab${currentView === 'about' ? ' active' : ''}" data-about="1">${t('nav.about')}</button>`;
  bar.innerHTML = tabs + inv + about;
  bar.querySelectorAll('.role-tab').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.inventory) openInventory();
    else if (b.dataset.about) showAbout();
    else selectRole(b.dataset.role);
  }));
}

// ---- views ----
function rebuildPortfolio() {
  ALL_PORTFOLIO = buildPortfolio(store.all('invoices'), store.all('goodsReceipts'), store.all('deliveryNotes'), { asOf: new Date().toISOString() });
}
function renderDash() {
  const root = $('view-root'); show(root);
  renderDashboard(root, session.getRole(), filteredPortfolio(), {
    storageId: storageFilter,
    onFilter: (sid) => { storageFilter = sid; renderDash(); },
    onDrill: (sid) => { storageFilter = sid; selectRole('storage'); },
    onMarkPaid: (inv) => { transition(store, inv, InvoiceStatus.PAID, { actor: 'accounting' }); rebuildPortfolio(); renderDash(); },
    onArchive: (inv) => { const rec = archiveInvoice(store, inv, { actor: 'accounting' }); downloadText(`archive_${inv}.json`, exportArchive(rec)); rebuildPortfolio(); renderDash(); },
  });
}
function renderInventoryView() {
  const root = $('view-root'); show(root);
  const ctx = { goodsReceipts: store.all('goodsReceipts'), deliveryNotes: store.all('deliveryNotes'), creditNotes: store.all('creditNotes'), auditLog: store.auditLog() };
  renderInventory(root, store.all('invoices'), ctx, {
    month: invMonth,
    onMonth: (m) => { invMonth = m; renderInventoryView(); },
    onExport: (month, list) => downloadText(`inventory_${month || 'all'}.json`, exportInventory(list)),
  });
}
function renderAbout() {
  const root = $('view-root'); show(root);
  root.innerHTML = `<h3>${t('about.title')}</h3><p>${t('about.body')}</p>
    <h4>${t('about.defTitle')}</h4><p>${t('about.defBody')}</p>`;
}
function renderCurrentView() {
  if (currentView === 'inventory') renderInventoryView();
  else if (currentView === 'about') renderAbout();
  else renderDash();
}
function selectRole(role) { currentView = 'role'; session.setRole(role); renderRoleBar(); renderDash(); }
function openInventory() { currentView = 'inventory'; renderRoleBar(); renderInventoryView(); }
function showAbout() { currentView = 'about'; renderRoleBar(); renderAbout(); }

// ---- tour ----
function launchTour() {
  const steps = [
    { selector: '#model-filter', text: t('model.note') },
    { selector: '.role-tab[data-role="finance"]', text: t('fin.title') + ' — ' + t('fin.openVar') + ', ' + t('fin.pendingCredit') + '.', before: () => selectRole('finance') },
    { selector: '.cards', text: t('fin.openVar') + ' / ' + t('fin.pendingCredit') + '.' },
    { selector: '.chart-wrap', text: t('fin.trendTitle') + ' + ' + t('fin.forecastTitle') + '.' },
    { selector: '.role-tab[data-role="storage"]', text: t('storage.onway') + ' · ' + t('storage.pending') + ' · ' + t('storage.aged') + '.', before: () => selectRole('storage') },
    { selector: '.role-tab[data-inventory]', text: t('inv.title'), before: () => openInventory() },
    { selector: '.role-tab[data-about]', text: t('about.defTitle'), before: () => showAbout() },
  ];
  startTour(steps, { next: t('tour.next'), skip: t('tour.skip'), done: t('tour.done') });
}

// ---- language ----
function switchLang(l) {
  session.setLang(l); setLang(l);
  applyI18n(); renderIngestSummary(); renderRoleBar(); renderCurrentView();
}

// ---- boot ----
async function runScan() {
  show($('scan-panel'));
  const rows = renderScanRows();
  const onStatus = (id, state, message) => {
    const el = rows[id]; if (!el) return;
    el.textContent = state === ScanStatus.SCANNING ? (message || 'scanning…') : (message || state);
    el.className = `state ${STATE_CLASS[state] || ''}`.trim();
  };
  try {
    const { ingest, portfolio } = await runPipeline(store, defaultSources(), { onStatus });
    lastIngest = ingest; ALL_PORTFOLIO = portfolio;
    renderIngestSummary();
    renderRoleBar();
    selectRole(session.isRoleSelected() ? session.getRole() : 'finance');
  } catch (err) {
    const root = $('view-root'); show(root);
    root.innerHTML = `<h2>Startup error</h2><p class="err">${err.message}</p>`;
  }
}

function boot() {
  setLang(session.getLang());
  if ($('build-status')) $('build-status').textContent = `v${VERSION}`;
  applyI18n();
  $('model-filter').addEventListener('change', (e) => { session.setModelFilter(e.target.value); renderCurrentView(); });
  $('tour-btn').addEventListener('click', launchTour);
  document.querySelectorAll('#lang-switch .flag').forEach((b) => b.addEventListener('click', () => switchLang(b.dataset.lang)));
  runScan();
}

document.addEventListener('DOMContentLoaded', boot);

</script>
