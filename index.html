<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VIR_Tier — Offline Demo</title>
<style>:root {
  --page: #F5F5F5;        /* warm light gray page background */
  --card: #FFFFFF;        /* white cards/content */
  --nav: #1A1A1A;         /* charcoal — ONLY nav/header */
  --ink: #1A1A1A;         /* primary text */
  --muted: #6B6B6B;       /* secondary text */
  --line: #E5E5E5;        /* borders/dividers */
  --accent: #00B67A;      /* vibrant green — buttons, highlights */
  --accent-ink: #04150e;
  --accent-soft: #E6F7F0; /* green tint */
  --info: #2f6fed;
  --warn: #B7791F;
  --warn-soft: #FBF3E2;
  --danger: #E74C3C;
  --danger-soft: #FBEAE8;
  --gold: #C77800;        /* leakage/attention (muted amber, not neon) */
  --radius: 12px;
  --shadow: 0 2px 10px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 15px/1.55 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--page);
  color: var(--ink);
}
a { color: var(--info); }
.hidden { display: none !important; }

/* top bar (the only dark surface) */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 22px; background: var(--nav); color: #fff;
  position: sticky; top: 0; z-index: 20;
}
.brand { font-weight: 700; letter-spacing: .3px; font-size: 17px; }
.brand .tier { color: var(--accent); }
.topbar .small { color: #c8c8c8; }
.spacer { flex: 1; }
.langs { display: flex; gap: 6px; }
.langs button {
  background: transparent; color: #ddd; border: 1px solid #3a3a3a;
  border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit;
}
.langs button.active { border-color: var(--accent); color: #fff; background: rgba(0,182,122,.15); }

.btn, .rolebtn {
  background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; font: inherit;
}
.btn:hover { border-color: #cfcfcf; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.03); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 26px 22px 70px; }
h2 { font-size: 22px; margin: 0 0 6px; }
h3 { font-size: 16px; margin: 22px 0 12px; }
.lead { color: var(--muted); margin: 0 0 18px; }

/* boot */
.boot { max-width: 640px; margin: 10vh auto; padding: 30px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); }
.boot h1 { margin: 0 0 4px; font-size: 24px; }
.boot .tagline { color: var(--muted); margin-bottom: 22px; }
.scanline { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.scanline .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
.scanline.scanning .dot { background: var(--info); animation: pulse 1s infinite; }
.scanline.done .dot { background: var(--accent); }
.scanline.found .dot { background: var(--gold); }
.scanline .name { width: 300px; font-weight: 600; }
.scanline .msg { color: var(--muted); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* role cards */
.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
.rolecard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; cursor: pointer; transition: .15s; box-shadow: var(--shadow); }
.rolecard:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.rolecard h3 { margin: 0 0 6px; }
.rolecard p { color: var(--muted); margin: 0 0 16px; min-height: 42px; }

/* controls bar */
.controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.field select, .field input { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; }
.recomputed { color: var(--accent); font-size: 13px; font-weight: 600; }

/* stage steps */
.stages { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.stage { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 13px; }
.stage .num { width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: var(--ink); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.stage.active { border-color: var(--accent); color: var(--ink); }
.stage.active .num { background: var(--accent); color: var(--accent-ink); }

/* cards + kpi */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 10px; font-size: 15px; }
.kpi { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.kpi .box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; min-width: 190px; box-shadow: var(--shadow); }
.kpi .box .n { font-size: 26px; font-weight: 700; color: var(--accent); }
.kpi .box .n.loss { color: var(--gold); }
.kpi .box .l { color: var(--muted); font-size: 13px; }

/* before/after */
.ba { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
.ba .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.ba .panel.before { border-left: 4px solid var(--gold); }
.ba .panel.after { border-left: 4px solid var(--accent); }
.ba .arrow { display: grid; place-items: center; color: var(--muted); font-size: 26px; }
.ba .panel .h { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
.ba .panel .big { font-size: 22px; font-weight: 700; }
.loss-banner { background: var(--warn-soft); border: 1px solid #EAD9B0; color: #7a5a12; border-radius: var(--radius); padding: 12px 16px; margin: 14px 0; }
.loss-banner strong { color: var(--gold); }

table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--card); }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
tbody tr:hover td { background: #fafafa; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }

.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: #fafafa; }
.badge.pending { color: var(--warn); border-color: #EAD9B0; background: var(--warn-soft); }
.badge.approved { color: #0a7a53; border-color: #B7E6D3; background: var(--accent-soft); }
.badge.rejected { color: var(--danger); border-color: #F3C6C1; background: var(--danger-soft); }
.badge.exported, .badge.injected { color: var(--info); border-color: #C6D6F7; background: #EEF3FE; }
.badge.driver { color: var(--gold); border-color: #EAD9B0; background: var(--warn-soft); }
.badge.high { color: var(--danger); border-color: #F3C6C1; background: var(--danger-soft); }
.badge.medium { color: var(--warn); border-color: #EAD9B0; background: var(--warn-soft); }
.badge.low { color: var(--muted); }
.badge.illustrative { color: var(--info); border-color: #C6D6F7; background: #EEF3FE; }

/* ML discovery */
.ml-finding { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ml-finding:last-child { border-bottom: 0; }
.ml-finding .meta { flex: 1; }
.ml-finding .title { font-weight: 600; }
.ml-finding .reasons { color: var(--muted); font-size: 13px; margin-top: 3px; }
.score { display: inline-flex; align-items: center; gap: 8px; }
.scorebar { width: 90px; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.scorebar > i { display: block; height: 100%; background: var(--accent); }
.insight { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: #fafafa; margin-bottom: 10px; }
.insight .t { font-weight: 600; }
.insight .d { color: var(--muted); font-size: 13px; margin-top: 3px; }

/* tooltip */
.hint { border-bottom: 1px dotted var(--muted); cursor: help; }
.tip { position: fixed; z-index: 100; max-width: 320px; background: #fff; color: var(--ink); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow-lg); font-size: 13px; }
.tip .reg { color: var(--muted); margin-top: 6px; font-size: 12px; }
.tip .src { color: var(--accent); margin-top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(20,20,20,.4); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 60; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); max-width: 780px; width: 100%; padding: 24px; box-shadow: var(--shadow-lg); max-height: 84vh; overflow: auto; }
.modal h2 { margin: 0 0 6px; }
.modal .sub { color: var(--muted); margin-bottom: 16px; }
.section { border-top: 1px solid var(--line); padding: 14px 0; }
.section h4 { margin: 0 0 8px; color: #0a7a53; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 5px 12px; font-size: 14px; }
.kv .k { color: var(--muted); }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

/* charts */
/* charts — professional finance style */
.chart { width: 100%; height: auto; display: block; }
.bar { fill: #0072B2; }
.bar.accent { fill: var(--accent); }
.bar.risk { fill: var(--gold); }
.c-grid { stroke: #EEF0F2; stroke-width: 1; }
.c-axis { stroke: #D8DCE0; stroke-width: 1; }
.c-yaxis, .c-xaxis { fill: var(--muted); font-size: 10.5px; }
.c-val { fill: #3a3a3a; font-size: 10.5px; font-weight: 600; }
.chart-empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

.small { color: var(--muted); font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.flash { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--nav); color: #fff; padding: 10px 18px; border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 120; }

/* ============ left-nav workspace shell ============ */
.app-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.sidebar { background: #fff; border-right: 1px solid var(--line); padding: 18px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar .logo { font-weight: 800; font-size: 19px; padding: 4px 22px 18px; letter-spacing: .3px; }
.sidebar .logo .tier { color: var(--accent); }
.nav-group { padding: 10px 12px 4px; }
.nav-group .g-label { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); padding: 6px 10px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; cursor: pointer; color: var(--ink); font-size: 14px; }
.nav-item:hover { background: #f3f3f3; }
.nav-item.active { background: var(--accent-soft); color: #0a7a53; font-weight: 600; }
.nav-item .n { width: 22px; height: 22px; border-radius: 6px; background: #eee; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
.nav-item.active .n { background: var(--accent); color: var(--accent-ink); }
.nav-sub { margin: 2px 0 6px 30px; border-left: 1px solid var(--line); }
.nav-subitem { padding: 7px 12px; font-size: 13px; color: var(--muted); cursor: pointer; border-radius: 7px; }
.nav-subitem:hover { background: #f3f3f3; color: var(--ink); }
.nav-spacer { flex: 1; }
.sidebar-foot { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.sidebar .langs { padding: 10px 18px 0; }
.sidebar .langs button { background: #fff; color: var(--muted); border: 1px solid var(--line); }
.sidebar .langs button.active { border-color: var(--accent); color: #0a7a53; background: var(--accent-soft); }

.work { padding: 26px 34px 70px; max-width: 1400px; }
.work .page-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
.work .page-head h2 { margin: 0; }
.work .role-pill { margin-left: auto; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 30px 0; }
.section-gap { height: 22px; }

/* file browser */
.filecats { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.filecat { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: #fff; font-size: 13px; }
.filecat.active { border-color: var(--accent); background: var(--accent-soft); color: #0a7a53; font-weight: 600; }
.filecat .cnt { color: var(--muted); margin-left: 6px; }
.doclist { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.doccard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.doccard .id { font-weight: 700; font-family: ui-monospace, monospace; }
.doccard .meta { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
.doccard .row { display: flex; gap: 8px; }

/* document modal body */
.doc { font-size: 14px; }
.doc .doc-title { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
.doc .doc-sub { color: var(--muted); margin-bottom: 14px; }
.doc .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; margin-bottom: 12px; }
.doc .grid2 .k { color: var(--muted); }
.doc h4 { margin: 14px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #0a7a53; }

/* drill-down */
.drill { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); margin-bottom: 12px; }
.drill > summary { cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px; list-style: none; }
.drill > summary::-webkit-details-marker { display: none; }
.drill > summary .chev { transition: transform .15s; color: var(--muted); }
.drill[open] > summary .chev { transform: rotate(90deg); }
.drill > summary .big { font-size: 20px; font-weight: 700; }
.drill > summary .lbl { color: var(--muted); }
.drill .body { padding: 0 16px 14px; }
.expandable { border-bottom: 1px dashed var(--accent); cursor: pointer; }

/* svg ml flow */
.mlflow { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.mlnode { cursor: pointer; }
.mlnode rect { fill: #fff; stroke: var(--line); stroke-width: 1.5; }
.mlnode.sel rect, .mlnode:hover rect { stroke: var(--accent); stroke-width: 2.5; }
.mlnode .nt { font-weight: 700; font-size: 13px; fill: var(--ink); }
.mlnode .ns { font-size: 11px; fill: var(--muted); }
.mledge { stroke: #c9c9c9; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.mlpanel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-top: 14px; }
.mlpanel h4 { margin: 0 0 8px; color: #0a7a53; }
.formula { font-family: ui-monospace, monospace; background: #f6f6f6; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; overflow-x: auto; }

/* ============ realistic document rendering (invoice / DN / GRN / OSD) ============ */
.invoice-doc { background: #fff; color: #1a1a1a; padding: 4px 2px; font-size: 0.9rem; }
.invoice-doc .doc-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
.invoice-doc .doc-brand { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.03em; }
.invoice-doc .doc-title { font-size: 0.95rem; font-weight: 700; color: var(--muted); text-align: right; }
.doc-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.doc-party-t { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.doc-ids { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; font-size: 0.76rem; color: var(--muted); }
.doc-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px; background: #f7f7f7; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.doc-meta div { display: flex; flex-direction: column; }
.doc-meta span { font-size: 0.7rem; color: var(--muted); }
.doc-lines { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.doc-lines th, .doc-lines td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; }
.doc-lines th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); background: #fafafa; }
.doc-lines .num { text-align: right; white-space: nowrap; }
.doc-sub-sku { font-size: 0.72rem; color: var(--muted); }
.doc-totals { margin-left: auto; width: 300px; display: grid; gap: 4px; margin-bottom: 12px; }
.doc-totals div { display: flex; justify-content: space-between; padding: 3px 0; }
.doc-totals .grand { border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 8px; font-size: 1.05rem; }
.doc-pay { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.82rem; border-top: 1px solid var(--line); padding-top: 10px; }
.doc-pay span { color: var(--muted); }
.doc-reg { font-size: 0.72rem; color: var(--muted); margin: 8px 0 2px; }
.doc-einv { font-size: 0.8rem; color: #0a7a53; background: var(--accent-soft); border: 1px solid #b7e6d3; border-radius: 8px; padding: 8px 10px; }
.doc-split { margin-top: 20px; border-top: 3px dashed var(--line); padding-top: 14px; }
.doc-split-h { margin: 0 0 6px; font-size: 0.9rem; }
/* the doc modal is a bit wider for realistic layout */
.modal.docwide { max-width: 860px; }

/* ============ agreement sheet (eye-catching) ============ */
.agr-ribbon { display: inline-block; float: right; margin: -2px 0 6px; padding: 4px 14px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.agr-ribbon.ok { background: var(--accent-soft); color: #0a7a53; border: 1px solid #b7e6d3; }
.agr-ribbon.warn { background: var(--warn-soft); color: #7a5a12; border: 1px solid #EAD9B0; }
.metric-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 4px 0 14px; }
.metric-cards .mc { background: linear-gradient(180deg,#ffffff,#f7fbf9); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.metric-cards .mc.loss { background: linear-gradient(180deg,#fff,#fbf3e2); border-color: #EAD9B0; }
.metric-cards .mc-n { font-size: 1.25rem; font-weight: 800; color: #0a7a53; }
.metric-cards .mc.loss .mc-n { color: var(--gold); }
.metric-cards .mc-l { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.tier-progress { margin: 8px 0 16px; }
.tier-progress .tp-head { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
.tier-progress .tp-bar { height: 12px; background: #eef0f2; border-radius: 999px; overflow: hidden; }
.tier-progress .tp-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #29c48c); }
.tier-row.achieved td { background: var(--accent-soft); font-weight: 600; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.68rem; border: 1px solid var(--line); color: var(--muted); background: #fafafa; }
.pill.ok { color: #0a7a53; border-color: #b7e6d3; background: var(--accent-soft); }

/* ============ ML discovery — legend + expandable findings ============ */
.ml-legend { display: grid; gap: 6px; background: #f4f8ff; border: 1px solid #d5e2fb; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.86rem; color: #234; line-height: 1.5; }
.ml-legend strong { color: var(--ink); }

.ml-cols { grid-template-columns: 2.6fr 0.8fr 1.1fr 1.1fr 1.1fr 0.7fr; gap: 10px; }
.ml-findhead { display: grid; padding: 8px 16px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.ml-findhead .num { text-align: right; }
.mlfind { border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-bottom: 8px; }
.mlfind > summary { cursor: pointer; list-style: none; padding: 12px 16px; display: grid; align-items: center; }

    // ---- About & Manual ----
    tocTitle: 'Contents',
    'ab.intro': 'How VIR_Tier collects your documents, reconstructs the volume you truly qualified for, and turns the difference into a recoverable Contra-COGS True-Up. Read top to bottom, or jump to a section.',
    'ab.tocTitle': 'Contents',
    'ab.h.overview': 'What it does', 'ab.p.overview': 'VIR_Tier recovers under-claimed volume rebates (Contra-COGS). Suppliers pay a rebate that grows with purchase volume, but the internal CCOGS engine often counts less volume than you actually bought — goods delivered but not scanned at the main warehouse, contract SKUs never configured, pallets found after a short-scan, or pan-EU volumes measured country-by-country instead of combined. Each miss keeps you in a lower rebate tier. VIR_Tier reconstructs the true qualifying volume, works out the tier you should have reached, and prepares a True-Up you can claim back from the supplier.',
    'ab.h.data': 'How it gets the data', 'ab.p.data': 'On start-up the tool connects to your systems and collects the latest documents from three kinds of source, then consolidates everything per supplier agreement:',
    'ab.src.db': '<strong>Rebate agreement database</strong> — the contracts: SKU sets, rebate tier ladders, validity windows and measurement rules.',
    'ab.src.api': '<strong>Supplier & marketplace APIs</strong> — invoices and the CCOGS engine output (what was already claimed).',
    'ab.src.wh': '<strong>Warehouse feeds</strong> — delivery notes and goods receipts (GRN/RECADV) per warehouse, including which node scanned the goods.',
    'ab.h.stages': 'The three stages', 'ab.p.stages': 'The sidebar walks left to right through the pipeline:',
    'ab.stg.inputs': '<strong>Inputs & Collection</strong> — browse every ingested document by type, and open the Summary page for the collection & matching result.',
    'ab.stg.ml': '<strong>ML Discovery</strong> — the ranked list of recoverable opportunities, each fully explained.',
    'ab.stg.overview': '<strong>Finance Overview</strong> — the portfolio savings & earnings picture, the process journey and recovery by supplier, scope, period and contract duration.',
    'ab.h.inputs': 'Inputs, documents & the summary', 'ab.p.inputs': 'Every input is a real, viewable document. Click any card to open, print or download it:',
    'ab.doc.invoice': '<strong>Invoice</strong> — supplier invoice with a line-item distribution by storage.',
    'ab.doc.dn': '<strong>Delivery note</strong> — an invoice-style header (dispatched-from store → ship-to) plus the process journey at the bottom.',
    'ab.doc.grn': '<strong>Goods receipt (GRN)</strong> — ordered vs received vs accepted per warehouse, with its own journey.',
    'ab.doc.event': '<strong>Exception / OSD notice</strong> — a missing-data event (overage, shortage, backorder, etc.).',
    'ab.doc.engine': '<strong>CCOGS Engine summary</strong> — the “before”: what the engine counted and claimed.',
    'ab.doc.agreement': '<strong>Agreement</strong> — a legal-style rebate contract (parties, term, SKU schedule, tier ladder, settlement).',
    'ab.p.summary': 'The Summary page shows the ingested volumes, confirms collection and matching are complete, and hands you off to ML Discovery.',
    'ab.h.ml': 'ML Discovery — how the mapping works', 'ab.p.ml': 'ML Discovery is where the tool ties everything together. It does not invent numbers: every figure is reconstructed from the collected documents and every ranking is reproducible. The name “ML” refers to a transparent, explainable heuristic — not a black box. Here is the full end-to-end process.',
    'ab.ml.pipelineH': 'End-to-end mapping process',
    'ab.ml.step1': '<strong>Consolidate per agreement.</strong> Invoices, delivery notes, goods receipts, missing-data events and the CCOGS engine output are grouped under the supplier agreement they belong to, and bucketed into the correct control period (the receipt / transfer-of-control date, not the invoice date).',
    'ab.ml.step2': '<strong>Establish the base volume.</strong> The tool sums the volume the engine actually saw — the goods receipts already counted — in the agreement’s basis (units, weight or value).',
    'ab.ml.step3': '<strong>Detect leakage drivers.</strong> It scans the documents for the concrete situations where real, delivered volume was dropped: a main-warehouse scan skipped after a reroute, a contract SKU never configured in the engine, a pallet located after a short-scan, an in-window order delivered after the window closed, returns wrongly removed, retained overage, and more.',
    'ab.ml.step4': '<strong>Reconstruct the true qualifying volume.</strong> Each driver restores its units to the base, respecting eligibility (order/invoice date inside the contract window — delivery may be later) and de-duplication (a physical receipt is never counted twice). Pan-EU agreements combine SK/PL/CZ into one qualifying volume.',
    'ab.ml.step5': '<strong>Re-resolve the tier.</strong> The reconstructed volume is run through the agreement’s rebate ladder to find the tier — and therefore the rate — you actually reached, versus the lower tier the engine settled on.',
    'ab.ml.step6': '<strong>Compute the True-Up.</strong> Entitled CCOGS (reconstructed volume × achieved rate) minus the engine’s original claim = the recoverable True-Up. It is itemized: a tier-uplift line on the base volume plus one line per driver correction, summing to the headline cumulative delta (e.g. 1% → 2%).',
    'ab.ml.step7': '<strong>Score & rank.</strong> Each opportunity gets a transparent priority score so you tackle the most valuable, most certain ones first. Nothing is hidden — expand any finding to see exactly where every unit and euro came from.',
    'ab.ml.driversH': 'Leakage drivers it recognises', 'ab.ml.driversP': 'Each driver is a real, explainable reason delivered volume went uncounted:',
    'ab.ml.dReroute': '<strong>Rerouted — scan skipped</strong>: goods sent to a town warehouse without the main-warehouse unload scan; delivered, but read as non-delivery.',
    'ab.ml.dForgotten': '<strong>SKU not in system</strong>: a contract SKU that was never configured in the internal engine, so its volume was never counted.',
    'ab.ml.dExpired': '<strong>Ordered in-window, delivered late</strong>: the order/invoice date is inside the contract window but unloading happened after it closed — still eligible.',
    'ab.ml.dFound': '<strong>Found-later pallet</strong>: a short-scanned pallet located afterwards on the same in-window order.',
    'ab.ml.dReturn': '<strong>Return rejection</strong>: a rejected return wrongly removed from qualifying volume, then reinstated.',
    'ab.ml.dOverage': '<strong>Overage</strong>: extra units delivered above the ordered quantity and retained.',
    'ab.ml.dBackorder': '<strong>Backordering</strong>: backordered units delivered within the qualifying control period.',
    'ab.ml.dLate': '<strong>Late shipment</strong>: a late shipment that still lands inside the control period.',
    'ab.ml.dPanEu': '<strong>Pan-EU split</strong>: SK/PL/CZ volumes measured separately when the contract allows combining them into one higher-tier volume.',
    'ab.ml.scoreH': 'How findings are scored', 'ab.ml.scoreP': 'The ranking is a transparent weighted composite of four signals — reproducible from the data, no black box:',
    'ab.ml.sMagnitude': '<strong>magnitude</strong> — the recoverable amount relative to peers (z-score, normalised 0–1).',
    'ab.ml.sLift': '<strong>lift</strong> — how far entitled exceeds claimed (how badly the engine under-claimed).',
    'ab.ml.sDriver': '<strong>driverPressure</strong> — how many distinct leakage drivers touch the agreement.',
    'ab.ml.sTier': '<strong>tierProximity</strong> — how close the reconstructed volume sits to the next tier.',
    'ab.ml.outputH': 'What each finding gives you', 'ab.ml.outputP': 'Every finding expands into a plain-language story, a “where the volume came from” table (base + per-driver units), a before→after money table, a per-country roll-up, and the goods receipts behind the base — then a Review Document action that can generate a supplier-facing Contra-COGS invoice, export the claim as CSV/XML, or reject and archive the suggestion.',
    'ab.h.trueup': 'The True-Up', 'ab.p.trueup': 'The recovery output is a CCOGS True-Up: a debit note issued by you to the supplier for the rebate difference. It itemizes each cause but headlines the cumulative tier movement. From the Review Document you can generate a professional, supplier-facing Contra-COGS invoice (parties reversed per settlement rules, descriptions written for the supplier), export it as CSV or XML for billing, or reject-and-archive it so it leaves the suggestion list.',
    'ab.h.finance': 'Finance Overview', 'ab.p.finance': 'The Finance Overview frames the whole portfolio as savings & earnings: engine-claimed (before) → tool-entitled (after), the total recoverable True-Up and uplift, a process journey showing where goods get stuck and the issue types at each stage, recovery broken down by supplier, scope, period and contract duration (with a fail rate per duration), and a top-opportunities table grouped by supplier and contract validity.',
    'ab.h.roles': 'Roles', 'ab.p.roles': 'Everyone can browse. Write actions — approve, export and inject into billing — are gated to the Finance Approver role, selected in the sidebar. Analyst and Finance Overview roles are read-only.',
    'ab.h.nav': 'Getting around', 'ab.p.nav': 'Use the sidebar to move between stages; in Inputs, use the sub-tabs (each shows a live document count) or the Summary tiles. Switch language any time with the flags — the whole interface follows. Open this manual from the ⓘ About button below the language switch.',
    'ab.h.glossary': 'Glossary',
    'ab.g.ccogs': 'Contra Cost of Goods Sold — a supplier rebate that reduces your effective cost of goods, earned on purchase volume.',
    'ab.g.trueupT': 'True-Up', 'ab.g.trueup': 'The recoverable difference between what you were entitled to and what the engine actually claimed, issued as a debit note.',
    'ab.g.vir': 'Volume Incentive Rebate — the tiered rebate structure whose rate rises with qualifying volume.',
    'ab.g.tierT': 'Rebate tier', 'ab.g.tier': 'A volume threshold that unlocks a higher rebate rate; crossing it can reprice the whole qualifying volume (retrospective) or only the units in the band (sliding).',
    'ab.g.grn': 'Goods Received Note — the warehouse record of what was actually received against an order.',
    'ab.g.panEuT': 'Pan-EU', 'ab.g.panEu': 'Aggregating qualifying volume across SK, PL and CZ into one combined figure, per contract, to reach a higher tier.',
    'ab.g.windowT': 'Contract window', 'ab.g.window': 'The validity period of an agreement (monthly, quarterly, half-year or yearly); eligibility follows the order/invoice date inside it.',
    'ab.h.privacy': 'Data, privacy & disclaimer', 'ab.p.privacy': 'All data in this demo is fictional and generated locally. Nothing is uploaded to a server; documents and results live in your browser session only. This tool is a demonstration and does not constitute financial, tax or legal advice.',

    // ---- About & Manual ----
    tocTitle: 'Obsah',
    'ab.intro': 'Ako VIR_Tier zbiera vaše dokumenty, rekonštruuje objem, na ktorý ste mali skutočne nárok, a premieňa rozdiel na získateľný Contra-COGS True-Up. Čítajte zhora nadol alebo preskočte na sekciu.',
    'ab.tocTitle': 'Obsah',
    'ab.h.overview': 'Čo robí', 'ab.p.overview': 'VIR_Tier získava späť nedostatočne nárokované objemové zľavy (Contra-COGS). Dodávatelia vyplácajú zľavu, ktorá rastie s objemom nákupu, ale interný CCOGS engine často počíta menší objem, než ste skutočne nakúpili — tovar dodaný, ale nenaskenovaný v hlavnom sklade, zmluvné SKU nikdy nenakonfigurované, palety nájdené po nedoskenovaní alebo pan-EU objemy merané po krajinách namiesto spoločne. Každé opomenutie vás udrží v nižšej úrovni zľavy. VIR_Tier rekonštruuje skutočný kvalifikačný objem, určí úroveň, ktorú ste mali dosiahnuť, a pripraví True-Up, ktorý si môžete nárokovať späť od dodávateľa.',
    'ab.h.data': 'Ako získava dáta', 'ab.p.data': 'Pri spustení sa nástroj pripojí k vašim systémom a zozbiera najnovšie dokumenty z troch druhov zdrojov, potom všetko konsoliduje podľa zmluvy s dodávateľom:',
    'ab.src.db': '<strong>Databáza zľavových zmlúv</strong> — zmluvy: sady SKU, rebríčky úrovní zľav, obdobia platnosti a pravidlá merania.',
    'ab.src.api': '<strong>API dodávateľov a trhovísk</strong> — faktúry a výstup CCOGS enginu (čo už bolo nárokované).',
    'ab.src.wh': '<strong>Skladové feedy</strong> — dodacie listy a príjemky (GRN/RECADV) podľa skladu vrátane toho, ktorý uzol tovar naskenoval.',
    'ab.h.stages': 'Tri fázy', 'ab.p.stages': 'Bočný panel vedie zľava doprava cez pipeline:',
    'ab.stg.inputs': '<strong>Vstupy a zber</strong> — prehliadajte každý načítaný dokument podľa typu a otvorte stránku Súhrn s výsledkom zberu a párovania.',
    'ab.stg.ml': '<strong>ML Discovery</strong> — zoradený zoznam získateľných príležitostí, každá plne vysvetlená.',
    'ab.stg.overview': '<strong>Finančný prehľad</strong> — obraz úspor a výnosov portfólia, procesná cesta a obnova podľa dodávateľa, rozsahu, obdobia a dĺžky zmluvy.',
    'ab.h.inputs': 'Vstupy, dokumenty a súhrn', 'ab.p.inputs': 'Každý vstup je skutočný, zobraziteľný dokument. Kliknite na ľubovoľnú kartu a otvorte, vytlačte alebo stiahnite ho:',
    'ab.doc.invoice': '<strong>Faktúra</strong> — faktúra dodávateľa s rozpisom položiek podľa skladu.',
    'ab.doc.dn': '<strong>Dodací list</strong> — hlavička v štýle faktúry (expedované z predajne → doručiť do) plus procesná cesta na spodku.',
    'ab.doc.grn': '<strong>Príjemka (GRN)</strong> — objednané vs prijaté vs prevzaté podľa skladu s vlastnou cestou.',
    'ab.doc.event': '<strong>Výnimka / OSD oznámenie</strong> — udalosť chýbajúcich dát (nadmerné množstvo, manko, backorder atď.).',
    'ab.doc.engine': '<strong>Súhrn CCOGS enginu</strong> — stav „pred“: čo engine spočítal a nárokoval.',
    'ab.doc.agreement': '<strong>Zmluva</strong> — zľavová zmluva právneho štýlu (strany, doba, rozvrh SKU, rebríček úrovní, vyrovnanie).',
    'ab.p.summary': 'Stránka Súhrn zobrazuje načítané objemy, potvrdzuje, že zber a párovanie sú dokončené, a odovzdá vás do ML Discovery.',
    'ab.h.ml': 'ML Discovery — ako funguje mapovanie', 'ab.p.ml': 'ML Discovery je miesto, kde nástroj spája všetko dohromady. Nevymýšľa čísla: každá hodnota je rekonštruovaná zo zozbieraných dokumentov a každé zoradenie je reprodukovateľné. Názov „ML“ odkazuje na transparentnú, vysvetliteľnú heuristiku — nie na čiernu skrinku. Tu je celý proces od začiatku do konca.',
    'ab.ml.pipelineH': 'Proces mapovania od začiatku do konca',
    'ab.ml.step1': '<strong>Konsolidácia podľa zmluvy.</strong> Faktúry, dodacie listy, príjemky, udalosti chýbajúcich dát a výstup CCOGS enginu sa zoskupia pod zmluvu dodávateľa, ku ktorej patria, a zaradia do správneho kontrolného obdobia (dátum príjmu / prevodu kontroly, nie dátum faktúry).',
    'ab.ml.step2': '<strong>Stanovenie základného objemu.</strong> Nástroj sčíta objem, ktorý engine skutočne videl — už započítané príjemky — v základe zmluvy (jednotky, hmotnosť alebo hodnota).',
    'ab.ml.step3': '<strong>Detekcia ovládačov úniku.</strong> Prehľadá dokumenty pre konkrétne situácie, keď bol skutočný, dodaný objem vynechaný: preskočený sken v hlavnom sklade po presmerovaní, zmluvné SKU nikdy nenakonfigurované v engine, paleta nájdená po nedoskenovaní, objednávka v okne dodaná po jeho uzavretí, nesprávne odstránené vrátenia, zadržané nadmnožstvo a ďalšie.',
    'ab.ml.step4': '<strong>Rekonštrukcia skutočného kvalifikačného objemu.</strong> Každý ovládač obnoví svoje jednotky do základu, rešpektujúc oprávnenosť (dátum objednávky/faktúry vnútri zmluvného okna — dodanie môže byť neskôr) a de-duplikáciu (fyzická príjemka sa nikdy nepočíta dvakrát). Pan-EU zmluvy kombinujú SK/PL/CZ do jedného kvalifikačného objemu.',
    'ab.ml.step5': '<strong>Opätovné určenie úrovne.</strong> Rekonštruovaný objem prejde cez zľavový rebríček zmluvy, aby sa našla úroveň — a teda sadzba — ktorú ste skutočne dosiahli, oproti nižšej úrovni, na ktorej engine skončil.',
    'ab.ml.step6': '<strong>Výpočet True-Up.</strong> Nárokovaný CCOGS (rekonštruovaný objem × dosiahnutá sadzba) mínus pôvodný nárok enginu = získateľný True-Up. Je rozpísaný: riadok navýšenia úrovne na základnom objeme plus jeden riadok na každú korekciu ovládača, spolu dávajúc hlavný kumulatívny rozdiel (napr. 1 % → 2 %).',
    'ab.ml.step7': '<strong>Skórovanie a zoradenie.</strong> Každá príležitosť dostane transparentné prioritné skóre, aby ste sa najprv venovali tým najhodnotnejším a najistejším. Nič nie je skryté — rozbaľte akékoľvek zistenie a uvidíte presne, odkiaľ pochádza každá jednotka a euro.',
    'ab.ml.driversH': 'Ovládače úniku, ktoré rozpozná', 'ab.ml.driversP': 'Každý ovládač je skutočný, vysvetliteľný dôvod, prečo dodaný objem zostal nezapočítaný:',
    'ab.ml.dReroute': '<strong>Presmerované — sken preskočený</strong>: tovar odoslaný do mestského skladu bez skenu pri vyložení v hlavnom sklade; dodaný, ale čítaný ako nedodanie.',
    'ab.ml.dForgotten': '<strong>SKU nie je v systéme</strong>: zmluvné SKU, ktoré nebolo nikdy nakonfigurované v internom engine, takže jeho objem sa nikdy nezapočítal.',
    'ab.ml.dExpired': '<strong>Objednané v okne, dodané neskoro</strong>: dátum objednávky/faktúry je vnútri zmluvného okna, ale vyloženie sa uskutočnilo po jeho uzavretí — stále oprávnené.',
    'ab.ml.dFound': '<strong>Neskôr nájdená paleta</strong>: nedoskenovaná paleta nájdená dodatočne na tej istej objednávke v okne.',
    'ab.ml.dReturn': '<strong>Zamietnutie vrátenia</strong>: zamietnuté vrátenie nesprávne odstránené z kvalifikačného objemu, potom obnovené.',
    'ab.ml.dOverage': '<strong>Nadmnožstvo</strong>: dodatočné jednotky dodané nad objednané množstvo a zadržané.',
    'ab.ml.dBackorder': '<strong>Backorder</strong>: backorderované jednotky dodané v rámci kvalifikačného kontrolného obdobia.',
    'ab.ml.dLate': '<strong>Oneskorená zásielka</strong>: oneskorená zásielka, ktorá stále spadá do kontrolného obdobia.',
    'ab.ml.dPanEu': '<strong>Pan-EU rozdelenie</strong>: objemy SK/PL/CZ merané samostatne, keď zmluva umožňuje ich kombináciu do jedného objemu vyššej úrovne.',
    'ab.ml.scoreH': 'Ako sa zistenia skórujú', 'ab.ml.scoreP': 'Zoradenie je transparentný vážený kompozit štyroch signálov — reprodukovateľný z dát, žiadna čierna skrinka:',
    'ab.ml.sMagnitude': '<strong>magnitude</strong> — získateľná suma vo vzťahu k rovesníkom (z-skóre, normalizované 0–1).',
    'ab.ml.sLift': '<strong>lift</strong> — o koľko nárok prevyšuje nárokované (ako veľmi engine nedostatočne nárokoval).',
    'ab.ml.sDriver': '<strong>driverPressure</strong> — koľko odlišných ovládačov úniku sa dotýka zmluvy.',
    'ab.ml.sTier': '<strong>tierProximity</strong> — ako blízko sedí rekonštruovaný objem k ďalšej úrovni.',
    'ab.ml.outputH': 'Čo vám každé zistenie poskytne', 'ab.ml.outputP': 'Každé zistenie sa rozbalí do príbehu v jednoduchom jazyku, tabuľky „odkiaľ objem pochádza“ (základ + jednotky na ovládač), tabuľky peňazí pred→po, roll-upu podľa krajín a príjemiek za základným objemom — potom akcia Skontrolovať dokument, ktorá dokáže vygenerovať Contra-COGS faktúru pre dodávateľa, exportovať nárok ako CSV/XML alebo zamietnuť a archivovať návrh.',
    'ab.h.trueup': 'True-Up', 'ab.p.trueup': 'Výstupom obnovy je CCOGS True-Up: ťarchopis vystavený vami dodávateľovi za rozdiel v zľave. Rozpisuje každú príčinu, ale ako hlavný uvádza kumulatívny posun úrovne. Zo Skontrolovať dokument môžete vygenerovať profesionálnu Contra-COGS faktúru pre dodávateľa (strany obrátené podľa pravidiel vyrovnania, popisy písané pre dodávateľa), exportovať ju ako CSV alebo XML pre fakturáciu, alebo ju zamietnuť a archivovať, aby zmizla zo zoznamu návrhov.',
    'ab.h.finance': 'Finančný prehľad', 'ab.p.finance': 'Finančný prehľad rámcuje celé portfólio ako úspory a výnosy: nárokované enginom (pred) → nárok podľa nástroja (po), celkový získateľný True-Up a navýšenie, procesná cesta ukazujúca, kde sa tovar zasekne, a typy problémov v každej fáze, obnova rozdelená podľa dodávateľa, rozsahu, obdobia a dĺžky zmluvy (s mierou zlyhania na dĺžku) a tabuľka najväčších príležitostí zoskupená podľa dodávateľa a platnosti zmluvy.',
    'ab.h.roles': 'Roly', 'ab.p.roles': 'Prehliadať môže každý. Zapisovacie akcie — schváliť, exportovať a vložiť do fakturácie — sú vyhradené pre rolu Finančný schvaľovateľ, vybranú v bočnom paneli. Roly Analytik a Finančný prehľad sú iba na čítanie.',
    'ab.h.nav': 'Orientácia', 'ab.p.nav': 'Pomocou bočného panela sa presúvajte medzi fázami; vo Vstupoch použite podzáložky (každá zobrazuje živý počet dokumentov) alebo dlaždice Súhrn. Jazyk kedykoľvek prepnite vlajkami — celé rozhranie ho nasleduje. Túto príručku otvorte tlačidlom ⓘ About pod prepínačom jazyka.',
    'ab.h.glossary': 'Slovník',
    'ab.g.ccogs': 'Contra Cost of Goods Sold — zľava dodávateľa, ktorá znižuje vaše efektívne náklady na tovar, získaná na objeme nákupu.',
    'ab.g.trueupT': 'True-Up', 'ab.g.trueup': 'Získateľný rozdiel medzi tým, na čo ste mali nárok, a tým, čo engine skutočne nárokoval, vystavený ako ťarchopis.',
    'ab.g.vir': 'Volume Incentive Rebate — stupňovitá štruktúra zľavy, ktorej sadzba rastie s kvalifikačným objemom.',
    'ab.g.tierT': 'Úroveň zľavy', 'ab.g.tier': 'Objemový prah, ktorý odomkne vyššiu sadzbu zľavy; jeho prekročenie môže precenit celý kvalifikačný objem (retrospektívne) alebo len jednotky v pásme (kĺzavo).',

    'ab.g.windowT': 'Zmluvné okno', 'ab.g.window': 'Obdobie platnosti zmluvy (mesačné, štvrťročné, polročné alebo ročné); oprávnenosť sa riadi dátumom objednávky/faktúry vnútri neho.',

    // ---- About & Manual ----
    tocTitle: 'Spis treści',
    'ab.intro': 'Jak VIR_Tier zbiera Twoje dokumenty, rekonstruuje wolumen, do którego naprawdę się kwalifikowałeś, i zamienia różnicę w możliwy do odzyskania Contra-COGS True-Up. Czytaj od góry do dołu lub przejdź do sekcji.',
    'ab.tocTitle': 'Spis treści',
    'ab.h.overview': 'Co robi', 'ab.p.overview': 'VIR_Tier odzyskuje niedoszacowane rabaty wolumenowe (Contra-COGS). Dostawcy wypłacają rabat rosnący wraz z wolumenem zakupów, ale wewnętrzny silnik CCOGS często liczy mniejszy wolumen, niż faktycznie kupiłeś — towar dostarczony, ale niezeskanowany w magazynie głównym, umowne SKU nigdy nieskonfigurowane, palety odnalezione po niedoskanowaniu lub wolumeny pan-EU mierzone kraj po kraju zamiast łącznie. Każde pominięcie utrzymuje Cię w niższym progu rabatu. VIR_Tier rekonstruuje rzeczywisty wolumen kwalifikujący, ustala próg, który powinieneś osiągnąć, i przygotowuje True-Up, który możesz odzyskać od dostawcy.',
    'ab.h.data': 'Jak pozyskuje dane', 'ab.p.data': 'Przy uruchomieniu narzędzie łączy się z Twoimi systemami i zbiera najnowsze dokumenty z trzech rodzajów źródeł, a następnie konsoliduje wszystko według umowy z dostawcą:',
    'ab.src.db': '<strong>Baza umów rabatowych</strong> — umowy: zestawy SKU, drabinki progów rabatowych, okresy ważności i reguły pomiaru.',
    'ab.src.api': '<strong>API dostawców i marketplace</strong> — faktury i wynik silnika CCOGS (co już zgłoszono).',
    'ab.src.wh': '<strong>Kanały magazynowe</strong> — dowody dostawy i przyjęcia towarów (GRN/RECADV) według magazynu, w tym który węzeł zeskanował towar.',
    'ab.h.stages': 'Trzy etapy', 'ab.p.stages': 'Pasek boczny prowadzi od lewej do prawej przez pipeline:',
    'ab.stg.inputs': '<strong>Wejścia i zbieranie</strong> — przeglądaj każdy wczytany dokument według typu i otwórz stronę Podsumowanie z wynikiem zbierania i dopasowania.',
    'ab.stg.ml': '<strong>ML Discovery</strong> — uszeregowana lista możliwych do odzyskania okazji, każda w pełni wyjaśniona.',
    'ab.stg.overview': '<strong>Przegląd finansowy</strong> — obraz oszczędności i przychodów portfela, ścieżka procesu oraz odzysk według dostawcy, zakresu, okresu i czasu trwania umowy.',
    'ab.h.inputs': 'Wejścia, dokumenty i podsumowanie', 'ab.p.inputs': 'Każde wejście to prawdziwy, możliwy do wyświetlenia dokument. Kliknij dowolną kartę, aby go otworzyć, wydrukować lub pobrać:',
    'ab.doc.invoice': '<strong>Faktura</strong> — faktura dostawcy z rozbiciem pozycji według składu.',
    'ab.doc.dn': '<strong>Dowód dostawy</strong> — nagłówek w stylu faktury (wysłane ze sklepu → dostarczyć do) plus ścieżka procesu na dole.',
    'ab.doc.grn': '<strong>Przyjęcie towaru (GRN)</strong> — zamówione vs przyjęte vs zaakceptowane według magazynu, z własną ścieżką.',
    'ab.doc.event': '<strong>Wyjątek / powiadomienie OSD</strong> — zdarzenie brakujących danych (nadwyżka, niedobór, backorder itp.).',
    'ab.doc.engine': '<strong>Podsumowanie silnika CCOGS</strong> — stan „przed”: co silnik policzył i zgłosił.',
    'ab.doc.agreement': '<strong>Umowa</strong> — umowa rabatowa w stylu prawnym (strony, okres, harmonogram SKU, drabinka progów, rozliczenie).',
    'ab.p.summary': 'Strona Podsumowanie pokazuje wczytane wolumeny, potwierdza, że zbieranie i dopasowanie są zakończone, i przekazuje Cię do ML Discovery.',
    'ab.h.ml': 'ML Discovery — jak działa mapowanie', 'ab.p.ml': 'ML Discovery to miejsce, gdzie narzędzie łączy wszystko w całość. Nie wymyśla liczb: każda wartość jest zrekonstruowana z zebranych dokumentów, a każde uszeregowanie jest odtwarzalne. Nazwa „ML” odnosi się do przejrzystej, wyjaśnialnej heurystyki — nie do czarnej skrzynki. Oto pełny proces od początku do końca.',
    'ab.ml.pipelineH': 'Proces mapowania od początku do końca',
    'ab.ml.step1': '<strong>Konsolidacja według umowy.</strong> Faktury, dowody dostawy, przyjęcia towarów, zdarzenia brakujących danych i wynik silnika CCOGS są grupowane pod umową dostawcy, do której należą, i przypisywane do właściwego okresu kontrolnego (data przyjęcia / przeniesienia kontroli, a nie data faktury).',
    'ab.ml.step2': '<strong>Ustalenie wolumenu bazowego.</strong> Narzędzie sumuje wolumen, który silnik faktycznie zobaczył — już policzone przyjęcia towarów — w podstawie umowy (jednostki, waga lub wartość).',
    'ab.ml.step3': '<strong>Wykrywanie sterowników wycieku.</strong> Skanuje dokumenty pod kątem konkretnych sytuacji, w których rzeczywisty, dostarczony wolumen został pominięty: pominięcie skanu w magazynie głównym po przekierowaniu, umowne SKU nigdy nieskonfigurowane w silniku, paleta odnaleziona po niedoskanowaniu, zamówienie w oknie dostarczone po jego zamknięciu, błędnie usunięte zwroty, zatrzymana nadwyżka i inne.',
    'ab.ml.step4': '<strong>Rekonstrukcja rzeczywistego wolumenu kwalifikującego.</strong> Każdy sterownik przywraca swoje jednostki do bazy, przestrzegając kwalifikowalności (data zamówienia/faktury wewnątrz okna umowy — dostawa może być późniejsza) i deduplikacji (fizyczne przyjęcie nigdy nie jest liczone dwukrotnie). Umowy pan-EU łączą SK/PL/CZ w jeden wolumen kwalifikujący.',
    'ab.ml.step5': '<strong>Ponowne ustalenie progu.</strong> Zrekonstruowany wolumen przechodzi przez drabinkę rabatową umowy, aby znaleźć próg — a więc stawkę — który faktycznie osiągnąłeś, w porównaniu z niższym progiem, na którym zatrzymał się silnik.',
    'ab.ml.step6': '<strong>Obliczenie True-Up.</strong> Należny CCOGS (zrekonstruowany wolumen × osiągnięta stawka) minus pierwotne roszczenie silnika = możliwy do odzyskania True-Up. Jest rozpisany: wiersz podwyższenia progu na wolumenie bazowym plus jeden wiersz na każdą korektę sterownika, sumujące się do głównej skumulowanej różnicy (np. 1% → 2%).',
    'ab.ml.step7': '<strong>Punktacja i ranking.</strong> Każda okazja otrzymuje przejrzysty wynik priorytetu, abyś najpierw zajął się najbardziej wartościowymi i najpewniejszymi. Nic nie jest ukryte — rozwiń dowolne ustalenie, aby zobaczyć dokładnie, skąd wzięła się każda jednostka i każde euro.',
    'ab.ml.driversH': 'Rozpoznawane sterowniki wycieku', 'ab.ml.driversP': 'Każdy sterownik to prawdziwy, wyjaśnialny powód, dla którego dostarczony wolumen pozostał niepoliczony:',
    'ab.ml.dReroute': '<strong>Przekierowane — pominięty skan</strong>: towar wysłany do magazynu miejskiego bez skanu przy rozładunku w magazynie głównym; dostarczony, ale odczytany jako niedostarczenie.',
    'ab.ml.dForgotten': '<strong>SKU nie ma w systemie</strong>: umowne SKU, które nigdy nie zostało skonfigurowane w wewnętrznym silniku, więc jego wolumen nigdy nie został policzony.',
    'ab.ml.dExpired': '<strong>Zamówione w oknie, dostarczone z opóźnieniem</strong>: data zamówienia/faktury jest wewnątrz okna umowy, ale rozładunek nastąpił po jego zamknięciu — nadal kwalifikuje się.',
    'ab.ml.dFound': '<strong>Paleta odnaleziona później</strong>: niedoskanowana paleta odnaleziona później na tym samym zamówieniu w oknie.',
    'ab.ml.dReturn': '<strong>Odrzucenie zwrotu</strong>: odrzucony zwrot błędnie usunięty z wolumenu kwalifikującego, następnie przywrócony.',
    'ab.ml.dOverage': '<strong>Nadwyżka</strong>: dodatkowe jednostki dostarczone ponad zamówioną ilość i zatrzymane.',
    'ab.ml.dBackorder': '<strong>Backorder</strong>: jednostki z backorderu dostarczone w kwalifikującym okresie kontrolnym.',
    'ab.ml.dLate': '<strong>Opóźniona wysyłka</strong>: opóźniona wysyłka, która nadal mieści się w okresie kontrolnym.',
    'ab.ml.dPanEu': '<strong>Podział pan-EU</strong>: wolumeny SK/PL/CZ mierzone osobno, gdy umowa pozwala połączyć je w jeden wolumen wyższego progu.',
    'ab.ml.scoreH': 'Jak punktowane są ustalenia', 'ab.ml.scoreP': 'Ranking to przejrzysty ważony kompozyt czterech sygnałów — odtwarzalny z danych, bez czarnej skrzynki:',
    'ab.ml.sMagnitude': '<strong>magnitude</strong> — kwota możliwa do odzyskania względem porównywalnych (z-score, znormalizowana 0–1).',
    'ab.ml.sLift': '<strong>lift</strong> — o ile należne przewyższa zgłoszone (jak bardzo silnik zaniżył roszczenie).',
    'ab.ml.sDriver': '<strong>driverPressure</strong> — ile odrębnych sterowników wycieku dotyka umowy.',
    'ab.ml.sTier': '<strong>tierProximity</strong> — jak blisko zrekonstruowany wolumen leży kolejnego progu.',
    'ab.ml.outputH': 'Co daje Ci każde ustalenie', 'ab.ml.outputP': 'Każde ustalenie rozwija się w opowieść prostym językiem, tabelę „skąd wziął się wolumen” (baza + jednostki na sterownik), tabelę pieniędzy przed→po, zestawienie według krajów oraz przyjęcia towarów za wolumenem bazowym — a następnie akcję Przejrzyj dokument, która może wygenerować fakturę Contra-COGS dla dostawcy, wyeksportować roszczenie jako CSV/XML albo odrzucić i zarchiwizować sugestię.',

    <div class="boot">

      <button class="btn" id="docPrint">${t('print')}</button>
      <button class="btn" id="docDl">${t('download')}</button>
      <button class="btn ghost" id="docClose">${t('close')}</button>
    </div></div></div>`;
  document.body.appendChild(holder);
  initTooltips(holder);
  const close = () => holder.remove();
  holder.querySelector('#docBg').addEventListener('click', (e) => { if (e.target.id === 'docBg') close(); });
  holder.querySelector('#docClose').addEventListener('click', close);
  holder.querySelector('#docDl').addEventListener('click', () => { const r = rawFor(cat, o); download(r.name, r.text, r.type); });
  holder.querySelector('#docPrint').addEventListener('click', () => printHtml(docHtml(cat, o)));
}
function downloadDoc(spec) { const [cat, id] = spec.split('|'); const o = findDoc(cat, id); if (!o) return; const r = rawFor(cat, o); download(r.name, r.text, r.type); }

function printHtml(inner) {
  const w = window.open('', '_blank'); if (!w) return;

  w.document.close(); w.focus(); w.print();
}

// ---- Export as CSV/XML (format chooser dialog) ----
function chargeToXml(charge) {
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const lines = (charge.lines || []).map((l) =>
    `    <line cause="${esc(l.cause)}" driver="${esc(l.driver)}" qty="${l.qty ?? ''}" fromPct="${l.fromPct ?? ''}" toPct="${l.toPct ?? ''}" deltaValue="${l.deltaValue ?? ''}"/>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<contraCogsCharge>
  <chargeId>${esc(charge.chargeId)}</chargeId>
  <documentType>${esc(charge.docType)}</documentType>
  <agreementId>${esc(charge.agreementId)}</agreementId>
  <supplierId>${esc(charge.supplierId ?? '')}</supplierId>
  <scopeKey>${esc(charge.scopeKey)}</scopeKey>
  <period>${esc(charge.period)}</period>
  <claimedCcogs>${charge.claimedCcogs}</claimedCcogs>
  <entitledCcogs>${charge.entitledCcogs}</entitledCcogs>
  <variance>${charge.variance}</variance>
  <currency>${esc(charge.currency)}</currency>
  <eurEquivalent>${charge.eurEquivalent ?? ''}</eurEquivalent>
  <tierFromPct>${charge.tierFromPct ?? ''}</tierFromPct>
  <tierToPct>${charge.tierToPct ?? ''}</tierToPct>
  <status>${esc(charge.status)}</status>
  <lines>
${lines}
  </lines>
</contraCogsCharge>`;
}

function openArchiveDialog(chargeId) {
  const charge = state.charges.find((c) => c.chargeId === chargeId); if (!charge) return;
  const holder = document.createElement('div');
  holder.innerHTML = `<div class="modal-bg" id="arBg"><div class="modal">
    <h2>${t('archiveTitle')}</h2>
    <div class="sub">${charge.chargeId} · ${charge.agreementId} · ${charge.scopeKey}</div>

    <textarea class="dlg-comment" id="arComment" placeholder="…"></textarea>

  document.body.appendChild(holder);
  const close = () => holder.remove();

    close(); render(); flash(t('archivedMsg'));

// Archive a suggestion: record it and drop the matching finding + charge so it
// no longer appears in the ML suggested list.
function archiveFinding(charge, comment) {
  state.archived.push({ chargeId: charge.chargeId, agreementId: charge.agreementId, scopeKey: charge.scopeKey, comment, at: new Date().toISOString() });
  state.discovery.findings = state.discovery.findings.filter((f) => !(f.agreementId === charge.agreementId && f.scopeKey === charge.scopeKey));
  state.charges = state.charges.filter((c) => c.chargeId !== charge.chargeId);
}

function flash(text) { const el = document.createElement('div'); el.className = 'flash'; el.textContent = text; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
function download(name, text, type = 'text/csv') { const blob = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

// ---- bootstrap ----
async function main() {
  const manifest = await loadManifest();
  state.fx = await loadFx();
  const sources = demoSources(manifest, folderFetcher);
  await runBoot(app, sources);

  const files = [];
  for (const [category, names] of Object.entries(manifest.categories)) for (const name of names) files.push({ category, name, text: await folderFetcher(category, name) });
  const ingested = ingestFiles(files);
  state.consolidated = consolidate(ingested);
  // populate the store so the inputs browser can list documents
  state.store.putAll('agreements', ingested.agreements);
  state.store.putAll('invoices', ingested.invoices);
  state.store.putAll('deliveryNotes', ingested.delivery_notes);
  state.store.putAll('receipts', ingested.receipts);
  state.store.putAll('events', ingested.events);
  state.store.putAll('ccogsEngine', ingested.ccogs_engine);
  recompute();
  render();
}

function startApp() { main().catch((e) => { app.innerHTML = `<div class="work"><h2>Startup error</h2><pre class="mono">${e.message}</pre></div>`; }); }

// ---- demo login gate (same credentials as the Perfumeries tool) ----
const DEMO_CREDS = { user: 'Finance', pass: 'Pegasus' };
const $ = (id) => document.getElementById(id);

function enterApp() {
  const ls = $('login-screen'); if (ls) ls.hidden = true;
  const ds = $('denied-screen'); if (ds) ds.hidden = true;
  app.hidden = false;
  startApp();
}
function showDenied() {
  const ls = $('login-screen'); if (ls) ls.hidden = true;
  app.hidden = true;
  const ds = $('denied-screen'); if (ds) ds.hidden = false;
}
function applyLoginI18n() {
  if ($('login-sub')) $('login-sub').textContent = t('tagline');
  if ($('login-user-label')) $('login-user-label').textContent = t('loginUser');
  if ($('login-pass-label')) $('login-pass-label').textContent = t('loginPass');
  if ($('login-btn')) $('login-btn').textContent = t('loginSignIn');
  if ($('login-note')) $('login-note').textContent = t('loginNote');
  if ($('denied-title')) $('denied-title').textContent = t('loginDeniedTitle');
  if ($('denied-body')) $('denied-body').textContent = t('loginDeniedBody');
  if ($('denied-back')) $('denied-back').textContent = t('loginBack');
}
function wireLogin() {
  applyLoginI18n();
  const form = $('login-card');
  if (!form) { enterApp(); return; }   // no gate markup -> run ungated
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const u = $('login-user').value.trim();
    const p = $('login-pass').value;
    if (u === DEMO_CREDS.user && p === DEMO_CREDS.pass) {
      enterApp();
    } else {
      const err = $('login-err'); err.textContent = t('loginError'); err.hidden = false;
      setTimeout(showDenied, 700);
    }
  });
  const back = $('denied-back');
  if (back) back.addEventListener('click', () => {
    $('denied-screen').hidden = true;
    $('login-screen').hidden = false;
    $('login-err').hidden = true;
    $('login-pass').value = '';
    try { $('login-user').focus(); } catch { /* ignore */ }
  });
  try { $('login-user').focus(); } catch { /* ignore */ }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wireLogin);
else wireLogin();
